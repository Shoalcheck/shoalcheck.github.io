      '<div class="matrix" style="grid-template-columns:104px repeat(5,minmax(40px,1fr))">' +
      '<span></span>' + SEVN.map(function (n) {
        return '<span class="mh" style="text-align:center">' + n.slice(0, 4) + '</span>'; }).join('') +
      scCats.map(function (c) {
        return '<span class="mr"><i style="display:inline-block;width:7px;height:7px;border-radius:2px;' +
               'margin-right:5px;background:' + catVar(c) + '"></i>' + esc(c) + '</span>' +
          SEVN.map(function (n, k) {
            var v = (scm[c] || [])[k] || 0;
            /* hue names the category everywhere on this page — facet swatch,
               treemap cell, and now this row — so intensity is left free to be
               magnitude and nothing has to carry two meanings at once. */
            return '<button ' + heat(v, scMax, 'cat-' + c) + ' data-f="catsev" data-v="' + esc(c) + '|' + k + '" title="' +
              v + ' ' + n + ' ' + esc(c) + ' ' + noun(v, 'finding', 'findings') + '">' + (v || '') + '</button>';
          }).join(''); }).join('') + '</div>',
    basis: 'Severity is the rule\'s own judgement of consequence, not a score. ' +
      (t.n ? '<b>' + num(t.sev[0] + t.sev[1]) + '</b> of <b>' + num(t.n) + '</b> would wake somebody, ' +
             'and a category with many findings is not the same as a category with bad ones.'
           : 'There is nothing in this cut to rank — which is not the same as a cluster with nothing wrong.')
  });

  /* 4 — where the problems live */
  var nsRows = byKey(rows, NS);
  var nsGroups = top(t.ns, 8).map(function (e) {
    var key = e[0] === '(cluster)' ? '' : e[0];
    return { key: key, label: e[0], rows: nsRows[key] || [] };
  });
  h += panel({
    span: 'c6', title: 'Where the findings are', aside: 'length is how many · colour is how bad',
    body: sranks(nsGroups, { f: 'ns' }),
    basis: 'A finding is counted in the namespace of the resource its id was derived from, so it appears once. ' +
           'A long grey bar and a short red one are not the same problem.'
  });

  /* 4b — where the mass comes from. On the reference cluster eight rules carry
          two thirds of every finding, which is the single most actionable fact
          on this page: the queue is shorter than its count suggests. */
  var ruleCat = {}, ruleN = {};
  for (var ri = 0; ri < rows.length; ri++) {
    var rr = rows[ri];
    ruleN[rr[RULE]] = (ruleN[rr[RULE]] || 0) + 1;
    ruleCat[rr[RULE]] = rr[CAT];
  }
  var ruleKeys = Object.keys(ruleN).sort(function (a, b) { return ruleN[b] - ruleN[a]; });
  var tmEntries = ruleKeys.map(function (k) { return { k: k, v: ruleN[k], cat: ruleCat[k] }; });
  var covered = 0, need = Math.ceil(t.n * 0.66), nRules = 0;
  for (var ci = 0; ci < tmEntries.length && covered < need; ci++) { covered += tmEntries[ci].v; nRules++; }
  h += panel({
    span: 'c6', title: 'What generates the findings', aside: 'the ten rules carrying the most, by name',
    body: (tmEntries.length ? massBars(tmEntries, t.n) : '<p class="note">Nothing in this cut.</p>') +
      '<div class="tlegend">' + CATS.filter(function (c) { return t.cat[c]; }).map(function (c) {
        return '<span><i style="background:' + catVar(c) + '"></i>' + c + ' ' + num(t.cat[c]) + '</span>'; }).join('') + '</div>',
    basis: ruleKeys.length
      ? '<b>' + num(nRules) + '</b> of <b>' + num(ruleKeys.length) + '</b> rules account for two thirds of this cut. ' +
        'A rule is one check, so a large cell is one decision, not ' + num(tmEntries[0] ? tmEntries[0].v : 0) + ' of them.'
      : 'No rule produced a finding in this cut. A rule that produced none either found nothing or never ran, ' +
        'and this panel does not distinguish them — the method workspace does.'
  });

  /* 5 — compliance, with the honest denominator */
  var sc = D.score || {};
  h += panel({
    span: 'c6', title: 'Compliance coverage',
    /* "0 of 0 in scope have an automated check" is what this said on a reading written before the engine
       recorded its coverage: the build checks 28, the reading simply does not carry the number. An absence
       is never a zero here, so the sentence changes rather than the figure. */
    aside: sc.checkable ? sc.checkable + ' of ' + (sc.inScope || 0) + ' in scope have an automated check'
      : 'this reading does not record how many controls its build could check',
    body: '<div class="cov">' +
      [['PASS', sc.passed, 'ok'], ['FAIL', sc.failed, 'bad'], ['MANUAL', sc.manual, 'unk'], ['N/A', sc.na, 'unk']]
        .filter(function (x) { return x[1]; })
        .map(function (x) {
          return '<button style="flex:' + x[1] + ';background:var(--' + x[2] + '-bg);color:var(--' + x[2] + ')" title="' + x[1] + ' ' + x[0] + '">' +
            '<span>' + x[1] + '</span><small>' + x[0] + '</small></button>'; }).join('') +
      '</div>' +
      '<p class="note">Measured against <b>' + esc(D.score.framework || 'CIS Kubernetes Benchmark') +
      '</b>. A control is never passed on a read that did not happen.' +
      (sc.withheld ? ' <b>No pass rate.</b> ' + esc(sc.withheld) : '') + '</p>',
    basis: '<b>' + (sc.total || 0) + '</b> controls · <b>' + (sc.checkable || 0) +
      '</b> checkable in this build · <b>' + (sc.inScope || 0) + '</b> in scope once provider-managed rows are removed'
  });

  /* 6 — what it could not see. Nobody else prints this, and for a while it did not print the largest one.
     THIS PANEL SAID "nothing withheld" AND "Every clock this build knows how to read was read" over a
     reading where every resource list had failed. It only ever knew about the CLOCKS the calendar could not
     assess; a kind that did not come back was not a clock, so the one panel whose entire job is to state
     absences was the one place the biggest absence did not reach. */
  var na = D.notAssessed || [];
  var unread = (D.method && D.method.unread) || [];
  var couldNot = '';
  if (unread.length) {
    var uOrder = [], uBy = {};
    unread.forEach(function (k) {
      var c = k.cause || 'cause not recorded';
      if (!uBy[c]) { uBy[c] = []; uOrder.push(c); }
      uBy[c].push(k.kind);
    });
    couldNot += '<ul style="margin:0 0 8px;padding-left:17px;display:flex;flex-direction:column;gap:6px">' +
      uOrder.map(function (c) {
        return '<li><b class="mono">' + uBy[c].map(esc).join(', ') + '</b> — <span class="dim">' + esc(c) + '</span></li>';
      }).join('') + '</ul>';
  }
  couldNot += na.length
    ? '<ul style="margin:0;padding-left:17px;display:flex;flex-direction:column;gap:6px">' +
      na.map(function (x) { return '<li><b class="mono">' + esc(x.c) + '</b> — <span class="dim">' + esc(x.why) + '</span></li>'; }).join('') + '</ul>'
    : (unread.length ? '' : '<p class="note">Every clock this build knows how to read was read.</p>');
  var asideBits = [];
  if (unread.length) asideBits.push(plural(unread.length, 'resource kind', 'resource kinds') + ' not read');
  if (na.length) asideBits.push(plural(na.length, 'clock', 'clocks') + ' unread');
  h += panel({
    span: 'c6', title: 'What this reading could not see',
    aside: asideBits.length ? asideBits.join(' · ') : 'nothing withheld',
    body: couldNot,
    basis: 'An absence is reported as an absence. Secret and ConfigMap values, environment variables, logs and node shells are never read at all.'
  });

  return h;
}

function wsBlast(rows, t) {
  var h = '';
  // The findings that stop a node or a zone from being emptied: preflight.StopRules, held equal to this list by
  // internal/gatecheck. A rule the preflight counts and this list misses leaves its node unmarked on the map while
  // `preflight drain` says the node cannot be evacuated.
  var blockedRules = { 'k8s.reliability.node-drain-budget':1, 'k8s.reliability.node-drain-unmanaged-pod':1,
                       'k8s.reliability.node-pinned-volume':1, 'k8s.reliability.node-loss-feasibility':1,
                       'k8s.reliability.zone-loss-feasibility':1, 'k8s.reliability.zone-pinned-volume':1,
                       'k8s.upgrade.node-pool-cannot-roll':1 };
  var blockedNodes = {}, blast = [];
  for (var i = 0; i < R.length; i++) {
    if (!blockedRules[R[i][RULE]]) continue;
    blast.push(R[i]);
    var m = /\b(ip-[\w.-]+|aks-[\w-]+|gke-[\w-]+)/.exec(R[i][TITLE] + ' ' + R[i][WL]);
    if (m) blockedNodes[m[1]] = (blockedNodes[m[1]] || 0) + 1;
  }

  var zones = D.azs || [];
  h += panel({
    span: 'c12', title: 'The cluster, by failure domain',
    aside: plural(zones.length, 'zone', 'zones') + ' · ' + plural(D.nodes, 'node', 'nodes'),
    body: '<div class="zones">' + zones.map(function (z) {
      var cnt = {}; z.nodes.forEach(function (n) { cnt[n.t] = (cnt[n.t] || 0) + 1; });
      return '<div class="zone"><div class="zn"><b>' + esc(z.name) + '</b><span>' + z.nodes.length + ' nodes</span>' +
        '<span class="mono" style="font-size:9.5px">' + esc(Object.keys(cnt).map(function (k) { return cnt[k] + '× ' + k; }).join(' · ')) + '</span></div>' +
        '<div class="nodes">' + z.nodes.map(function (n) {
          var bad = blockedNodes[n.n];
          return '<button class="node' + (bad ? ' blocked' : '') + '" data-f="q" data-v="' + esc(n.n) + '" title="' +
            esc(n.n + ' · ' + n.t + ' · ' + (n.cap || 'capacity unresolved')) + (bad ? ' · ' + plural(bad, 'finding names', 'findings name') + ' this node' : '') + '">' +
            '<b><span class="tag" style="background:var(--' + (n.cap === 'spot' ? 'spot' : n.cap === 'on-demand' ? 'od' : 'unk') + ')"></span>' + esc(short(n.n, 15)) + '</b>' +
            /* U+21AF is not in the mono face and rendered as an empty box on every
               marked node — the most alarming state in this panel was drawn as a
               glyph error. The count says what it is. */
            '<span>' + esc(n.t) + (bad ? ' · ' + bad + (bad > 1 ? ' findings' : ' finding') : '') + '</span></button>';
        }).join('') + '</div></div>';
    }).join('') + '</div>' +
      /* A legend entry for a state no node is in teaches the reader that the state
         is absent from the drawing, not from the cluster. Only what occurs. */
      (function () {
        var seen = {}, any = false;
        (D.azs || []).forEach(function (z) { z.nodes.forEach(function (n) {
          seen[n.cap || 'unresolved'] = 1; if (blockedNodes[n.n]) any = true; }); });
        var L = [];
        if (seen['on-demand']) L.push('<span><i style="background:var(--od)"></i>on-demand</span>');
        if (seen['spot']) L.push('<span><i style="background:var(--spot)"></i>spot</span>');
        if (seen['unresolved']) L.push('<span><i style="background:var(--unk)"></i>capacity unresolved</span>');
        if (any) L.push('<span><i style="background:var(--bad)"></i>named by a feasibility finding</span>');
        return '<div class="legend">' + L.join('') + '</div>';
      })(),
    basis: 'Zones come from the node label this reading found; a node carrying only the retired beta key is grouped by that key. ' +
      'A node is marked when a drain, zone-loss or roll finding names it — <b>this model checks a subset of what the scheduler checks</b>, so it can say a change will stop and never that one will succeed.'
  });

  h += panel({
    span: 'c6', title: 'What has nowhere to go',
    aside: plural(blast.length, 'feasibility finding', 'feasibility findings'),
    body: blast.length ? ranks(top(byKeyCount(blast, RULE), 6).map(function (e) {
        return { k: e[0], label: ruleShort(e[0]), v: e[1], f: 'rule' }; }), { mono: true })
      : '<p class="note">No node or zone in this reading leaves work with nowhere modelled to go.</p>',
    basis: 'A refusal here is sound because the model is <b>more permissive</b> than the scheduler: if it finds no fit, the scheduler finds none either. The positive does not follow and is never asserted.'
  });

  /* ── the question this workspace exists to answer ─────────────────────────
        A stacked bar of purchase mode degenerates to a single segment the moment
        a fleet is homogeneous — which is most fleets — and a bar chart of one
        category is a rectangle with a number in it. The variation that IS here is
        per zone: how much of the fleet each one holds, and what the reading says
        stops if it goes. */
  h += panel({
    span: 'c6', title: 'If one zone goes',
    aside: plural(zones.length, 'zone', 'zones') + ' · ' + plural(D.nodes, 'node', 'nodes'),
    body: (function () {
      var total = 0;
      zones.forEach(function (z) { total += z.nodes.length; });
      var named = {};
      blast.forEach(function (r) {
        zones.forEach(function (z) {
          if (String(r[TITLE]).indexOf(z.name) >= 0) named[z.name] = (named[z.name] || 0) + 1;
        });
      });
      return '<div class="zloss">' + zones.map(function (z) {
        var share = total ? Math.round(z.nodes.length / total * 100) : 0;
        var marked = 0;
        z.nodes.forEach(function (n) { if (blockedNodes[n.n]) marked++; });
        return '<button class="zl" data-f="q" data-v="' + esc(z.name) + '">' +
          '<span class="zn">' + esc(z.name) + '</span>' +
          '<span class="zbar"><span class="zf" style="width:' + share + '%;background:' +
            (named[z.name] ? 'var(--sev-1)' : 'var(--accent)') + '"></span></span>' +
          '<span class="zp">' + share + '%</span>' +
          '<span class="zm">' + plural(z.nodes.length, 'node', 'nodes') +
            (marked ? ' · <b>' + marked + ' marked</b>' : '') +
            (named[z.name] ? ' · ' + plural(named[z.name], 'finding names', 'findings name') + ' it' : '') + '</span>' +
          '</button>';
      }).join('') + '</div>';
    })(),
    basis: 'Share is of nodes, not of capacity or of traffic — a reading sees how many nodes a zone holds, ' +
           'not what they are carrying. A zone with no finding naming it is not thereby safe to lose.'
  });

  /* ── the fleet, where there is real variation to show ─────────────────── */
  h += panel({
    span: 'c6', title: 'What the fleet is made of',
    aside: plural((D.pools || []).length, 'instance type', 'instance types'),
    body: (function () {
      var pools = D.pools || [];
      if (!pools.length) return '<p class="note">No node pool was resolved in this reading.</p>';
      var maxN = 0, tot = 0;
      pools.forEach(function (p) { maxN = Math.max(maxN, p.n); tot += p.n; });
      return '<div class="pools">' + pools.slice().sort(function (a, b) { return b.n - a.n; }).map(function (p) {
        return '<div class="fl">' +
          '<span class="fn">' + esc(p.type) + '</span>' +
          '<span class="fs">' + esc(p.spec) + '</span>' +
          '<span class="fbar"><span class="ff" style="width:' + Math.round(p.n / maxN * 100) + '%"></span></span>' +
          '<span class="fc">' + p.n + '×</span>' +
          '<span class="fcap ' + (p.cap === 'spot' ? 'spot' : p.cap === 'on-demand' ? 'od' : 'unk') + '">' +
            esc(p.cap || 'unresolved') + '</span>' +
          '</div>';
      }).join('') + '</div>' +
      '<p class="note">A node whose purchase mode cannot be determined is counted as <b>unresolved</b>, never as ' +
      'on-demand — pricing a spot node at list would overstate the bill.</p>';
    })(),
    basis: 'Instance type and capacity label are read from the Node object. <b>No cloud credentials are used</b>; ' +
           'nothing here comes from a billing account.'
  });
  return h;
}

function byKeyCount(rows, k) { var m = {}; rows.forEach(function (r) { m[r[k]] = (m[r[k]] || 0) + 1; }); return m; }

function wsCost(rows, t) {
  var h = '', pools = D.pools || [];
  /* A POOL NOBODY COULD PRICE IS NOT A POOL THAT COSTS NOTHING.
     An unpriced pool arrives with cost 0, and this panel summed it into the total, printed "$0" under its
     own name and "9 × $0" beside it — then named "list-estimate" as the basis, because CostSource was
     stamped before the price lookup and the not-found branch left it alone. Measured on the degraded
     fixture: nine of twelve nodes contributing zero to a figure labelled "compute, list price", unmarked.
     internal/types now carries the fourth cost source and assemble stamps it, so the pool says so itself. */
  var unpricedPools = pools.filter(function (p) { return p.src === 'unpriced'; });
  var pricedPools = pools.filter(function (p) { return p.src !== 'unpriced'; });
  var poolTotal = pricedPools.reduce(function (a, p) { return a + p.cost * p.n; }, 0);
  var unpricedNodes = unpricedPools.reduce(function (a, p) { return a + p.n; }, 0);
  var excluded = unpricedPools.length
    ? ' · <b>' + unpricedPools.length + '</b> ' + noun(unpricedPools.length, 'pool', 'pools') + ' and <b>' + unpricedNodes + '</b> ' + noun(unpricedNodes, 'node', 'nodes') + ' unpriced and excluded'
    : '';

  h += panel({
    span: 'c7', title: 'Where the spend is',
    aside: pricedPools.length
      ? usd(poolTotal) + ' / mo across ' + plural(pricedPools.length, 'priced pool', 'priced pools') +
        (unpricedPools.length ? ' · ' + unpricedPools.length + ' unpriced' : '')
      : 'unpriced: no pool carries a rate',
    body: '<div style="display:flex;gap:3px;height:96px;border-radius:5px;overflow:hidden">' +
      pools.map(function (p) {
        var un = p.src === 'unpriced';
        var v = un ? 0 : p.cost * p.n;
        return '<div style="flex:' + Math.max(un ? 1 : v, 1) + ';background:var(' + (un ? '--sunk' : '--accent-bg') +
          ');border-top:3px solid var(' + (un ? '--fg-faint' : '--accent') + ');' +
          'padding:9px 11px;display:flex;flex-direction:column;justify-content:space-between;min-width:0">' +
          '<div style="min-width:0"><div class="mono" style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis">' + esc(p.type) + '</div>' +
          '<div style="font-size:10.5px;color:var(--fg-mid)">' + esc(p.spec) + '</div></div>' +
          (un
            ? '<div><div style="font-size:12px;font-weight:600;color:var(--fg-dim)">unpriced</div>' +
              '<div style="font-size:10px;color:var(--fg-mid)">' + plural(p.n, 'node', 'nodes') + ' · no rate for this type</div></div>'
            : '<div><div class="mono" style="font-size:14px;font-weight:600">' + usd(v) + '</div>' +
              '<div style="font-size:10px;color:var(--fg-mid)">' + p.n + ' × ' + usdCents(p.cost) + '</div></div>') +
          '</div>';
      }).join('') + '</div>' +
      (pricedPools.length
        ? '<p class="note">Width is share of monthly spend. Every figure is a <b>dated list price</b> for the region, embedded in the binary.' +
          roundingNote(pricedPools.map(function (p) { return p.cost * p.n; }), poolTotal, 'pool') +
          (unpricedPools.length
            ? ' A pool this build carries no rate for is drawn without a figure and left out of every total on this page — an unpriced pool is not a free one.'
            : '') + '</p>'
        : '<p class="note">No pool carries a rate in the price table this build embeds, so no box here has a figure or a ' +
          'width by spend. An unpriced pool is not a free one.</p>'),
    basis: pools.map(function (p) { return esc(p.type) + ' · ' + esc(p.src || 'list-estimate'); }).join(' · ') +
      (pricedPools.length ? ' — not your bill: a negotiated rate, a private offer or an existing commitment is invisible here.' : '')
  });

  var costRows = rows.filter(function (r) { return r[USD] > 0; });
  var ruleUsd = {}; costRows.forEach(function (r) { ruleUsd[r[RULE]] = (ruleUsd[r[RULE]] || 0) + r[USD]; });
  var ruleTop = top(ruleUsd, 6);
  h += panel({
    span: 'c5', title: 'What the rules identified', aside: PRICED ? usd(sumUsd(costRows)) + ' / mo identified' : 'unpriced',
    ranked: Object.keys(ruleUsd).length, shown: ruleTop.length,
    body: costRows.length ? ranks(ruleTop.map(function (e) {
          return { k: e[0], label: ruleShort(e[0]), v: e[1], display: usd(e[1]), f: 'rule' }; }), { mono: true })
      : '<p class="note">No finding in this cut carries a dollar figure.</p>',
    basis: '<b>' + num(costRows.length) + '</b> of <b>' + num(rows.length) + '</b> findings carry a figure at all. ' +
      'Identified is not realised — nothing here has been reclaimed.' +
      (Object.keys(ruleUsd).length <= 6
        ? roundingNote(Object.keys(ruleUsd).map(function (k) { return ruleUsd[k]; }), sumUsd(costRows), 'rule')
        : restOf(ruleUsd, ruleTop, 'rule', 'rules'))
  });

  /* Where the money sits, by the thing an engineer can actually act on. A rule
     says what to change; a workload says whose change it is. Both are needed and
     neither substitutes for the other. */
  var wlUsd = {}, nsUsd = {}, ci;
  for (ci = 0; ci < costRows.length; ci++) {
    var cr = costRows[ci];
    if (cr[WL]) wlUsd[cr[WL]] = (wlUsd[cr[WL]] || 0) + cr[USD];
    nsUsd[cr[NS] || '(cluster)'] = (nsUsd[cr[NS] || '(cluster)'] || 0) + cr[USD];
  }
  var wlTop = top(wlUsd, 7);
  h += panel({
    span: 'c6', title: 'Which workloads carry it', aside: 'a rule says what to change · this says whose',
    ranked: Object.keys(wlUsd).length, shown: wlTop.length,
    body: wlTop.length
      ? ranks(wlTop.map(function (e) {
          return { k: e[0], label: wlLabel(wlId(e[0])) || e[0], v: e[1],
                   display: usd(e[1]), f: 'wl', title: e[0] + ' — ' + usd(e[1]) + '/mo identified' };
        }), { mono: true })
      : costRows.length
        ? '<p class="note">No workload in this cut carries a dollar figure. Cluster-scoped findings hold the money.</p>'
        : '<p class="note">No finding in this cut carries a dollar figure.</p>',
    basis: Object.keys(wlUsd).length > wlTop.length
      ? 'Only findings that carry a figure appear.' + restOf(wlUsd, wlTop, 'workload', 'workloads') +
        ' Workloads lists every one; a workload in neither is unpriced, not free.'
      : 'Only findings that carry a figure appear. A workload absent here is not free — it is unpriced.'
  });

  var nsTop = top(nsUsd, 7);
  var nsMaxUsd = nsTop.length ? nsTop[0][1] : 0;
  h += panel({
    span: 'c6', title: 'And in which namespace', aside: 'identified $/mo, not billed $/mo',
    ranked: Object.keys(nsUsd).length, shown: nsTop.length,
    body: nsTop.length
      ? ranks(nsTop.map(function (e) {
          return { k: e[0] === '(cluster)' ? '' : e[0], label: e[0], v: e[1], display: usd(e[1]), f: 'ns',
                   title: e[0] + ' — ' + usd(e[1]) + '/mo across ' + plural((byKey(costRows, NS)[e[0] === '(cluster)' ? '' : e[0]] || []).length, 'finding', 'findings') };
        }), { mono: true })
      : '<p class="note">Nothing in this cut carries a dollar figure.</p>',
    basis: 'A namespace does not receive an invoice. This apportions identified savings to where the ' +
           'resource lives, which is a routing aid, not an allocation of spend.' +
           (Object.keys(nsUsd).length > nsTop.length ? restOf(nsUsd, nsTop, 'namespace', 'namespaces')
             : roundingNote(nsTop.map(function (e) { return e[1]; }), sumUsd(costRows), 'namespace'))
  });

  h += panel({
    span: 'c12', title: 'Spend against what was identified',
    body: !pricedPools.length
      ? '<p class="note">No pool carries a rate, so there is no compute figure to set what was identified against, ' +
        'and no percentage of it.</p>'
      : (function () {
      var ratio = poolTotal ? Math.min(100, sumUsd(costRows) / poolTotal * 100) : 0;
      return '<div style="display:flex;align-items:baseline;gap:var(--s5);flex-wrap:wrap">' +
        '<div class="fig"><span class="v">' + usd(poolTotal) + '</span><span class="k">compute, list price' +

function wsAccess(rows, t) {
  var h = '', chains = D.rbac || [], i;
  var RANK = { critical: 0, high: 1, medium: 2, low: 3 };
  /* rank(x) and not (RANK[x] || 4): critical is 0, and 0 is falsy, so the || form
     sent the most privileged binding to the BOTTOM of a list whose own label said
     "most privileged first". The panel was contradicting itself in public. */
  function rank(r) { var v = RANK[r]; return v == null ? 4 : v; }
  chains = chains.slice().sort(function (a, b) {
    return rank(a.risk) - rank(b.risk) || String(a.s).localeCompare(String(b.s));
  });

  /* ── the graph. A binding chain is subject  binding  role, and the fact a list
        cannot show is SHARING: one role reached by several subjects is a blast
        radius, and two subjects reaching the same role through different bindings
        is a duplicate somebody meant to delete. ── */
  var subj = {}, bind = {}, role = {}, edges = [];
  chains.forEach(function (c) {
    var si = 's:' + c.s, bi = 'b:' + c.b, ri = 'r:' + c.r, r = rank(c.risk);
    /* The collector names a subject "Group/…", "User/…" or "<namespace>/<name>" for a ServiceAccount, and
       the label follows it: a constant here drew Group/system:masters as a service account. */
    if (!subj[si]) subj[si] = { id: si, label: c.s, sev: r, f: 'q', v: c.s, worst: r,
                                sub: /^Group\//.test(c.s) ? 'Group' : /^User\//.test(c.s) ? 'User' : 'ServiceAccount' };
    else subj[si].sev = subj[si].worst = Math.min(subj[si].worst, r);
    if (!bind[bi]) bind[bi] = { id: bi, label: c.b, sub: 'binding', sev: null, f: 'q', v: c.b };
    /* These fit the node; the long form is in the tooltip and in the basis line.
       A subtitle that ends in an ellipsis has told the reader nothing. */
    if (!role[ri]) role[ri] = { id: ri, label: c.r,
                                sub: c.basis === 'rules' ? 'band from its own rules'
                                   : c.basis === 'name'  ? 'band from the name · kind refused'
                                                         : 'band from the name · role not read',
                                title: c.r + ' — ' + (c.basis === 'rules'
                                   ? 'band computed from this role\u2019s own PolicyRules'
                                   : c.basis === 'name'
                                   ? 'band inferred from the role name; the role kind was refused by RBAC'
                                   : 'band inferred from the role name; that role is not in this reading'),
                                sev: r, f: 'q', v: c.r, n: 0 };
    else role[ri].sev = Math.min(role[ri].sev, r);
    role[ri].n++;
    edges.push([si, bi]); edges.push([bi, ri]);
  });
  Object.keys(role).forEach(function (k) { if (role[k].n > 1) role[k].badge = role[k].n; });

  h += panel({
    span: 'c12', title: 'Who reaches what',
    aside: plural(Object.keys(subj).length, 'subject', 'subjects') + ' · ' + plural(Object.keys(bind).length, 'binding', 'bindings') +
           ' · ' + plural(Object.keys(role).length, 'role', 'roles'),
    body: '<div class="gwrap">' + drawLayered(
      [Object.keys(subj).map(function (k) { return subj[k]; }),
       Object.keys(bind).map(function (k) { return bind[k]; }),
       Object.keys(role).map(function (k) { return role[k]; })],
      edges,
      { heads: ['subject', 'binding', 'role'], nw: 250, colgap: 150,
        label: 'RBAC: which subjects reach which roles, and through which bindings' }) + '</div>' + '<div class="ghint"><span><b>hover</b> to trace</span><span><b>click</b> to pin</span><span><b>scroll</b> to zoom</span><span><b>drag</b> to pan</span><span><b>double-click</b> to reset</span></div>',
    basis: 'A role reached by more than one subject carries a count. The band is arithmetic over the role\'s own ' +
           'PolicyRules — <b>not a total</b>: effective permissions are the union over every binding naming a subject ' +
           'or any group it belongs to, and group membership is decided by the authenticator, which this reading cannot see.'
  });

  /* ── what the list still does better: the ordered ledger ── */
  h += panel({
    span: 'c7', title: 'The bindings, most privileged first',
    aside: chains.length + ' in this reading',
    body: '<div class="binds">' + chains.map(function (c) {
      return '<button class="bind" data-f="q" data-v="' + esc(c.r) + '"' +
        ' style="border-left-color:var(--sev-' + rank(c.risk) + ')">' +
        '<span class="bsev sv' + rank(c.risk) + '">' + esc(c.risk) + '</span>' +
        '<span class="bpath"><b>' + esc(c.s) + '</b><span class="arr" aria-label="grants"></span>' +
        '<span class="dim">' + esc(c.b) + '</span><span class="arr" aria-label="grants"></span><b>' +
        esc(c.r) + '</b></span>' +
        '</button>';
    }).join('') + '</div>',
    basis: 'Ordered by the band, then by subject. Every row is also a node in the drawing above.'
  });

  /* ── the one number an access reviewer asks for that nothing else answers ── */
  var subjNs = {}, priv = 0;
  chains.forEach(function (c) {
    var ns = String(c.s).indexOf('/') > 0 ? c.s.split('/')[0] : '(cluster)';
    (subjNs[ns] = subjNs[ns] || { n: 0, worst: 4 });
    subjNs[ns].n++;
    subjNs[ns].worst = Math.min(subjNs[ns].worst, rank(c.risk));
    if (rank(c.risk) <= 1) priv++;

    span: 'c5', title: 'Where the privilege sits', aside: 'by the subject\'s own namespace',
    body: '<div class="figs"><div class="fig"><span class="v ' + (priv ? 'bad' : 'ok') + '">' + num(priv) +
      '</span><span class="k">critical or high bindings</span></div>' +
      '<div class="fig"><span class="v sm">' + num(Object.keys(subj).length) + '</span><span class="k">subjects</span></div></div>' +
      ranks(Object.keys(subjNs).sort(function (a, b) { return subjNs[b].n - subjNs[a].n; }).map(function (k) {
        return { k: k === '(cluster)' ? '' : k, label: k, v: subjNs[k].n, f: 'ns',
                 title: k + ' — ' + plural(subjNs[k].n, 'binding', 'bindings') + ', worst band ' + SEVN[subjNs[k].worst] };
      }), { mono: true }),
    basis: 'A permission is not a use. Nothing here says a grant was exercised — the snapshot carries no audit log, ' +
           'and this product never reads one.'
  });
  return h;
}

  /* Four guardrails an auditor asks about by name, per namespace. Each cell is a

  var po = D.posture || [];

      basis: '<b>' + num(po.length) + '</b> ' + noun(po.length, 'namespace', 'namespaces') + ' the reading could list. A namespace absent from this ' +

  var ctrls = D.controls || [];
  if (ctrls.length) {

/* WHAT IT WOULD TAKE ANOTHER WAY. The measured read, then two other ways to cover it: an AI agent that reads the
   same objects once (tokens, the context it fills, each model's list price) and a person making the same checks
   by hand at a stated pace. Every figure is a floor or an assumption and the panel says which; nothing here is
   money or time "saved". */
function anotherWay(v) {
  function kb(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
  function unit(n) { return n >= 1e6 ? [1e6, ' million'] : n >= 1000 ? [1000, ' thousand'] : [1, '']; }
  function fig(n, u) { var x = n / u[0]; return u[0] === 1 ? num(n) : (x < 10 && x % 1 ? x.toFixed(1) : num(Math.round(x))); }
  /* "17–23 thousand", never "17 thousand–23 thousand": one unit for the range when both ends share it. */
  function tokRange(lo, hi) {
    var ul = unit(lo), uh = unit(hi);
    return ul[0] === uh[0] ? fig(lo, uh) + '–' + fig(hi, uh) + uh[1] : fig(lo, ul) + ul[1] + '–' + fig(hi, uh) + uh[1];
  }
  function usd(x) { return '$' + (x < 10 ? x.toFixed(2) : num(Math.round(x))); }
  function usdRange(lo, hi) { return hi < 0.01 ? 'under $0.01' : lo < 0.01 ? 'under $0.01–' + usd(hi) : usd(lo) + '–' + usd(hi); }
  var share = v.tokHi / v.context, pct = share < 0.01 ? '&lt;1%' : share < 10 ? Math.round(share * 100) + '%' : num(Math.round(share)) + '×';
  var top = v.models.reduce(function (a, m) { return Math.max(a, m.hi); }, 0) || 1;
  var h = '<div class="figs">' +
    '<div class="fig"><span class="v">' + num(v.objects) + '</span><span class="k">objects read</span></div>' +
    '<div class="fig"><span class="v">' + kb(v.bytes) + '</span><span class="k">as kubectl prints them</span></div>' +
    (v.pairs ? '<div class="fig"><span class="v">' + num(v.pairs) + '</span><span class="k">rule × object checks</span></div>' : '') +
    '</div>';
  h += '<p class="note" style="margin-top:var(--s3)"><b>An AI agent, just to read these ' + num(v.objects) + ' objects once:</b> ' +
    tokRange(v.tokLo, v.tokHi) + ' tokens — ' + pct + ' of a ' + fig(v.context, unit(v.context)) + unit(v.context)[1].replace(' ', '-') + '-token context window' +
    (share > 1 ? ', so it cannot hold them at once and must read a sample' : '') + '.</p>';
  h += '<div style="display:grid;gap:6px;margin-top:var(--s2);max-width:760px">' + v.models.map(function (m) {
    return '<div style="display:grid;grid-template-columns:140px 1fr 120px;gap:var(--s3);align-items:center;font-size:12px">' +
      '<span>' + esc(m.n.replace(/^Claude /, '')) + '</span>' +
      '<span style="height:8px;border-radius:4px;background:var(--line);overflow:hidden"><span style="display:block;height:100%;width:' +
        Math.max(2, Math.round(m.hi / top * 100)) + '%;background:var(--accent)"></span></span>' +
      '<span class="mono" style="text-align:right">' + usdRange(m.lo, m.hi) + '</span></div>';
  }).join('') + '</div>';
  if (v.hoursByHand) h += '<p class="note" style="margin-top:var(--s3)"><b>By hand:</b> ' + num(v.pairs) + ' checks × ' + v.secPerCheck +
    ' s: about ' + (v.hoursByHand < 10 ? v.hoursByHand.toFixed(1) : num(Math.round(v.hoursByHand))) + ' hours of a person opening objects and judging rules — the pace is an assumption. ' +
    'For scale, a single-cluster assessment is sold as 1–5 business days.</p>';
  return h;
}

function wsMethod(rows, t) {
  var h = '';
  // A COUNT NOBODY TOOK IS NEVER PRINTED AS ONE. With no session trace the island carries zeros, and three
  // zeros under "measured, not promised" read as a measurement. The sample is the sharp case: a synthetic
  // snapshot contacted no cluster, so there was nothing to count and no old build to blame.
  h += panel({
    span: 'c5', title: 'What this reading cost your cluster',
    body: D.trace.total
      ? '<div class="figs">' +
        '<div class="fig"><span class="v">' + num(D.trace.total) + '</span><span class="k">requests</span></div>' +
        '<div class="fig"><span class="v ' + (D.trace.writes ? 'bad' : 'ok') + '">' + num(D.trace.writes) + '</span><span class="k">object writes</span></div>' +
        '<div class="fig"><span class="v sm">' + num(D.trace.streams) + '</span><span class="k">streams</span></div></div>' +
        '<p class="note">Every request is counted by a recorder wrapped around the only transport the binary has. <b>Zero object writes is measured, not promised.</b></p>'
      : D.illustrative
        ? '<p class="note"><b>Nothing to count: this sample contacted no cluster.</b> The engine read a synthetic snapshot of ' + esc(D.cluster) +
          '. On a reading of your own cluster this panel counts every request, every object write and every stream the run made, from a recorder wrapped around the only transport the binary has.</p>'
        : '<p class="note">This reading carries no request count, so nothing here says how many requests it made or that it wrote nothing.</p>',
    basis: D.trace.total ? 'Counted by <b>internal/trace</b> during the run.'
      : D.illustrative ? 'An illustrative sample: a synthetic snapshot, no cluster, no requests.'
      : 'This reading recorded no session trace — a build older than the recorder produced it.'
  });
  if (D.volume) h += panel({ span: 'c12', title: 'What it would take another way', aside: 'a floor, not a saving', body: anotherWay(D.volume),
    basis: 'Bytes are these objects as <span class="mono">kubectl get -o yaml</span> prints them, managedFields omitted, ' +
      'read at 3–4 characters a token (the tokenizer is not public, so it is always the range). List input prices from ' +
      '<span class="mono">platform.claude.com</span>, ' + esc(D.volume.fetched) + '. A floor: no reasoning, no output, no object read twice — ' +
      'an agent loop re-sends its whole context on every call, so a real bill is a multiple of this.' +
      (D.illustrative ? ' <b>This sample\'s objects are synthetic and sparse</b> — about a kilobyte a pod, where real pods measured 5–9 KB — so a real cluster runs several times higher.' : '') });
  h += panel({
    span: 'c7', title: 'Dated obligations', aside: (D.calendar || []).length + ' with a clock',
    body: (D.calendar || []).length ? '<div style="display:flex;flex-direction:column;gap:var(--s3)">' +
      (D.calendar || []).map(function (c) {
        return '<div style="display:grid;grid-template-columns:96px 1fr;gap:var(--s3)">' +
          '<span class="mono" style="font-size:11.5px;' + (c.passed ? 'color:var(--bad)' : '') + '">' + esc(c.d) + '</span>' +
          '<span><span style="font-size:12px">' + esc(c.o) + '</span>' +
          '<br><span class="mono" style="font-size:10px;color:var(--fg-faint)">' +
          (c.passed ? 'this date has passed · ' : '') + 'source: ' + esc(c.src) + '</span></span></div>';
      }).join('') + '</div>' : '<p class="note">No dated obligation is on record among the clocks this run could read.</p>',
    basis: 'Each date is read from an object field or a dated reference table, and the row names which. Urgency words are banned in this block — the date is the fact.'
  });
  /* The claim boundaries carried by the rules that actually fired in this cut.
     Every other tool on the market prints what it found; the sentence a finding
     cannot support is the thing this product sells, so it gets a surface rather
     than a footnote. */
  var bcount = {}, bseen = {}, bi, bj;
  for (bi = 0; bi < rows.length; bi++) {
    var br = D.rules[rows[bi][RULE]];
    if (!br || !br.b || !br.b.length) continue;
    var key = rows[bi][RULE];
    for (bj = 0; bj < br.b.length; bj++) {
      var sent = br.b[bj];
      bcount[sent] = bcount[sent] || { rules: {}, n: 0 };
      bcount[sent].n++;
      bcount[sent].rules[key] = 1;
    }
    bseen[key] = 1;
  }
  var bkeys = Object.keys(bcount).sort(function (a, b) { return bcount[b].n - bcount[a].n; });
  h += panel({
    span: 'c12', title: 'What this reading refuses to establish',
    aside: bkeys.length ? plural(bkeys.length, 'distinct limit', 'distinct limits') + ' across ' + plural(Object.keys(bseen).length, 'rule', 'rules') : 'none recorded',
    body: bkeys.length
      ? '<div style="display:flex;flex-direction:column;gap:7px">' + bkeys.slice(0, 9).map(function (k) {
          var c = bcount[k];
          return '<div style="display:grid;grid-template-columns:1fr 152px;gap:var(--s3);align-items:baseline">' +
            '<span style="font-size:12px;line-height:1.45">' + esc(k) + '</span>' +
            '<span class="mono" style="font-size:10.5px;color:var(--fg-faint);text-align:right;white-space:nowrap">' +
            num(c.n) + ' × · ' + plural(Object.keys(c.rules).length, 'rule', 'rules') + '</span></div>';
        }).join('') + '</div>'
      : '<p class="note">No rule in this cut carries a recorded claim boundary.</p>',
    basis: 'A boundary travels with the finding, not with the documentation: it is on the record, in the JSON, ' +
           'in the SARIF and on the wire. A reader who quotes a finding without its limit is quoting half of it.'
  });

  h += panel({
    span: 'c12', title: 'How the reading was taken',
    body: '<div class="figs">' +
      '<div class="fig"><span class="v sm">' + D.method.kinds + '</span><span class="k">resource kinds read</span></div>' +
      '<div class="fig"><span class="v sm">' + ((D.method.unread || []).length || '0') + '</span><span class="k">not read</span></div>' +
      '<div class="fig"><span class="v sm">' + D.method.rules + '</span><span class="k">rules run</span></div>' +
      '<div class="fig"><span class="v sm mono" style="font-size:13px">' + esc(D.method.usage) + '</span><span class="k">usage source</span></div>' +
      '<div class="fig"><span class="v sm mono" style="font-size:13px">' + esc(D.method.window) + '</span><span class="k">usage window</span></div>' +
      '<div class="fig"><span class="v sm mono" style="font-size:13px">' + esc(D.method.engine) + '</span><span class="k">engine</span></div>' +
      '<div class="fig"><span class="v sm mono" style="font-size:13px">' + esc(D.method.tier || '—') + '</span><span class="k">map tier</span></div></div>',
    basis: 'Read-only by construction: <b>get</b> and <b>list</b> only, and the binary contacts no service of ours. What it never reads — Secret and ConfigMap values, environment variables, logs, node shells — it says on every surface.' +
      ((D.method.unread || []).length ? '<br>' + unreadBasis() : '')
  });
  return h;
}
/* ═══════════════════════════════════════════════════════════════════════════
   SHOALCHECK — the second rank of workspaces.

   Each of these existed in the payload and was reachable only as a row inside
   something else. A structure the engine produces deserves a surface: the rule
   catalogue, the per-workload and per-namespace scorecards, the dated
   obligations, and the one surface that turns a reading into work somebody does.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── workloads: one card per thing an engineer owns ───────────────────────── */
function wsWorkloads(rows, t) {
  var h = '', i, j;
  /* reachable = named by a step of some path this reading found */
  var reach = {};
  (D.flows || []).forEach(function (f) {
    (f.steps || []).forEach(function (s) {
      if (s.k === 'service' || s.k === 'workload') reach[wlIdOf(s.ns || '', s.l)] = 1;
    });
  });

  var meta = {};
  (D.topo || []).forEach(function (n) {
    n.w.forEach(function (w) { meta[wlIdOf(n.ns, w.n)] = { ns: n.ns, k: w.k, r: w.r, s: w.s, name: w.n }; });
  });

  var g = {};
  for (i = 0; i < rows.length; i++) {
    var w = rows[i][WL]; if (!w) continue;
    (g[wlId(w)] = g[wlId(w)] || []).push(rows[i]);
  }
  Object.keys(meta).forEach(function (k) { if (!g[k]) g[k] = []; });

  var keys = Object.keys(g).sort(function (a, b) {
    var wa = g[a].length ? Math.min.apply(null, g[a].map(function (r) { return r[SEV]; })) : 9;
    var wb = g[b].length ? Math.min.apply(null, g[b].map(function (r) { return r[SEV]; })) : 9;
    if (wa !== wb) return wa - wb;
    return g[b].length - g[a].length;
  });

  h += panel({
    span: 'c12', title: 'Every workload the reading listed',
    aside: plural(keys.length, 'workload', 'workloads') + ' · sorted by worst finding, then by mass',
    /* 549 cards is a wall, not a grid. The ones that matter are sorted first, so
       the cap keeps the head and names the tail rather than trailing off. */
    body: '<div class="cards">' + keys.slice(0, 72).map(function (k) {
      /* A workload the topology block does not hold — a CronJob is the common one — takes its namespace and kind
         from its findings' own reference, and states no replica count rather than a dash for one. */
      var rs = g[k], ref = rs.length ? String(rs[0][WL]).split('/') : [];
      var m = meta[k] || (ref.length >= 3 ? { ns: ref[1], k: ref[0] } : {}), c = [0,0,0,0,0], usd0 = 0;
      for (j = 0; j < rs.length; j++) { c[rs[j][SEV]]++; usd0 += rs[j][USD]; }
      var worst = rs.length ? Math.min.apply(null, rs.map(function (r) { return r[SEV]; })) : null;
      var segs = '';
      for (j = 0; j < 5; j++) if (c[j]) segs += '<i style="flex:' + c[j] + ';background:var(--sev-' + j + ')"></i>';
      return '<button class="card" data-f="q" data-v="' + esc(m.name || wlLabel(k)) + '"' +
        ' style="border-left-color:' + (worst != null ? 'var(--sev-' + worst + ')' : 'var(--ok)') + '">' +
        '<span class="cn">' + esc(wlLabel(k)) + '</span>' +
        '<span class="cm">' + esc((m.ns || '—') + ' · ' + (m.k || '—') + (m.r != null ? ' · ' + m.r + '×' : '')) +
          (reach[k] ? ' · <b>reachable</b>' : '') + '</span>' +
        '<span class="cbar">' + (segs || '<i style="flex:1;background:var(--ok-bg)"></i>') + '</span>' +
        '<span class="cf">' + (rs.length ? num(rs.length) : '<span class="none">none</span>') + '</span>' +
        '<span class="cu">' + usdOrDash(usd0) + '</span>' +
        '</button>';
    }).join('') + '</div>' +
      (keys.length > 72
        ? '<p class="capnote"><b>' + num(keys.length - 72) + '</b> more ' + noun(keys.length - 72, 'workload', 'workloads') + ', all with fewer or no ' +
          'findings than these. Narrow by namespace above, or search from the palette.</p>'
        : ''),
    basis: 'A workload with no finding is drawn, not omitted — <b>nothing found</b> and <b>not examined</b> are different, and only the first is shown here. Replica counts are the declared spec.'
  });

  /* ── the shape of the set, which 16 cards cannot show ── */
  var byN = keys.map(function (k) { return { k: k, n: g[k].length }; })
                .sort(function (a, b) { return b.n - a.n; });
  var withNone = byN.filter(function (x) { return !x.n; }).length;
  var mid = byN.filter(function (x) { return x.n; }).map(function (x) { return x.n; });
  var median = mid.length ? mid[Math.floor(mid.length / 2)] : 0;
  h += panel({
    span: 'c5', title: 'How the findings spread', aside: 'across ' + plural(keys.length, 'workload', 'workloads'),
    body: '<div class="figs">' +
      '<div class="fig"><span class="v">' + num(median) + '</span><span class="k">median, of those with any</span></div>' +
      '<div class="fig"><span class="v sm">' + num(byN.length ? byN[0].n : 0) + '</span><span class="k">the most on one</span></div>' +
      '<div class="fig"><span class="v sm ' + (withNone ? 'ok' : '') + '">' + num(withNone) + '</span><span class="k">with none</span></div></div>' +
      ranks(byN.filter(function (x) { return x.n; }).slice(0, 8).map(function (x) {
        var m2 = meta[x.k] || {};
        return { k: m2.name || wlLabel(x.k), label: wlLabel(x.k), v: x.n, f: 'q',
                 title: wlLabel(x.k) + ' — ' + plural(x.n, 'finding', 'findings') };
      }), { mono: true }),
    basis: 'A workload is one conversation with one owner, which is why the median matters more than the total: ' +
           'it is how much a single ticket has to carry.'
  });

  /* ── which kinds are represented ── */
  var byKind = {};
  keys.forEach(function (k) { var m3 = meta[k] || {}; if (m3.k) byKind[m3.k] = (byKind[m3.k] || 0) + 1; });
  var kinds = Object.keys(byKind).sort(function (a, b) { return byKind[b] - byKind[a]; });
  h += panel({
    span: 'c7', title: 'Workload kinds this reading listed', aside: plural(kinds.length, 'kind', 'kinds'),
    body: kinds.length
      ? ranks(kinds.map(function (k) { return { k: k, label: k, v: byKind[k],
                title: byKind[k] + ' ' + k + noun(byKind[k], '', 's') }; }), { mono: true })
      : '<p class="note">No workload kind was resolved from the topology.</p>',
    basis: 'A StatefulSet and a Deployment fail differently, so the mix is part of what a blast-radius answer ' +
           'rests on. Kinds come from the topology block, not from the findings.'
  });
  return h;
}

/* ── namespaces: the unit a team owns ─────────────────────────────────────── */
function wsNamespaces(rows, t) {
  var h = '', i;
  var po = {}; (D.posture || []).forEach(function (p) { po[p.ns] = p; });
  var byNs = byKey(rows, NS);
  var names = Object.keys(t.ns).sort(function (a, b) { return t.ns[b] - t.ns[a]; });

  h += panel({
    span: 'c12', title: 'Namespace scorecards',
    aside: plural(names.length, 'namespace', 'namespaces') + ' with a finding in this cut',
    body: '<div class="score-grid">' + names.map(function (nm) {
      var key = nm === '(cluster)' ? '' : nm, rs = byNs[key] || [], c = [0,0,0,0,0], usd0 = 0, wl = {}, cat = {};
      for (i = 0; i < rs.length; i++) {
        c[rs[i][SEV]]++; usd0 += rs[i][USD];
        if (rs[i][WL]) wl[wlId(rs[i][WL])] = 1;
        cat[rs[i][CAT]] = (cat[rs[i][CAT]] || 0) + 1;
      }
      var p = po[nm], segs = '';
      for (i = 0; i < 5; i++) if (c[i]) segs += '<i style="flex:' + c[i] + ';background:var(--sev-' + i + ')" title="' +
        num(c[i]) + ' ' + SEVN[i] + '"></i>';
      var guards = p
        ? [['netpol','NetPol'],['quota','Quota'],['limits','Limits'],['pss','PSS']]
            .map(function (x) {
              var st = guardState(p, x[0]);
              return '<span class="g ' + st.tone + '" title="' + esc(nm + ' — ' + x[1] + ': ' + st.title) + '">' +
                     x[1] + '</span>';
            }).join('')
        : nm === '(cluster)'
          /* Cluster-scoped findings belong to no namespace, and a namespace's guardrails do not apply to them:
             "not read" there said a read had failed that was never asked for. */
          ? '<span class="g unk" title="Cluster-scoped findings: no namespace, so no namespace guardrails">cluster-scoped</span>'
          : '<span class="g unk" title="This namespace was not in the posture read">not read</span>';
      var catRow = CATS.filter(function (k) { return cat[k]; }).map(function (k) {
        return '<span class="ck" style="background:' + catBg(k) + '" title="' + num(cat[k]) + ' ' + k + '">' +
               esc(k) + ' ' + num(cat[k]) + '</span>'; }).join('');
      var worst = rs.length ? Math.min.apply(null, rs.map(function (r) { return r[SEV]; })) : null;
      return '<div class="score" data-f="ns" data-v="' + esc(key) + '"' +
        ' style="border-top-color:' + (worst != null ? 'var(--sev-' + worst + ')' : 'var(--line)') + '">' +
        '<div class="sh"><span class="sn">' + esc(nm) + '</span>' +
        '<span class="snum">' + num(rs.length) + '<small>' + noun(rs.length, 'finding', 'findings') + '</small></span></div>' +
        '<div class="sbar">' + (segs || '<i style="flex:1;background:var(--sunk)"></i>') + '</div>' +
        '<div class="scat">' + (catRow || '<span class="ck" style="background:var(--sunk)">nothing found</span>') + '</div>' +
        '<div class="sg">' + guards + '</div>' +
        '<div class="sf">' + plural(Object.keys(wl).length, 'workload', 'workloads') +
          (usd0 > 0 ? ' · <b>' + usd(usd0) + '</b>/mo' : '') + '</div></div>';
    }).join('') + '</div>',
    basis: 'The stripe on top is the namespace\'s worst finding. Guardrail chips come from the objects the reading ' +
           'counted there; a namespace the reading could not list shows <b>not read</b> rather than a green or a red.'
  });

  /* ── the comparison a single grid of cards cannot make ── */
  var cats = CATS.filter(function (c) { return t.cat[c]; });
  var m = {}, maxCell = 0;
  for (i = 0; i < rows.length; i++) {
    var k = rows[i][NS] || '(cluster)';
    (m[k] = m[k] || {})[rows[i][CAT]] = ((m[k] || {})[rows[i][CAT]] || 0) + 1;
  }
  names.forEach(function (n) { cats.forEach(function (c) { maxCell = Math.max(maxCell, (m[n] || {})[c] || 0); }); });
  h += panel({
    span: 'c7', title: 'Namespace against category', aside: 'every finding in this cut, placed once',
    body: '<div class="matrix" style="grid-template-columns:132px repeat(' + cats.length + ',minmax(58px,1fr))">' +
      '<span></span>' + cats.map(function (c) { return '<span class="mh" style="text-align:center">' + esc(c) + '</span>'; }).join('') +
      names.map(function (n) {
        return '<span class="mr mono">' + esc(n) + '</span>' + cats.map(function (c) {
          var v = (m[n] || {})[c] || 0;
          return '<button ' + heat(v, maxCell, 'cat-' + c) + ' data-f="nscat" data-v="' + esc(n) + '|' + esc(c) +
            '" title="' + v + ' ' + esc(c) + ' ' + noun(v, 'finding', 'findings') + ' in ' + esc(n) + '">' + (v || '') + '</button>';
        }).join(''); }).join('') + '</div>',
    basis: 'Cells sum to <b>' + num(rows.length) + '</b>, the size of the current cut. A finding sits in exactly one cell.'
  });

  /* ── guardrail coverage across the whole cluster, in one number each ── */
  var po2 = D.posture || [];
  h += panel({
    span: 'c5', title: 'Guardrail coverage', aside: plural(po2.length, 'namespace', 'namespaces') + ' read',
    body: po2.length ? '<div class="gcov">' +
      [['netpol', 'NetworkPolicy'], ['quota', 'ResourceQuota'], ['limits', 'LimitRange'], ['pss', 'PSS label']]
        .map(function (g) {
          var on = 0, unread = 0;
          po2.forEach(function (r) {
            var st = guardState(r, g[0]);
            if (st.tone === 'ok') on++;
            else if (st.tone === 'unk') unread++;
          });
          var denom = po2.length - unread;
          var pctOn = denom > 0 ? Math.round(on / denom * 100) : 0;
          return '<div class="gc"><span class="gcn">' + esc(g[1]) + '</span>' +
            /* A zero draws nothing. Forcing a 2% sliver so "the bar is visible"
               makes zero look like a small amount, and on this product zero and
               a small amount are different claims. */
            '<span class="gcbar">' + (on ? '<span class="gcf" style="width:' + pctOn +
              '%;background:var(--ok)"></span>' : '') + '</span>' +
            '<span class="gcv' + (on ? '' : ' none') + '" title="' +
              (unread ? esc(plural(unread, 'namespace', 'namespaces') + ' not read, and excluded from the denominator') : '') + '">' +
              on + ' / ' + denom + (unread ? ' <i>+' + unread + '?</i>' : '') + '</span></div>';
        }).join('') + '</div>'
      : '<p class="note">No namespace posture was read.</p>',
    basis: 'Configured is not enforced. A CNI may carry segmentation in its own policy objects, which this product ' +
           'does not read, so an absent NetworkPolicy is <b>not</b> an absent boundary.'
  });
  return h;
}

/* ── rules: what was checked, and what checking found nothing ─────────────── */
function wsRules(rows, t) {
  var h = '', i;
  var fired = {}, cats = {};
  for (i = 0; i < rows.length; i++) {
    var k = rows[i][RULE];
    fired[k] = fired[k] || { n: 0, sev: 9, usd: 0, ns: {}, cat: rows[i][CAT] };
    fired[k].n++; fired[k].usd += rows[i][USD];
    if (rows[i][SEV] < fired[k].sev) fired[k].sev = rows[i][SEV];
    fired[k].ns[rows[i][NS] || '(cluster)'] = 1;
    cats[rows[i][CAT]] = 1;
  }
  /* The list is long enough that one fixed order cannot serve every question:
     "what is worst" and "what is most" and "what costs most" are three different
     readings of the same rows. The header sorts. */
  var RS = S.ruleSort || 'sev', RD = S.ruleDesc;
  var keys = Object.keys(fired).sort(function (a, b) {
    var A = fired[a], B = fired[b], d;
    if (RS === 'name') d = a.localeCompare(b);
    else if (RS === 'count') d = B.n - A.n;
    else if (RS === 'usd') d = B.usd - A.usd;
    else if (RS === 'ns') d = Object.keys(B.ns).length - Object.keys(A.ns).length;
    else if (RS === 'cat') d = String(A.cat).localeCompare(String(B.cat));
    else d = (A.sev - B.sev) || (B.n - A.n);
    if (RD === false) d = -d;
    return d || a.localeCompare(b);
  });
  var ran = D.method.rules || 0, silent = Math.max(0, ran - keys.length);

  h += panel({
    span: 'c4', title: 'Coverage of this run',
    body: '<div class="figs">' +
      '<div class="fig"><span class="v">' + num(ran) + '</span><span class="k">rules run</span></div>' +
      '<div class="fig"><span class="v sm">' + num(keys.length) + '</span><span class="k">produced a finding</span></div>' +
      '<div class="fig"><span class="v sm ok">' + num(silent) + '</span><span class="k">found nothing</span></div></div>' +
      '<div class="stack" style="margin-top:var(--s3)">' +
        '<button style="flex:' + (keys.length || 1) + ';background:var(--sev-2-bg);color:var(--sev-2)">' + num(keys.length) + ' fired</button>' +
        (silent ? '<button style="flex:' + silent + ';background:var(--ok-bg);color:var(--ok)">' + num(silent) + ' silent</button>' : '') +
      '</div>',
    basis: 'A rule that fired nothing is a check that ran and found nothing — <b>not</b> a check that was skipped. Rules the build does not carry are absent from both numbers and are listed under Method.'
  });

  /* The coverage panel is four numbers and a bar; the rule list beside it is
     1200px tall. Two more small panels under the coverage figure use the column
     instead of leaving a hole, and both answer a question the list cannot: how the
     checks distribute, rather than what each one found. */
  var perCat = {}, perSev = [0,0,0,0,0];
  keys.forEach(function (k) {
    perCat[fired[k].cat] = (perCat[fired[k].cat] || 0) + 1;
    perSev[fired[k].sev]++;
  });
  h += panel({
    span: 'c4', title: 'Rules by category', aside: 'a rule, not its findings',
    body: ranks(CATS.filter(function (c) { return perCat[c]; }).map(function (c) {
      return { k: c, label: c, v: perCat[c], f: 'cat',
               title: plural(perCat[c], 'rule', 'rules') + ' in ' + c + ' produced a finding' };
    }), { mono: true }),
    basis: 'One row is one <b>check</b>. A category with few rules and many findings is a narrow check firing often; ' +
           'the reverse is a broad surface with isolated problems.'
  });
  h += panel({
    span: 'c4', title: 'Rules by worst band', aside: 'where a rule\'s hardest finding sat',
    body: '<div class="stack">' + perSev.map(function (n, i) {
        return n ? '<button style="flex:' + n + ';min-width:' + (n / keys.length > 0.07 ? 0 : 46) + 'px;' +
          'background:var(--sev-' + i + (i < 2 ? '' : '-bg') + ');color:' +
          (i < 2 ? 'var(--on-sev-' + i + ')' : 'var(--sev-' + i + ')') + '"' +
          ' data-f="sev" data-v="' + i + '" title="' + plural(n, 'rule', 'rules') + ' worst at ' + SEVN[i] + '">' +
          n + (n / keys.length > 0.12 ? ' ' + SEVN[i] : '') + '</button>' : ''; }).join('') + '</div>' +
      '<p class="note">A rule appears once, under the hardest band any of its findings reached.</p>',
    basis: 'The band is the rule\'s own judgement of consequence, applied to what it found here — not a score, ' +
           'and not a ranking of the rules against each other.'
  });

  h += panel({
    span: 'c8', title: 'Every rule that fired', aside: 'worst severity first, then mass',
    body: '<div class="rulehead">' +
      [['sev', ''], ['name', 'rule'], ['cat', 'category'], ['count', 'findings'],
       ['ns', 'ns'], ['usd', '$ / mo']].map(function (c) {
        return '<button class="rh" data-rsort="' + c[0] + '"' +
          (RS === c[0] ? ' aria-sort="' + (RD === false ? 'ascending' : 'descending') + '"' : '') +
          '>' + esc(c[1]) + (RS === c[0] ? '<i>' + (RD === false ? '↑' : '↓') + '</i>' : '') + '</button>';
      }).join('') + '</div>' +
      '<div class="rulelist">' + keys.slice(0, 40).map(function (k) {
      var f = fired[k];
      return '<button class="rl" data-f="rule" data-v="' + esc(k) + '">' +
        '<span class="sv sv' + f.sev + '">' + SEVL[f.sev] + '</span>' +
        '<span class="rn">' + esc(ruleShort(k)) + '</span>' +
        /* the tint names the category; the label is just a label and takes a
           foreground that is legible on every one of the five tints */
        '<span class="rc" style="background:' + catBg(f.cat) + '">' + esc(f.cat) + '</span>' +
        '<span class="rv">' + num(f.n) + '</span>' +
        '<span class="rs">' + num(Object.keys(f.ns).length) + ' ns</span>' +
        '<span class="ru">' + usdOrDash(f.usd) + '</span></button>';
    }).join('') + '</div>' +
      (keys.length > 40 ? '<p class="note">' + num(keys.length - 40) + ' more in the Findings workspace.</p>' : ''),
    basis: 'One row is one decision. Answering it once settles every finding it produced.'
  });
  return h;
}

/* ── obligations: everything with a date on it ────────────────────────────── */
function wsObligations(rows, t) {

  var passed = cal.filter(function (c) { return c.passed; }).length;

            '<span class="tlb"><span class="tlo">' + esc(c.o) + '</span>' +

    basis: 'Each date is read from an object field or a dated reference table, and the row names which. <b>Urgency words are banned in this block</b> — the date is the fact, and how urgent it is depends on things this reading cannot see.'
  });

  h += panel({
    span: 'c12', title: 'Clocks this reading could not read', aside: na.length + ' unread',
    body: na.length
      ? '<div class="unread">' + na.map(function (x) {
          return '<div class="ur"><span class="uc">' + esc(x.c) + '</span>' +
                 '<span class="uw">' + esc(x.why) + '</span></div>'; }).join('') + '</div>'
      : '<p class="note">Every clock this build knows how to read was read.</p>',
    basis: 'An absence is reported as an absence. None of these is claimed to be safe, and none is claimed to be a problem.'
  });

  /* ── the findings that a date actually lands on ── */
  var dated = rows.filter(function (r) {
    return /removal|deprecat|version|support|upgrade|expiry|renew/i.test(r[TITLE] + ' ' + r[RULE]);
  });
  h += panel({
    span: 'c7', title: 'Findings a clock lands on', aside: num(dated.length) + ' of ' + num(rows.length),
    body: dated.length
      ? '<div class="rulelist">' + dated.slice(0, 12).map(function (r) {
          return '<button class="rl" data-f="q" data-v="' + esc(r[TITLE]) + '">' +
            '<span class="sv sv' + r[SEV] + '">' + SEVL[r[SEV]] + '</span>' +
            '<span class="rn">' + esc(r[TITLE]) + '</span>' +
            '<span class="rc" style="background:' + catBg(r[CAT]) + '">' + esc(r[CAT]) + '</span>' +
            '<span class="rv">1</span><span class="rs"></span>' +
            '<span class="ru">' + usdOrDash(r[USD]) + '</span></button>';
        }).join('') + '</div>'
      : '<p class="note">No finding in this cut is tied to a date this reading could read.</p>',
    basis: 'Matched on what the rule and title name, so this is a <b>reading aid, not a schedule</b>: a finding ' +
           'absent here may still be urgent for a reason no clock in this build can see.'
