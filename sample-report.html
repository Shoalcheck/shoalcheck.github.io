ntServiceAccountToken: false\n","k":["clusterrolebindings","daemonsets","deployments","rolebindings","serviceaccounts","statefulsets"]},"d4be978b6bef":{"d":"Service payments/old-admin-lb is type=LoadBalancer but its selector matches no pods (any phase) and its EndpointSlices published no endpoint entries, so a provisioned cloud load balancer would be billed with nothing behind it. This is read from a point-in-time snapshot, so verify it's truly unused — not mid-rollout — before deleting the Service to release the LB.","r":[{"k":"Service","n":"payments","m":"old-admin-lb"}],"c":"# verify unused, then: kubectl -n payments delete service old-admin-lb","s":"one-click","pb":"priced","sk":"network","k":["endpointslices","nodes","pods","services"]},"d5389700eafb":{"d":"Deployment api/auth-service has 1 of 1 container where allowPrivilegeEscalation is unset (it defaults to true) or explicitly true. Set allowPrivilegeEscalation:false on each container's securityContext — required by the PSS-Restricted profile. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"api","m":"auth-service"}],"k":["daemonsets","deployments","statefulsets"]},"d5596225b087":{"d":"Deployment api/auth-service has 1 of 1 container without a read-only root filesystem. Note: PSS does NOT require this (it is a hardening extension, not part of the Baseline or Restricted profile), so this is a Low-severity defense-in-depth suggestion — set readOnlyRootFilesystem:true and mount writable paths as emptyDir/PVC volumes where the app genuinely needs to write. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"api","m":"auth-service"}],"k":["daemonsets","deployments","statefulsets"]},"d61e807576a9":{"d":"Deployment payments/payments-orchestrator ships containers without health probes: no liveness probe means a hung or deadlocked process is never restarted by the kubelet; no readiness probe is configured; readiness also gates Service traffic where applicable, but this workload exposes no ports and sits behind no Service we observed.","r":[{"k":"Deployment","n":"payments","m":"payments-orchestrator"}],"y":"# TEMPLATE — do NOT apply blind. A liveness probe configured too aggressively\n# (no startupProbe, low failureThreshold, short timeout) will restart healthy-but-slow\n# pods and can cascade the whole Deployment into CrashLoopBackOff. Set the real\n# health path/port and tune the timings to your workload's warmup + GC behaviour first.\n#\n# startupProbe gates liveness until the app has finished starting; give slow-start\n# apps (JVM, large models, migrations) a generous startup budget.\nstartupProbe:\n  httpGet: { path: /healthz, port: http }   # \u003c-- set to your real health endpoint\n  periodSeconds: 10\n  failureThreshold: 30                       # ~5 min warmup budget; raise for slow starters\nlivenessProbe:\n  httpGet: { path: /healthz, port: http }   # \u003c-- set to your real health endpoint\n  periodSeconds: 15\n  timeoutSeconds: 5\n  failureThreshold: 3","k":["daemonsets","deployments","services","statefulsets"]},"d811265f3b7b":{"d":"Deployment workers/ledger-reconciler declares spec.replicas = 4 and its pod template names ledger-reconciler-work, whose spec.accessModes permit attachment by a single node at a time. Both declarations are ordinary on their own; together they mean every pod of this workload has to be on whichever node currently holds the volume.","r":[{"k":"Deployment","n":"workers","m":"ledger-reconciler"},{"k":"PersistentVolumeClaim","n":"workers","m":"ledger-reconciler-work"}],"k":["daemonsets","deployments","persistentvolumeclaims","statefulsets"]},"d98a27393c6c":{"d":"1 pod of Deployment default/legacy-cron-runner report a container restart total of 20 or more, the highest being 37. The count is cumulative since the container was created; the age of each pod is in the evidence so the total can be read against it.","r":[{"k":"Pod","n":"default","m":"legacy-cron-runner-7f4b9c0-a"}],"k":["daemonsets","deployments","pods","statefulsets"]},"db75a71804cf":{"d":"This cluster reports version v1.31.2-eks-1a2b3c4 and serves 1 group/version that the upstream deprecation guide records as removed in a later release, the earliest being 1.32. The objects themselves survive an upgrade — the API server migrates their storage version. What stops working is anything that still ASKS for the removed version.","r":[{"k":"APIService","m":"flowcontrol.apiserver.k8s.io/v1beta3"}],"k":["server-resources"]},"dc9aaec3117c":{"d":"Service api/api-gateway names a targetPort that no container of the workloads it selects declares. A named targetPort is resolved against the pod's own containerPort names, so a name that matches nothing has nothing to forward to.","r":[{"k":"Service","n":"api","m":"api-gateway"}],"k":["daemonsets","deployments","services","statefulsets"]},"dd8a6d656535":{"d":"Deployment monitoring/node-exporter has 1 of 1 container where allowPrivilegeEscalation is unset (it defaults to true) or explicitly true. Set allowPrivilegeEscalation:false on each container's securityContext — required by the PSS-Restricted profile. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"monitoring","m":"node-exporter"}],"k":["daemonsets","deployments","statefulsets"]},"e17c526caece":{"d":"Deployment default/legacy-cron-runner has 1 of 1 container that do not drop ALL capabilities, so each keeps the default Linux capability set (NET_RAW included). The PSS-Restricted profile requires capabilities.drop:[ALL]; add back only NET_BIND_SERVICE if the container binds a privileged port. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"default","m":"legacy-cron-runner"}],"k":["daemonsets","deployments","statefulsets"]},"e399e6ba15a1":{"d":"Namespace monitoring runs 3 long-running workloads (Deployments/StatefulSets/DaemonSets) with no ResourceQuota and no LimitRange object. There is no namespace-level cap on how much CPU or memory the namespace can claim against the cluster, and no LimitRange to supply default per-container requests. Every observed container already sets explicit requests, so the per-pod gap is limited to the absence of a namespace cap and a default-request safety net for future workloads. Note: this is an object-presence check — defaults injected at admission time by a mutating webhook or policy engine (Kyverno, OPA/Gatekeeper) are not visible to a read-only scan and may already govern this namespace; verify before acting.","r":[{"k":"Namespace","m":"monitoring"}],"y":"apiVersion: v1\nkind: LimitRange\nmetadata:\n  name: default-limits\n  namespace: monitoring\nspec:\n  limits:\n    - type: Container\n      defaultRequest:   # starting point — right-size from usage before applying\n        cpu: 100m\n        memory: 128Mi\n      default:          # starting point — right-size from usage before applying\n        cpu: 500m\n        memory: 512Mi\n","k":["daemonsets","deployments","limitranges","resourcequotas","statefulsets"]},"e4bf52323dca":{"d":"Deployment monitoring/node-exporter requests privileged or host-level access (3 items: see evidence). Unless this workload IS node infrastructure (CNI, runtime agent, node exporter, CSI driver), drop privileged:true from container securityContexts, set hostNetwork/hostPID/hostIPC to false, and replace hostPath volumes with PVCs, ConfigMaps, or the downward API. The fix is app-specific, so no generic patch is offered — the command below pinpoints each offending line. Read-only and type-scoped hostPath mounts are materially lower risk than writable mounts of sensitive paths (e.g. docker.sock, /, /etc) — see the per-volume evidence for which kind each is. This workload matches a known node-infrastructure pattern (node-exporter); for those, host/privileged access is by design and removing it will break the agent — this finding is informational, confirm rather than remediate.","r":[{"k":"Deployment","n":"monitoring","m":"node-exporter"}],"c":"kubectl -n monitoring get deployment node-exporter -o yaml | grep -nE 'privileged|hostNetwork|hostPID|hostIPC|hostPath|hostPort|readOnly'","s":"one-click","k":["daemonsets","deployments","statefulsets"]},"e59861c4d9bf":{"d":"Deployment payments/payments-gateway runs exactly one replica and no PodDisruptionBudget matches its pods. No Service in the namespace selects its pods on a serving port, so loss of the pod is not directly user-facing — but any node drain or interruption still takes the single replica down until it reschedules.","r":[{"k":"Deployment","n":"payments","m":"payments-gateway"}],"c":"kubectl -n payments scale deployment/payments-gateway --replicas=2\n# only AFTER \u003e=2 replicas, add a PodDisruptionBudget (e.g. maxUnavailable: 1); a minAvailable equal to the replica count deadlocks every node drain","s":"one-click","k":["daemonsets","deployments","poddisruptionbudgets","services","statefulsets"]},"e768b03693f6":{"d":"Deployment api/api-gateway has 1 of 1 container whose effective seccompProfile is unset or Unconfined (computed pod then container). Set seccompProfile.type:RuntimeDefault at the pod level so every container inherits syscall filtering — required by PSS-Restricted (CIS 5.7.2 maps to 5.2.1 in this benchmark version). This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"api","m":"api-gateway"}],"k":["daemonsets","deployments","statefulsets"]},"e8ceeb23689a":{"d":"Evacuating node ip-10-0-1-d requires evicting 1 pod covered by PodDisruptionBudget payments/payments-orchestrator-pdb. The budget's own published status decides whether the eviction API permits that. The budget's own remedy, where one is needed, is reported by rule k8s.reliability.pdb-blocks-drains.","r":[{"k":"Node","m":"ip-10-0-1-d"},{"k":"PodDisruptionBudget","n":"payments","m":"payments-orchestrator-pdb"}],"k":["nodes","poddisruptionbudgets","pods"]},"ea56e4e5723c":{"d":"Namespace payments runs workloads but does not enforce a PodSecurity admission profile of baseline or restricted (enforce=\u003cunset\u003e). Without enforcement, the per-container PSS findings in this report describe the spec AS AUTHORED — nothing in the cluster actually blocks a privileged, root, or capability-laden pod from being admitted here. Apply the labels gradually: set warn and audit first to surface what would break, then set enforce. Enforcing restricted on a namespace that already runs noncompliant pods does NOT evict them, but it WILL block the next admission (a redeploy or rollout) — stage it. baseline is the safe first target (it blocks privileged, hostPath, hostNetwork, and host namespaces); however, the per-container findings in this report for this namespace (seccomp, drop-ALL capabilities, allowPrivilegeEscalation, runAsNonRoot) are Restricted-profile controls, so enforce=restricted is required to fully close them — baseline alone will not.","r":[{"k":"Namespace","m":"payments"}],"c":"kubectl label --overwrite namespace payments pod-security.kubernetes.io/warn=baseline pod-security.kubernetes.io/audit=baseline   # surface breakage first, then set enforce=baseline; use restricted (not baseline) on both warn/audit/enforce to close the per-container seccomp/capabilities/runAsNonRoot findings","s":"one-click","k":["daemonsets","deployments","namespaces","statefulsets"]},"ec803c18cdf7":{"d":"Deployment api/api-gateway has 1 image reference that can resolve to different bytes on different pulls. The same manifest may then run different code across nodes or after a restart, which breaks rollbacks and makes incident forensics guesswork. Pin a specific version tag or, for true immutability, a digest (@sha256:…). On a genuinely fixed tag, imagePullPolicy=IfNotPresent is then safe.","r":[{"k":"Deployment","n":"api","m":"api-gateway"}],"c":"kubectl -n api get deployment api-gateway -o jsonpath='{.spec.template.spec.containers[*].image}'","s":"one-click","k":["daemonsets","deployments","statefulsets"]},"f04606ed1db1":{"d":"Namespace payments runs 3 workloads and defines zero upstream (networking.k8s.io/v1) NetworkPolicy objects. This cluster runs Cilium, which may enforce segmentation through its own CRDs (e.g. CiliumNetworkPolicy / projectcalico.org policies) that shoalcheck does not yet read — so zero upstream objects does NOT prove the namespace is unsegmented. If it is genuinely flat, start with a default-deny-ingress policy, then add explicit allows for the flows that exist.","r":[{"k":"Namespace","m":"payments"}],"y":"# NOTE: this cluster runs Cilium. Verify the namespace is not already segmented via Cilium CRDs\n# before adding this upstream object; validate against your workload's real flows before applying.\napiVersion: networking.k8s.io/ eserves CPU/memory above what its 7d usage ever needed, across 1 replica. CPU is sized to the busiest replica's p95 plus 30% headroom; memory to the larger of p95×1.3 and the observed 7d max. The memory recommendation is floored at the observed 7d max so a bursty or GC-heavy workload is not down-sized below a working set it provably reaches. This reclaims reserved capacity the workload's 7d p95 never used — but the 95th percentile excludes tail bursts, so verify against the container's 7d max and your latency SLOs before applying: CPU below request is throttled, memory below peak is OOMKilled.","r":[{"k":"StatefulSet","n":"monitoring","m":"prometheus-k8s"}],"y":"apiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: prometheus-k8s\n  namespace: monitoring\nspec:\n  template:\n    spec:\n      containers:\n        - name: prometheus\n          resources:\n            requests:\n              cpu: 210m      # 7d p95 ×1.3, right-sized\n              memory: 1248Mi  # 7d p95 ×1.3, right-sized\n","pb":"priced","sk":"compute","k":["daemonsets","deployments","nodes","pods","statefulsets"],"us":"prometheus"},"f6611ef63287":{"d":"Namespace default runs 1 workload and defines zero upstream (networking.k8s.io/v1) NetworkPolicy objects. This cluster runs Cilium, which may enforce segmentation through its own CRDs (e.g. CiliumNetworkPolicy / projectcalico.org policies) that shoalcheck does not yet read — so zero upstream objects does NOT prove the namespace is unsegmented. If it is genuinely flat, start with a default-deny-ingress policy, then add explicit allows for the flows that exist.","r":[{"k":"Namespace","m":"default"}],"y":"# NOTE: this cluster runs Cilium. Verify the namespace is not already segmented via Cilium CRDs\n# before adding this upstream object; validate against your workload's real flows before applying.\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-ingress\n  namespace: default\nspec:\n  podSelector: {}  # empty nspec:\n  template:\n    spec:\n      containers:\n        - name: risk-batch-processor\n          resources:\n            requests:\n              # PLACEHOLDER — DO NOT apply blind: these are not measured values.\n              # Size from this container's real usage (`kubectl top pod` or a\n              # 7d Prometheus p95/max) or it may OOM the node under load.\n              cpu: 100m      # placeholder — replace with measured CPU\n              memory: 128Mi  # placeholder — replace with measured memory\n","k":["daemonsets","deployments","limitranges","statefulsets"]},"fd15521bee79":{"d":"3 LoadBalancer Services explicitly set externalTrafficPolicy to Cluster. kube-proxy then forwards to a backend on any node and source-NATs the second hop, so every backend sees a node address rather than the client's. Load spreads evenly, which is what the setting buys.","r":[{"k":"Service","n":"payments","m":"legacy-checkout-lb"},{"k":"Service","n":"payments","m":"legacy-payments-lb"},{"k":"Service","n":"payments","m":"old-admin-lb"}],"k":["services"]},"ff3e0a795312":{"d":"HorizontalPodAutoscaler payments/payments-orchestrator sets minReplicas = 2 for Deployment payments/payments-orchestrator, and PodDisruptionBudget payments/payments-orchestrator-pdb requires minAvailable = 3 over the same pods. At the autoscaler's floor the budget permits no voluntary disruption at all, because the pods it requires to stay available are every pod there is. Right now the workload may be well above that floor, and this reading is about the floor rather than about now.","r":[{"k":"HorizontalPodAutoscaler","n":"payments","m":"payments-orchestrator"},{"k":"PodDisruptionBudget","n":"payments","m":"payments-orchestrator-pdb"},{"k":"Deployment","n":"payments","m":"payments-orchestrator"}],"k":["deployments","horizontalpodautoscalers","poddisruptionbudgets","pods","statefulsets"]},"ff76c68d256c":{"d":"Deployment api/api-gateway sets no dedicated ServiceAccount and mounts the default SA's API token s-version-past-standard-support":{"w":"A version past ordinary support is billed at a higher per-cluster rate by EKS and AKS, and nothing inside the cluster says so — the charge appears on an invoice nobody reads beside a version number nobody connected to it.","e":["Snapshot taken at 2026-09-15T05:28:50Z. Each resource kind is listed independently, so the node, pod and budget views can differ by moments; re-verify against the live cluster before acting.","the API server reports v1.31.2-eks-1a2b3c4, which is minor 1.31 on AWS","published window for AWS 1.31: released 2024-09-26, ordinary support ended 2025-11-26, paid extension ends 2026-11-26","AWS bills $0.5000 per cluster-hour on top of the ordinary control-plane rate while a version is in extended support — about $365.00 a month for this cluster, every month until it is upgraded. The figure is the SURCHARGE alone: the ordinary control plane is billed either way, so an upgrade stops this amount and not the whole control-plane bill."],"b":["The dollar impact is zero on purpose. This is a candidate to investigate with real utilisation, not a saving: requests-only slack cannot tell an idle pool from one whose pods under-request against what they actually use, and acting on the second packs a cluster into an OOM."],"v":"1.0.0"},"k8s.cost.node-headroom":{"w":"Over-provisioned nodes bill full price — but reclaiming them safely requires confirming real usage is below requests; acting on request-slack alone risks an OOM outage.","e":["pool r6i.4xlarge (3 nodes): summed pod REQUESTS 6.2 CPU / 32.5Gi (DaemonSet pods excluded) vs allocatable 47.7 CPU / 372.0Gi -\u003e 1 node of aggregate request-slack","REQUESTS-ONLY, not live usage: if pods request less CPU/memory than they actually consume, packing this pool onto fewer nodes will OOM/evict at runtime — and the cluster-autoscaler, which gates on the same requests, would drain straight into it. Do NOT remove nodes on this signal alone.","AGGREGATE CEILING, not a drainable count: this number is total-unused-capacity divided by per-node-capacity — it assumes every remaining request can be freely repacked onto the survivors. It does NOT model per-node bin-packing fragmentation (many pods that each fit the slack but collectively don't), PodDisruptionBudgets that block the eviction draining requires, or pod anti-affinity / topologySpreadConstraints that pin one replica per node. Real reclaimable nodes are at most this many and often fewer; treat it as an upper limit to investigate.","Verify before acting: connect Prometheus (--prometheus-url) so the usage-based Rightsizing rule sizes requests to real p95 usage — the safe path to reclaiming capacity."],"b":["The dollar impact is zero on purpose. This is a candidate to investigate with real utilisation, not a saving: requests-only slack cannot tell an idle pool from one whose pods under-request against what they actually use, and acting on the second packs a cluster into an OOM."],"v":"1.0.0"},"k8s.cost.overprovisioned-resources":{"w":"Requests far above real usage reserve node capacity nothing consumes, inflating the cluster's node count and bill.","e":["container webhook-dispatcher in Deployment workers/webhook-dispatcher: requests 2000m CPU, 7d p95 usage 640m (×1.3 headroom = 833m) -\u003e recommend 840m, reclaim 1160m × 6 replicas; requests 8192Mi mem, 7d p95 usage 2785Mi / 7d max 4751Mi (recommend = max(p95×1.3, max×1.05), recommend floored at 7d max = 4992Mi), reclaim 3200Mi × 6 replicas","$ model (UPPER BOUND, if consolidated): reclaim 6960m CPU / 19200Mi mem across 6 replicas, divided by m6i.xlarge allocatable (3900m CPU / 15360Mi) × $167.90/node/mo (eu-central-1) -\u003e CPU-bound up to $299.64/mo","$ scaled by 6 replicas (declared spec replicas)","realisation caveat: reclaimed requests convert to a real bill reduction only if the cluster is node-count-bound on the freed dimension AND an autoscaler/manual pool-shrink removes a node; on a memory-bound or fixed-size pool, freeing CPU saves $0 until the pool shrinks"],"b":["The figure is computed from a dated public list price, not from your bill. No credential of yours was used and no invoice was read, so a negotiated rate, a private offer or a credit is invisible here.","Whether a commitment already covers this footprint is a billing-account fact this product cannot see. A saving stated at the on-demand rate is wrong for the term of any plan that already applies.","Identified is not realised. Nothing here has been reclaimed, and the arithmetic assumes the freed capacity is actually given up rather than absorbed elsewhere.","This rests on a measured window from a metrics source, so it is only as long as that source has been running: a young Prometheus reports a short window and the confidence says so. Without a usage source the rule emits nothing rather than guessing.","Requests are compared against observed p95 with headroom, taking the busiest replica rather than the mean. It is a statement about reserved capacity, never about whether the workload is fast enough."],"v":"1.0.0"},"k8s.namespace.default-namespace-in-use":{"w":"The default namespace has no PSA labels, NetworkPolicy scope, or resource quotas applied by convention, so anything running there sits outside the namespace-scoped guardrails this report otherwise checks — a governance and blast-radius hygiene gap.","e":["Deployment default/legacy-cron-runner runs in the default namespace"],"b":["This reports what is not configured, which is not the same as what is not enforced. A CNI may carry segmentation in its own policy objects, which this product does not read, so the absence of an upstream NetworkPolicy is not the absence of isolation.","An admission control governs what may be applied next. It says nothing about what is already running, which was admitted under whatever policy was in force at the time."],"v":"1.1.0"},"k8s.namespace.no-network-policy":{"w":"This cluster runs Cilium, which can enforce segmentation via its own CRDs tha hing that turns securityContext hardening from a suggestion into a guarantee — without it, a single noncompliant manifest re-opens every gap the per-container checks flag.","e":["namespace default: enforce=\u003cunset\u003e, warn=\u003cunset\u003e, audit=\u003cunset\u003e — admission does not block any pod"],"b":["This reports what is not configured, which is not the same as what is not enforced. A CNI may carry segmentation in its own policy objects, which this product does not read, so the absence of an upstream NetworkPolicy is not the absence of isolation.","An admission control governs what may be applied next. It says nothing about what is already running, which was admitted under whatever policy was in force at the time."],"v":"1.0.0"},"k8s.observed.alerts-firing":{"w":"An alert is a rule plus a time window, and neither is an object — so nothing in a snapshot of this cluster can see it. What is listed here is what the people who run this cluster already decided was worth waking someone for.","e":["Snapshot taken at 2026-09-15T05:28:50Z. Each resource kind is listed independently, so the node, pod and budget views can differ by moments; re-verify against the live cluster before acting.","read from this cluster's own Prometheus, 7-day window ending at this reading","alertname=\"KubeDeploymentReplicasMismatch\" severity=\"warning\" — namespace payments, 1 series firing","A FIRING ALERT MEANS THE EXPRESSION EVALUATES TRUE. It does not mean the situation the rule names is real: alert thresholds are the most miscalibrated artifact in most clusters, and a rule fires just as loudly when its exporter breaks as when its subject does."],"b":["This is sourced from a metrics endpoint, so its absence is a third state — not assessed — distinct from clean. When no source was reachable the rule emits nothing rather than an all-clear.","Throttling is a ratio of period counters over the measured window. It is not a count of seconds a container spent throttled, and it is not a statement that anything was slow."],"v":"1.0.0"},"k8s.observed.scrape-targets-down":{"w":"Scrape health is not an object, so nothing in a snapshot of this cluster reveals it. A monitoring stack is the one component that cannot report its own gaps — the thing that would tell you a series is missing is the thing that is missing it.","e":["Snapshot taken at 2026-09-15T05:28:50Z. Each resource kind is listed independently, so the node, pod and budget views can differ by moments; re-verify against the live cluster before acting.","read from this cluster's own Prometheus at the moment of this reading; 53 targets up, 2 down","job=\"kube-controller-manager\" — 1 target reporting up=0","job=\"kube-scheduler\" — 1 target reporting up=0"],"b":["This is sourced from a metrics endpoint, so its absence is a third state — not assessed — distinct from clean. When no source was reachable the rule emits nothing rather than an all-clear.","Throttling is a ratio of period counters over the measured window. It is not a count of seconds a container spent throttled, and it is not a statement that anything was slow."],"v":"1.0.0"},"k8s.rbac.binding-subject-unresolved":{"w":"A grant to a subject that does not exist is dormant rather than harmless: it is the permission nobody audits, because the account it points at is not there to be reviewed alongside it.","e":["Snapshot taken at 2026-09-15T05:28:50Z. Each resource kind is listed independently, so the node, pod and budget views can differ by moments; re-verify against the live cluster before acting.","RoleBinding workers/acme-legacy-migrator names 1 ServiceAccount subject absent from this reading: workers/acme-migrator-retired","whether this binding ever granted anything is in an audit log this reading does not have; a name that resolves to nothing is what it reports"],"b":["The finding is that the reference resolves to nothing in this reading. It is not a prediction of what will happen: a pod created after the target went away behaves differently from one that has been running for a month on a token it already holds, and the snapshot cannot tell which it is looking at.","This is an absence claim over the TARGET list, so it is made only when that list was actually read. A refused list produces silence here rather than a cluster that appears entirely broken.","Kinds this product does not collect are excluded and counted, never reported as missing — an autoscaler may target an Argo Rollout or a KEDA ScaledObject, and calling those absent would fire on every cluster running one.","The bindings Kubernetes writes for itself are excluded: the label kubernetes.io/bootstrapping: rbac-defaults AND the exact upstream binding — name, role and subjects. Some name ServiceAccounts for cloud controllers a cluster never runs, so their absence is the distribution's. A labelled binding that is not the upstream one, or an unlabelled one, is reported."],"v":"1.0.0"},"k8s.rbac.binding-to-builtin-subject":{"w":"system:masters is authorized above RBAC: the API server grants its members every action on every resource without consulting any Role, so this binding is a signal that a break-glass path exists rather than the thing that grants the power, so a binding that names it hands the referenced role to everyone it covers at once, without any of them appearing in this or any other object.","e":["ClusterRoleBinding acme-break-glass: subjects include Group system:masters","ClusterRoleBinding acme-break-glass: roleRef is ClusterRole cluster-admin, cluster-wide"],"b":["An absence here is not an absence of the subject. Membership is decided outside the cluster — a client certificate's O=, an OIDC claim, a provider's IAM mapping, or for the unauthenticated identities the simple absence of a credential — so a reading with no such binding has not established that nobody holds it.","Whether the grant is reachable was not established. Anonymous requests are accepted or refused by a control-plane flag a managed cluster does not expose, so a binding naming an unauthenticated subject may be live or may be unreachable, and this reading cannot tell those apart.","Nothing here is a statement about the role's contents. This finding is about the subject a binding names; what the referenced role permits is a separate reading, and a harmless role bound to a dangerous subject is reported here exactly as a powerful one is.","A permission is not a use. Nothing here says the grant was exercised; the snapshot carries no audit log and no request history.","The bindings Kubernetes writes for itself are excluded: the label kubernetes.io/bootstrapping: rbac-defaults AND the exact binding the upstream bootstrap policy writes — its name, its role and its subjects, no more and no fewer. The label alone is not trusted, because anybody who can create a binding can set it; a labelled binding that is not the upstream one is reported like any other. A binding an installer created without that label is reported even where it is that installer's normal behaviour, because a rule that decided which installers to trust would be making a judgement this reading cannot support."],"v":"1.0.0"},"k8s.rbac.cluster-admin-serviceaccount":{"w":"If a pod holding this token is compromised, the blast radius is the whole cluster: read every Secret, run privileged workloads, erase the evidence. Confirm the workload genuinely needs cluster-wide write before keeping the grant.","e":["ClusterRoleBinding acme-deployer-cluster-admin: ServiceAccount workers/cicd-deployer -\u003e cluster-admin","scope note: matches the built-in ClusterRole \"cluster-admin\" by name only — custom wildcard (*,*,*) or aggregated ClusterRoles are functionally equivalent but out of scope (role bodies not collected)"],"b":["This names one role's rules and the bindings that activate it. It is not a total: a subject's effective permissions are the union over every binding that names it or any group it belongs to, and group membership is decided by the authenticator rather than by anything in the cluster.","A permission is not a use. Nothing here says the grant was exercised; the snapshot carries no audit log and no request history.","The bindings Kubernetes writes for itself are not counted as activating a role: the label kubernetes.io/bootstrapping: rbac-defaults AND the exact upstream binding — name, role and subjects. The label alone is not trusted. Two upstream bindings are counted anyway, because their roles may have been edited and the API server never removes a permission: one naming a broad group such as system:authenticated, and one whose role grants every verb on every resource and is not cluster-admin. A bootstrap role edited in any narrower way is not detected."],"v":"1.0.0"},"k8s.rbac.dangerous-grant":{"w":"A rule written with `*` for verbs, groups and resources permits anything the API server offers, including resources added later by a CRD nobody has reviewed.","e":["ClusterRole cluster-admin: a rule permits every verb on every resource.","ClusterRoleBinding acme-break-glass names Group system:masters, and reaches cluster-wide.","ClusterRoleBinding acme-deployer-cluster-admin names ServiceAccount workers/cicd-deployer, and reaches cluster-wide."],"b":["This names one role's rules and the bindings that activate it. It is not a total: a subject's effective permissions are the union over every binding that names it or any group it belongs to, and group membership is decided by the authenticator rather than by anything in the cluster.","A permission is not a use. Nothing here says the grant was exercised; the snapshot carries no audit log and no request history.","The bindings Kubernetes writes for itself are not counted as activating a role: the label kubernetes.io/bootstrapping: rbac-defaults AND the exact upstream binding — name, role and subjects. The label alone is not trusted. Two upstream bindings are counted anyway, because their roles may have been edited and the API server never removes a permission: one naming a t taken at 2026-09-15T05:28:50Z. Each resource kind is listed independently, so the node, pod and budget views can differ by moments; re-verify against the live cluster before acting.","HPA payments/payments-orchestrator: spec.minReplicas = 2, spec.scaleTargetRef = Deployment/payments-orchestrator","PDB payments/payments-orchestrator-pdb: spec.minAvailable = 3, selector as written: app=payments-orchestrator","that selector matches exactly one workload in this reading, Deployment payments/payments-orchestrator, so the pods it counts and the pods the autoscaler sizes are the same set"],"b":["This is a state read at one instant. The snapshot has no time axis, so nothing here is a rate, a trend or a duration — a restart count is a total the kubelet reports, not a frequency.","No cause is asserted. The reading records what the cluster says about itself; why it says it is outside what a read-only client can see."],"v":"1.0.0"},"k8s.reliability.condition-unchanged":{"w":"A condition that has held the same non-healthy reading for longer than any ordinary operation takes is one the cluster has stopped resolving on its own. It is also the kind of state that is easy to stop seeing: it was noticed once, it did not clear, and it became part of the background.","e":["Snapshot taken at 2026-09-15T05:28:50Z. Each resource kind is listed independently, so the node, pod and budget views can differ by moments; re-verify against the live cluster before acting.","Node ip-10-0-2-b: status.conditions[DiskPressure].status = \"True\", and the healthy reading for this condition is \"False\"","condition lastTransitionTime=2026-07-15T04:20:00Z; reading taken 2026-09-15T05:28:50Z","controller reason=KubeletHasDiskPressure message=kubelet has disk pressure"],"b":["This is a state read at one instant. The snapshot has no time axis, so nothing here is a rate, a trend or a duration — a restart count is a total the kubelet reports, not a frequency.","No cause is asserted. The reading records what the cluster says about itself; why it says it is outside what a read-only client can see."],"v":"1.1.0"},"k8s.reliability.container-restart-total":{"w":"A container that keeps being restarted is being kept alive by the kubelet rather than by working, and each restart drops whatever was in memory. The workload reports itself as running throughout.","e":["Snapshot taken at 2026-09-15T05:28:50Z. Each resource kind is listed independently, so the node, pod and budget views can differ by moments; re-verify against the live cluster before acting.","pod default/legacy-cron-runner-7f4b9c0-a container \"legacy-cron-runner\": restartCount = 37, 62 days since the pod was created","restartCount is a TOTAL since the container was created and carries no rate, so the pod's age is stated beside it — forty restarts over a year and forty over a morning are different facts and this reading cannot compute the difference for you","a monitoring stack plots the rate continuously; this is the total, which is what a snapshot has"],"b":["This is a state read at one instant. The snapshot has no time axis, so nothing here is a rate, a trend or a duration — a restart count is a total the kubelet reports, not a frequency.","No cause is asserted. The reading records what the cluster says about itself; why it says it is outside what a read-only client can see."],"v":"1.0.0"},"k8s.reliability.cronjob-no-recent-success":{"w":"A scheduled job that stops completing reports nothing anywhere: the CronJob object stays healthy, the workload it maintains simply stops being maintained.","e":["CronJob workers/acme-nightly-reconcile: status.lastSuccessfulTime=2026-07-16T04:20:00Z, which is 61d before this reading (2026-09-15T05:28:50Z)","observation window: 7d — no successful completion is recorded inside it","status.lastScheduleTime=2026-07-16T04:20:00Z, so the controller is still creating runs","spec.schedule=\"17 2 * * *\" — cron expressions are NOT parsed by this rule, so compare the period yourself: a sche nning until something external notices.","e":["container node-exporter in Deployment monitoring/node-exporter: no readiness or liveness probe configured","Caveat: Read from the controller PodSpec only — probes injected by mutating admission webhooks, operators, or mesh sidecars on the running pod are not visible here, and some teams deliberately manage probes outside the workload manifest. Confirm against a live pod before treating this as a true gap."],"b":["This is read from the workload's declared pod template, not from what is running. Admission may inject or mutate containers, so the pod the scheduler placed is not always the pod described here.","The count is per container and states its denominator: a workload where some containers set a field and others do not says how many of how many, because a partial workload rendered as a whole one is the same defect as an absence rendered as a pass.","A declared setting is not a demonstrated behaviour. Nothing here says a container attempted anything, only what its specification permits."],"v":"1.0.0"},"k8s.workload.privileged-host-access":{"w":"Node agents (CNI, CSI, metrics/log collectors) need host access to do their job; the risk is only if this is NOT actually such an agent. Confirm identity rather than stripping access blindly.","e":["NOTE: matches a well-known node-infrastructure pattern (node-exporter) — host/privileged access is expected for this class of workload; verify it is the agent it appears to be before treating as a misconfiguration.","container node-exporter in Deployment monitoring/node-exporter: privileged=true","Deployment monitoring/node-exporter: hostNetwork=true"],"b":["This is read from the workload's declared pod template, not from what is running. Admission may inject or mutate containers, so the pod the scheduler placed is not always the pod described here.","A declared setting is not a demonstrated behaviour. Nothing here says this workload behaved in any particular way, only what its spec /* ═══════════════════════════════════════════════════════════════════════════
   MOTION POLICY, stated once and obeyed everywhere.

   Two animated things per view, never more: panels arrive (fade + 8px rise,
   staggered 26ms, capped at six so a twelve-panel workspace does not become a
   wave), and the drawer slides. Everything else is a 120ms colour change on
   hover, which is feedback rather than animation.

   Enter is ease-out at 180ms; exit is ease-in at 120ms, because an exit that
   takes as long as an entrance feels like the interface is arguing. Anything
   over 300ms on a control reads as lag. prefers-reduced-motion removes all of
   it in core.css — one rule, no per-element opt-outs to forget.
   ═══════════════════════════════════════════════════════════════════════════ */

var D = window.__SHOALCHECK__;
var R = D.rows;
var ID=0, RULE=1, SEV=2, CAT=3, PILLAR=4, WL=5, NS=6, USD=7, TITLE=8, NB=9, OWNER=10, EFF=11, CONF=12;
var SEVN = ['critical','high','medium','low','info'];
var SEVL = ['C','H','M','L','I'];

var S = {
  ws: 'overview',
  urgent: false, sev: null, cat: null, ns: null, rule: null, wl: null, owner: null, q: '',
  lens: 'rules', sort: 'count', desc: true, sel: null, selKind: null
};

var $  = function (id) { return document.getElementById(id); };
var el = function (sel, root) { return (root || document).querySelector(sel); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); };
var num = function (n) { return (n || 0).toLocaleString('en-US'); };
/* A count with its noun, singular or plural — never "1 node(s)", the engine's grammar on the page every visitor opens.
   noun() is the word alone, for a count already printed in its own markup. */
var noun = function (n, one, many) { return +n === 1 ? one : many; };
var plural = function (n, one, many) { return num(n) + ' ' + noun(n, one, many); };
var usd = function (n) { return '$' + Math.round(n || 0).toLocaleString('en-US'); };

/* WHAT DID NOT COME BACK, AND WHY EACH — grouped by cause, in the order the causes first appear.
   A resource kind fails to list for six reasons and they need three different actions: grant a role, fix
   the connection, or nothing at all when the cluster does not serve that kind. Every surface in this
   product used to print one word for all six, and the word was usually a permission. */
var unreadBasis = function () {
  var u = (D.method && D.method.unread) || [];
  if (!u.length) return 'no resource kind is recorded as unread';
  var order = [], by = {};
  u.forEach(function (k) {
    var c = k.cause || 'cause not recorded';
    if (!by[c]) { by[c] = []; order.push(c); }
    by[c].push(k.kind);
  });
  return '<b>' + u.length + '</b> resource kind' + (u.length === 1 ? '' : 's') + ' not read · ' +
    order.map(function (c) {
      return esc(c) + ': <span class="mono">' + by[c].map(esc).join(', ') + '</span>';
    }).join(' · ');
};
/* AN ABSENCE IS NEVER A BLANK, and three tables printed one. The findings list has always rendered a dash
   for a finding with no dollar; the rules table, the workload cards and the dated-findings list printed
   nothing at all — 37 of 40 rows blank under a column NAMED "$ / mo", in the same document where the table
   beside it printed a dash for the same state. A blank under a money header reads as zero, and this reading
   distinguishes no dollar from zero dollars from a dollar that could not be priced. Every money cell in this
   file goes through here. */
var usdOrDash = function (n) { return n > 0 ? usd(n) : '–'; };
var pct = function (a, b) { return b ? Math.round(a / b * 100) : 0; };
var short = function (s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
/* The reading's timestamp is an RFC3339 string with microseconds. That is the
   right thing to store and the wrong thing to show a reader on a cover page. */
var when = function (iso) {
  var d = new Date(iso);
  if (isNaN(d)) return String(iso || '');
  var M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  return d.getDate() + ' ' + M[d.getMonth()] + ' ' + d.getFullYear() + ', ' + hh + ':' + mm;
};
var ruleShort = function (r) { return String(r || '').replace(/^k8s\./, ''); };

/* WHAT AN ID CUT IS. Three things cut the table to a set of finding ids — a control's evidence, a set
   picked by hand, and the findings new since the last reading — and the chip called every one of them
   "named by a control". */
function idsWhat() { return S.idsWhy || 'named by a control'; }

/* ── the cut: one filter function, every surface reads it ─────────────────── */
function cut() {
  var q = S.q.toLowerCase(), out = [];
  /* A control names its evidence by finding id, which is not one of the
     dimensions the facet strip narrows. Membership of an explicit id set is
     therefore its own clause, and the cut bar names it like any other. */
  var idset = null;
  if (S.ids && S.ids.length) { idset = {}; for (var j = 0; j < S.ids.length; j++) idset[S.ids[j]] = 1; }
  for (var i = 0; i < R.length; i++) {
    var r = R[i];
    if (idset && !idset[r[ID]]) continue;
    if (S.urgent && r[SEV] > 1) continue;
    if (S.sev !== null && r[SEV] !== S.sev) continue;
    if (S.cat && r[CAT] !== S.cat) continue;
    if (S.ns !== null && S.ns !== undefined && S.ns !== '' && r[NS] !== S.ns) continue;
    if (S.rule && r[RULE] !== S.rule) continue;
    if (S.wl && r[WL] !== S.wl) continue;
    if (S.owner && r[OWNER] !== S.owner) continue;
    if (S.eff !== null && S.eff !== undefined && r[EFF] !== S.eff) continue;
    if (S.fix && !hasFix(r[ID])) continue;
    if (q && (r[TITLE]+' '+r[RULE]+' '+r[WL]+' '+r[NS]+' '+r[OWNER]).toLowerCase().indexOf(q) < 0) continue;
    out.push(r);
  }
  return out;
}

/* The engine ships a manifest or a command with 54 of the 134 findings. "Show me
   only the ones that come with a fix" is the most useful single narrowing a
   person triaging can make, and the data for it was already on disk. */
function hasFix(id) { var d = (D.det || {})[id]; return !!(d && (d.y || d.c)); }

function tally(rows) {
  var t = { n: rows.length, usd: 0, sev: [0,0,0,0,0], eff: [0,0,0], fix: 0, rule: {}, wl: {}, ns: {}, cat: {}, owner: {} };
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    t.usd += r[USD]; t.sev[r[SEV]]++;
    t.rule[r[RULE]] = (t.rule[r[RULE]] || 0) + 1;
    t.eff[r[EFF]]++;
    if (hasFix(r[ID])) t.fix++;
    if (r[WL]) t.wl[r[WL]] = (t.wl[r[WL]] || 0) + 1;
    t.ns[r[NS] || '(cluster)'] = (t.ns[r[NS] || '(cluster)'] || 0) + 1;
    t.cat[r[CAT]] = (t.cat[r[CAT]] || 0) + 1;
    if (r[OWNER]) t.owner[r[OWNER]] = (t.owner[r[OWNER]] || 0) + 1;
  }
  return t;
}
var ALL = tally(R);

/* "$0" IS A MEASUREMENT ONLY WHERE SOMETHING WAS PRICED. A kind cluster, or a region the price table does not
   cover, reaches the island with every pool unpriced and every finding at 0 — and the status line printed
   "$0 of $0" under every workspace, the overview "$0 identified / mo", the Cost workspace "$0 / mo across 0
   priced pool(s)": priced zeros over a reading that priced nothing. A total is a figure when a pool carries a
   rate or a finding carries a dollar; otherwise it is the word. */
var PRICED = ALL.usd > 0 || (D.pools || []).some(function (p) { return p.src !== 'unpriced'; });

/* WHERE THE CLUSTER RUNS, without a hole. A kind or bare-metal cluster has no region, and four lines joined
   provider, region and version blindly: "kind · · k8s 1.36.1" across the top of a real reading. */
var whereOf = function (k8s) {
  return [D.provider, D.region, D.k8s ? k8s + ' ' + D.k8s : ''].filter(Boolean).join(' · ');
};

/* dollars only ever come from findings that carry one — 299 of 2,383 on the
   reference cluster — so a "$ per namespace" is a sum over a minority and says
   so wherever it is drawn. */
function sumUsd(rows) { var s = 0; for (var i = 0; i < rows.length; i++) s += rows[i][USD]; return s; }
/* A COLUMN OF DOLLARS IS ROUNDED ROW BY ROW, AND MAY NOT ADD UP TO ITS TOTAL. Every figure here is rounded to the
   dollar on its own — the same rule, the same number, wherever it is printed — so five rules can print $1,646 under
   a total of $1,647. A reader adding the column then finds the page wrong. Where that happens the panel says so
   with both numbers; it never adjusts a row to make the column come out. */
function roundingNote(parts, total, what) {
  var shown = parts.reduce(function (a, v) { return a + Math.round(v || 0); }, 0);
  if (shown === Math.round(total || 0)) return '';
  return ' Each ' + what + ' is rounded to the dollar on its own: together they print ' + usd(shown) + ' against the ' +
    usd(total) + ' total.';
}
/* A unit price, to the cent: "9 × $167.90" is arithmetic a reader can do, "9 × $168" over "$1,511" is not. */
var usdCents = function (n) { return '$' + (n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
function byKey(rows, k) {
  var m = {}; for (var i = 0; i < rows.length; i++) { var v = rows[i][k] || ''; (m[v] = m[v] || []).push(rows[i]); } return m;
}
/* A RANKED LIST THAT STOPS SAYS WHAT IT LEFT OUT: how many, and what they carry between them. Cost's workload
   list showed seven of ten priced workloads under a caption calling every absent one unpriced. */
function restOf(obj, shown, one, many) {
  var keys = Object.keys(obj), n = keys.length - shown.length;
  if (n <= 0) return '';
  var inShown = {}; shown.forEach(function (e) { inShown[e[0]] = true; });
  var rest = keys.reduce(function (a, k) { return inShown[k] ? a : a + obj[k]; }, 0);
  return ' The ' + num(shown.length) + ' largest of ' + num(keys.length) + ' ' + many + ' are listed; the other ' + num(n) + ' ' +
    (n === 1 ? one : many) + ' carry ' + usd(rest) + ' a month between them.';
}
function top(obj, n) {
  return Object.keys(obj).map(function (k) { return [k, obj[k]]; })
    .sort(function (a, b) { return b[1] - a[1] || String(a[0]).localeCompare(String(b[0])); }).slice(0, n);
}

/* ── what one guardrail cell says ────────────────────────────────────────────
   `read` false means the reading could not list that kind in that namespace. It
   is neither a pass nor a failure, and it must not be counted as either — so it
   gets its own tone, its own label, and it is removed from the denominator of any
   coverage figure rather than counted as a miss. */
function guardState(row, key) {
  var read = row[key + 'Read'];
  /* A reading written before the read-flags existed carries none of them. Treating
     that as "not read" would mark every older reading unknown, so absence of the
     flag entirely is taken as the old behaviour: the count is the answer. */
  if (read === undefined) read = true;
  if (!read) return { tone: 'unk', label: 'not read', title: 'not read — neither present nor absent' };
  if (key === 'pss') {
    var v = row.pss;
    return v ? { tone: 'ok', label: String(v), title: 'enforce=' + v }
             : { tone: 'bad', label: 'none', title: 'no pod-security enforce label' };
  }
  var n = row[key] || 0;
  return n > 0 ? { tone: 'ok', label: num(n), title: plural(n, 'object', 'objects') + ' counted' }
               : { tone: 'bad', label: '0', title: 'none counted' };
}

/* ── workload identity ────────────────────────────────────────────────────────
   Two sources name the same workload differently. A finding carries
   `Kind/namespace/name`; the topology carries a bare `name` under a namespace
   key. A bare name is NOT unique — two namespaces may each run an "api-gateway",
   which is precisely why the finding bothers to carry the namespace — so the
   canonical identity is `namespace/name` and both sources are normalised onto it.

   Deriving this inline at each call site is how the workload workspace came to
   list 26 workloads for a 13-workload cluster, and how the reachability graph
   came to colour every node as if it had no findings: the two halves were keyed
   differently and neither was wrong on its own. One function, one identity. */
function wlId(ref) {
  if (!ref) return '';
  var p = String(ref).split('/');
  if (p.length >= 3) return p.slice(1).join('/');   // Kind/ns/name -> ns/name
  if (p.length === 2) return '/' + p[1];            // Kind/name (cluster-scoped) -> /name
  return ref;
}
function wlIdOf(ns, name) { return (ns || '') + '/' + name; }
/* what a human should read: the name, with its namespace only when it helps */
function wlLabel(id) { return String(id || '').replace(/^\//, ''); }

/* ── primitives ───────────────────────────────────────────────────────────── */
function panel(o) {
  return '<section class="panel ' + (o.span || 'c6') + '"' + (o.id ? ' id="' + o.id + '"' : '') +
    (o.ranked !== undefined ? ' data-ranked="' + o.ranked + '" data-shown="' + o.shown + '"' : '') + '>' +
    '<header><h2>' + esc(o.title) + '</h2>' + (o.aside ? '<span class="aside">' + esc(o.aside) + '</span>' : '') + '</header>' +
    '<div class="body">' + o.body + '</div>' +
    (o.basis ? '<div class="basis">' + o.basis + '</div>' : '') +
    '</section>';
}

function stackBar(counts, labels, colours, filterKind) {
  var total = counts.reduce(function (a, b) { return a + b; }, 0) || 1, h = '<div class="stack">';
  for (var i = 0; i < counts.length; i++) {
    if (!counts[i]) continue;
    var wide = counts[i] / total > 0.07;
    /* Room for "11 high" needs more than room for "11": between the two the band keeps its true width and
       prints the count alone, rather than wrapping its label onto a second line inside a 20px bar. */
    var labelled = counts[i] / total > 0.14;
    /* A single critical among two thousand is three pixels wide, which draws the
       most urgent band as the least visible thing on the page. Every present band
       gets a floor, and the label carries the true count so the floor never reads
       as a bigger number than it is. */
    h += '<button style="flex:' + counts[i] + ';min-width:' + (wide ? 0 : 30) + 'px;background:' + colours[i] + ';color:' + (i < 2 ? 'var(--on-sev-' + i + ')' : 'var(--sev-' + i + ')') + '"' +
      ' data-f="' + filterKind + '" data-v="' + i + '" title="' + num(counts[i]) + ' ' + labels[i] + '"' +
      ' aria-label="' + num(counts[i]) + ' ' + labels[i] + '">' +
      (labelled ? num(counts[i]) + ' ' + labels[i] : '<span style="font-size:' + (wide ? 11 : 9.5) + 'px">' + num(counts[i]) + '</span>') + '</button>';
  }
  return h + '</div>';
}

var CATS = ['security','reliability','cost','config','compliance'];
function catVar(c) { return CATS.indexOf(c) >= 0 ? 'var(--cat-' + c + ')' : 'var(--fg-faint)'; }
function catBg(c)  { return CATS.indexOf(c) >= 0 ? 'var(--cat-' + c + '-bg)' : 'var(--sunk)'; }

/* ── severity-segmented ranks ────────────────────────────────────────────── */
function sranks(groups, o) {
  o = o || {};
  var max = 0, i;
  for (i = 0; i < groups.length; i++) max = Math.max(max, groups[i].rows.length);
  max = max || 1;
  return '<div class="sranks">' + groups.map(function (g) {
    var c = [0,0,0,0,0], j;
    for (j = 0; j < g.rows.length; j++) c[g.rows[j][SEV]]++;
    var segs = '', width = g.rows.length / max * 100;
    for (j = 0; j < 5; j++) {
      if (!c[j]) continue;
      segs += '<i style="flex:' + c[j] + ';background:var(--sev-' + j + ')" title="' +
              num(c[j]) + ' ' + SEVN[j] + '"></i>';
    }
    return '<button class="srank" data-f="' + esc(o.f || 'ns') + '" data-v="' + esc(g.key) + '"' +
      ' title="' + esc(g.label + ' — ' + c.map(function (n, k) { return n + ' ' + SEVN[k]; })
        .filter(function (x) { return x.charAt(0) !== '0'; }).join(', ')) + '">' +
      '<span class="nm">' + esc(g.label) + '</span>' +
      '<span class="seg" style="width:' + Math.max(3, width) + '%">' + segs + '</span>' +
      '<span class="tot">' + num(g.rows.length) + '</span></button>';
  }).join('') + '</div>';
}

/* ── mass bars ────────────────────────────────────────────────────────────────
   This replaced a squarified treemap. The treemap was correct — it tiled exactly,
   areas were proportional, worst aspect ratio 2.0 — and it was useless: at 62
   rules with 35-character names in a 660px box, every label came out as
   "overpr…", "capab…", "secc…", and forty cells carried no label at all. It was
   verified with geometry and never with a reader.

   A rule name is long and a count is small, so the axis that has room is the
   horizontal one. Ten bars with whole names answer the same question — where does
   the mass come from — and can be read. The other 52 rules are one line of text
   and a workspace away, which is where a long tail belongs. */
function massBars(entries, total) {
  var top = entries.slice(0, 10);
  var max = top.length ? top[0].v : 1;
  var shown = 0, i;
  for (i = 0; i < top.length; i++) shown += top[i].v;
  return '<div class="mbars">' + top.map(function (e) {
    return '<button class="mbar" data-f="rule" data-v="' + esc(e.k) + '"' +
      ' title="' + esc(ruleShort(e.k) + ' — ' + plural(e.v, 'finding', 'findings') + ' · ' + e.cat) + '">' +
      '<span class="mn">' + esc(ruleShort(e.k)) + '</span>' +
      '<span class="mt"><span class="mf" style="width:' + Math.max(2, e.v / max * 100) + '%;' +
        'background:' + catVar(e.cat) + '"></span></span>' +
      '<span class="mv">' + num(e.v) + '</span></button>';
  }).join('') + '</div>' +
  (entries.length > top.length
    ? '<p class="note">These ten are <b>' + Math.round(shown / (total || 1) * 100) + '%</b> of the cut. ' +
      'The other <b>' + num(entries.length - top.length) + '</b> rules are in the Rules workspace.</p>'
    : '');
}

/* ── treemap ──────────────────────────────────────────────────────────────
   Squarified (Bruls, Huizing & van Wijk): lay each row of cells so their aspect
   ratios stay near 1, because a reader compares areas badly and compares long
   thin slivers not at all. Area is the finding count; hue is the category. */
function squarify(items, x, y, w, h, out) {
  /* Bruls, Huizing & van Wijk. `worst` is the row's worst aspect ratio:
       max( side² · aMax / sum² , sum² / (side² · aMin) )
     with every area already scaled into layout units, so the two terms are the
     long-thin and short-fat failures of the same row and the max of them is what
     we minimise. Keep adding cells while that number improves; when it worsens,
     the row is finished. */
  if (!items.length || w <= 0.5 || h <= 0.5) return out;

  function worst(row, side) {
    if (!row.length || side <= 0) return Infinity;
    var sum = 0, aMax = 0, aMin = Infinity;
    for (var i = 0; i < row.length; i++) {
      sum += row[i].a; aMax = Math.max(aMax, row[i].a); aMin = Math.min(aMin, row[i].a);
    }
    if (sum <= 0 || aMin <= 0) return Infinity;
    var s2 = side * side;
    return Math.max(s2 * aMax / (sum * sum), (sum * sum) / (s2 * aMin));
  }

  var horizontal = w >= h;      // rows run down the shorter axis
  var side = horizontal ? h : w;
  var row = [];

  while (items.length) {
    var cand = row.concat([items[0]]);
    if (row.length && worst(cand, side) > worst(row, side)) break;
    row = cand; items.shift();
  }

  var sum = 0, i;
  for (i = 0; i < row.length; i++) sum += row[i].a;
  var thick = sum / side, off = 0;
  for (i = 0; i < row.length; i++) {
    var len = row[i].a / thick;
    if (horizontal) out.push({ d: row[i].d, x: x, y: y + off, w: thick, h: len });
    else            out.push({ d: row[i].d, x: x + off, y: y, w: len, h: thick });
    off += len;
  }
  if (horizontal) squarify(items, x + thick, y, w - thick, h, out);
  else            squarify(items, x, y + thick, w, h - thick, out);
  return out;
}

function treemap(entries, W, H) {
  var items = entries.slice().sort(function (a, b) { return b.v - a.v; })
                     .filter(function (e) { return e.v > 0; });
  var total = 0, i;
  for (i = 0; i < items.length; i++) total += items[i].v;
  if (!total) return '<div class="tmap"></div>';
  var scale = (W * H) / total;
  var scaled = items.map(function (e) { return { d: e, a: e.v * scale }; });
  var cells = squarify(scaled, 0, 0, W, H, []);
  return '<div class="tmap">' + cells.map(function (c) {
    var pw = c.w / W * 100, ph = c.h / H * 100;
    var room = c.w > 62 && c.h > 30;
    return '<button class="tcell" data-f="rule" data-v="' + esc(c.d.k) + '"' +
      ' style="left:' + (c.x / W * 100) + '%;top:' + (c.y / H * 100) + '%;width:' + pw + '%;height:' + ph + '%;' +
      'background:' + catBg(c.d.cat) + ';box-shadow:inset 3px 0 0 ' + catVar(c.d.cat) + '"' +
      ' title="' + esc(ruleShort(c.d.k) + ' — ' + plural(c.d.v, 'finding', 'findings') + ' · ' + c.d.cat) + '">' +
      (room ? '<span class="tv">' + num(c.d.v) + '</span><span class="tn">' +
              esc(ruleShort(c.d.k).replace(/^[a-z]+\./, '')) + '</span>' : '') +
      '</button>';
  }).join('') + '</div>';
}

/* ── layered graph renderer ───────────────────────────────────────────────────
   Shared by the reachability graph and the RBAC graph. Takes columns of nodes and
   the edges between them, orders each column by the barycentre of its neighbours,
   assigns coordinates right-to-left so the tall column sets the scale, and draws.

   Written once because the second caller proved the first was not a one-off: an
   RBAC binding chain and an ingress path are the same shape — a few sources, a
   middle that fans, and a set of sinks that are shared. Drawing the second as a
   list of rows would have hidden exactly what a reader needs to see, which is
   which sink is shared by how many sources. */
/* ARROWHEAD MARKERS, SCOPED PER GRAPH.
   Two graph builders in this file each emitted `<marker id="ah">` and `<marker id="ah-on">`, and both
   graphs are on the page at once — so `url(#ah)` resolved to the FIRST one and the second graph drew with
   the first graph's arrowheads. The two definitions happened to be byte-identical, which is exactly why
   nothing looked wrong; the day one graph wants a smaller head or a different colour, the symptom is a
   picture that still looks fine. Found by browser-check 23, which counts ids in the LIVE DOM — the Go gate
   over the shipped text saw nothing, because these markers are strings until the page runs.

   The suffix comes from a counter rather than from the graph's label: a label is customer data, it can be
   absent, and two graphs can share one. A counter is injective by construction. */
/* The point on a cubic Bézier curve whose x is nearest the one given: where an edge crosses the gap its label
   belongs in. Sampled, because a label needs a place, not a root. */
function bezierAtX(x0, y0, x1, y1, x2, y2, x3, y3, x) {
  var best = Infinity, bx = 0, by = 0;
  for (var i = 0; i <= 100; i++) {

/* ═══ WORKSPACES ═══════════════════════════════════════════════════════════ */

function wsOverview(rows, t, opt) {
