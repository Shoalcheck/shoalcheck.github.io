ange object. There is no namespace-level cap on how much CPU or memory the namespace can claim against the cluster, and no LimitRange to supply default per-container requests. Every observed container already sets explicit requests, so the per-pod gap is limited to the absence of a namespace cap and a default-request safety net for future workloads. Note: this is an object-presence check — defaults injected at admission time by a mutating webhook or policy engine (Kyverno, OPA/Gatekeeper) are not visible to a read-only scan and may already govern this namespace; verify before acting.","r":[{"k":"Namespace","m":"api"}],"y":"apiVersion: v1\nkind: LimitRange\nmetadata:\n  name: default-limits\n  namespace: api\nspec:\n  limits:\n    - type: Container\n      defaultRequest:   # starting point — right-size from usage before applying\n        cpu: 100m\n        memory: 128Mi\n      default:          # starting point — right-size from usage before applying\n        cpu: 500m\n        memory: 512Mi\n","k":["daemonsets","deployments","limitranges","resourcequotas","statefulsets"]},"07655d07be70":{"d":"The most recent status.lastSuccessfulTime on CronJob workers/acme-nightly-reconcile is 61d before this reading, which is outside the 7d observation window. The timestamp is the controller's own record. No verdict follows from it: a schedule whose period is longer than the window reads exactly the same way, which is why the schedule is quoted rather than interpreted.","r":[{"k":"CronJob","n":"workers","m":"acme-nightly-reconcile"}],"k":["cronjobs"]},"08eb4b10be4b":{"d":"The controller for Deployment payments/payments-orchestrator reports 2 ready of the 3 its spec asks for, and it has observed the current spec (observedGeneration matches metadata.generation). WHY the remaining 1 are not ready is not in this reading — the pods themselves carry that, and k8s.reliability.pod-not-ready reports what the kubelet says about them.","r":[{"k":"Deployment","n":"payments","m":"payments-orchestrator"}],"k":["daemonsets","deployments","statefulsets"]},"0ac91964537b":{"d":"Namespace monitoring runs workloads but does not enforce a PodSecurity admission profile of baseline or restricted (enforce=\u003cunset\u003e). Without enforcement, the per-container PSS findings in this report describe the spec AS AUTHORED — nothing in the cluster actually blocks a privileged, root, or capability-laden pod from being admitted here. Apply the labels gradually: set warn and audit first to surface what would break, then set enforce. Enforcing restricted on a namespace that already runs noncompliant pods does NOT evict them, but it WILL block the next admission (a redeploy or rollout) — stage it. baseline is the safe first target (it blocks privileged, hostPath, hostNetwork, and host namespaces); however, the per-container findings in this report for this namespace (seccomp, drop-ALL capabilities, allowPrivilegeEscalation, runAsNonRoot) are Restricted-profile controls, so enforce=restricted is required to fully close them — baseline alone will not.","r":[{"k":"Namespace","m":"monitoring"}],"c":"kubectl label --overwrite namespace monitoring pod-security.kubernetes.io/warn=baseline pod-security.kubernetes.io/audit=baseline   # surface breakage first, then set enforce=baseline; use restricted (not baseline) on both warn/audit/enforce to close the per-container seccomp/capabilities/runAsNonRoot findings","s":"one-click","k":["daemonsets","deployments","namespaces","statefulsets"]},"0b11a8574f11":{"d":"StatefulSet workers/licensed-etl reserves CPU/memory above what its 7d usage ever needed, across 1 replica. CPU is sized to the busiest replica's p95 plus 30% headroom; memory to the larger of p95×1.3 and the observed 7d max. The memory recommendation is floored at the observed 7d max so a bursty or GC-heavy workload is not down-sized below a working set it provably reaches. This reclaims reserved capacity the workload's 7d p95 never used — but the 95th percentile excludes tail bursts, so verify against the container's 7d max and your latency SLOs before applying: CPU below request is throttled, memory below peak is OOMKilled.","r":[{"k":"StatefulSet","n":"workers","m":"licensed-etl"}],"y":"apiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: licensed-etl\n  namespace: workers\nspec:\n  template:\n    spec:\n      containers:\n        - name: etl\n          resources:\n            requests:\n              cpu: 110m      # 7d p95 ×1.3, right-sized\n              memory: 320Mi  # 7d p95 ×1.3, right-sized\n","pb":"priced","sk":"compute","k":["daemonsets","deployments","nodes","pods","statefulsets"],"us":"prometheus"},"0cbb0e17716f":{"d":"Deployment payments/payments-gateway sets no dedicated ServiceAccount and mounts the default SA's API token into every container. No RoleBinding or ClusterRoleBinding observed in this cluster references this namespace's default SA, so the token grants only baseline authenticated/discovery access today — but any future RoleBinding silently widens this exposure to every pod already on the default SA. If this workload does need API access, give it a dedicated ServiceAccount with a scoped Role instead. Exception: if this pod uses the projected token for cloud IAM (EKS IRSA / Pod Identity, GKE Workload Identity), disabling automount will break that — give it a dedicated SA configured for the integration instead of turning the token off.","r":[{"k":"Deployment","n":"payments","m":"payments-gateway"}],"y":"# Validate before applying: if this pod relies on a projected token for\n# cloud IAM (EKS IRSA / Pod Identity, GKE Workload Identity) or actually\n# calls the Kubernetes API, do NOT disable automount — give it a dedicated\n# ServiceAccount configured for that integration instead.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: payments-gateway\n  namespace: payments\nspec:\n  template:\n    spec:\n      automountServiceAccountToken: false\n","k":["clusterrolebindings","daemonsets","deployments","rolebindings","serviceaccounts","statefulsets"]},"0f5d9bf254a2":{"d":"Namespace api runs 3 workloads and defines zero upstream (networking.k8s.io/v1) NetworkPolicy objects. This cluster runs Cilium, which may enforce segmentation through its own CRDs (e.g. CiliumNetworkPolicy / projectcalico.org policies) that shoalcheck does not yet read — so zero upstream objects does NOT prove the namespace is unsegmented. If it is genuinely flat, start with a default-deny-ingress policy, then add explicit allows for the flows that exist.","r":[{"k":"Namespace","m":"api"}],"y":"# NOTE: this cluster runs Cilium. Verify the namespace is not already segmented via Cilium CRDs\n# before adding this upstream object; validate against your workload's real flows before applying.\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-ingress\n  namespace: api\nspec:\n  podSelector: {}  # empty selector = every pod in the namespace\n  policyTypes:\n    - Ingress\n","k":["daemonsets","deployments","networkpolicies","server-resources","statefulsets"]},"1904067e5f55":{"d":"The cluster reports Kubernetes 1.31. Ordinary support from AWS ended on 2025-11-26; the cluster is inside the paid extension, which ends 2026-11-26.","r":[{"k":"Cluster","m":"1.31"}],"pb":"priced","sk":"control-plane","k":["nodes"]},"1b3ebe017313":{"d":"Deployment api/api-gateway has 1 of 1 container that do not drop ALL capabilities, so each keeps the default Linux capability set (NET_RAW included). The PSS-Restricted profile requires capabilities.drop:[ALL]; add back only NET_BIND_SERVICE if the container binds a privileged port. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"api","m":"api-gateway"}],"k":["da en for cloud IAM (EKS IRSA / Pod Identity, GKE Workload Identity), disabling automount will break that — give it a dedicated SA configured for the integration instead of turning the token off.","r":[{"k":"Deployment","n":"api","m":"search-indexer"}],"y":"# Validate before applying: if this pod relies on a projected token for\n# cloud IAM (EKS IRSA / Pod Identity, GKE Workload Identity) or actually\n# calls the Kubernetes API, do NOT disable automount — give it a dedicated\n# ServiceAccount configured for that integration instead.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: search-indexer\n  namespace: api\nspec:\n  template:\n    spec:\n      automountServiceAccountToken: false\n","k":["clusterrolebindings","daemonsets","deployments","rolebindings","serviceaccounts","statefulsets"]},"1dec706d3b80":{"d":"Every EndpointSlice listed for Service api/api-gateway publishes zero entries with conditions.ready=true. An entry records that a controller published an address as a backend of this Service, so this is a count of what was published and says nothing about what any request did. Whether the count is expected depends on what this Service is for, which the snapshot does not record: a batch endpoint nobody calls, the idle half of a blue/green pair, and a Service whose consumers were retired all read exactly the same way.","r":[{"k":"Service","n":"api","m":"api-gateway"}],"k":["endpointslices","services"]},"2345f2b5c939":{"d":"Every EndpointSlice listed for Service payments/old-admin-lb publishes zero entries with conditions.ready=true. An entry records that a controller published an address as a backend of this Service, so this is a count of what was published and says nothing about what any request did. Whether the count is expected depends on what this Service is for, which the snapshot does not record: a batch endpoint nobody calls, the idle half of a blue/green pair, and a Service whose consumers were retired all read exactly the same way.","r":[{"k":"Service","n":"payments","m":"old-admin-lb"}],"k":["endpointslices","services"]},"23977455f4df":{"d":"Namespace payments runs 3 long-running workloads (Deployments/StatefulSets/DaemonSets) with no ResourceQuota and no LimitRange object. There is no namespace-level cap on how much CPU or memory the namespace can claim against the cluster, and no LimitRange to supply default per-container requests. Every observed container already sets explicit requests, so the per-pod gap is limited to the absence of a namespace cap and a default-request safety net for future workloads. Note: this is an object-presence check — defaults injected at admission time by a mutating webhook or policy engine (Kyverno, OPA/Gatekeeper) are not visible to a read-only scan and may already govern this namespace; verify before acting.","r":[{"k":"Namespace","m":"payments"}],"y":"apiVersion: v1\nkind: LimitRange\nmetadata:\n  name: default-limits\n  namespace: payments\nspec:\n  limits:\n    - type: Container\n      defaultRequest:   # starting point — right-size from usage before applying\n        cpu: 100m\n        memory: 128Mi\n      default:          # starting point — right-size from usage before applying\n        cpu: 500m\n        memory: 512Mi\n","k":["daemonsets","deployments","limitranges","resourcequotas","statefulsets"]},"23cd731c738c":{"d":"Deployment api/api-gateway has a probe whose port matches no containerPort declared on the same container. The container DOES declare ports, which is what makes the mismatch readable: the spec names one set of ports and probes a different one.","r":[{"k":"Deployment","n":"api","m":"api-gateway"}],"k":["daemonsets","deployments","statefulsets"]},"2460b2193ffd":{"d":"Deployment workers/ledger-reconciler runs 4 replicas but declares no podAntiAffinity and no topologySpreadConstraints. The scheduler may co-locate replicas on one node, so one node failure or drain could take several down together. Observed 12 schedulable nodes across 3 zones.","r":[{"k":"Deployment","n":"workers","m":"ledger-reconciler"}],"y":"# Validate against your workload before applying: with whenUnsatisfiable: ScheduleAnyway this is\n# soft (won't block scheduling); spread is bounded by the number of schedulable nodes/zones.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ledger-reconciler\n  namespace: workers\nspec:\n  template:\n    spec:\n      topologySpreadConstraints:\n        - maxSkew: 1\n          topologyKey: kubernetes.io/hostname\n          whenUnsatisfiable: ScheduleAnyway\n          labelSelector:\n            matchLabels:\n              app: ledger-reconciler\n","k":["daemonsets","deployments","nodes","poddisruptionbudgets","statefulsets"]},"25015b652f49":{"d":"Deployment workers/risk-batch-processor does not enforce non-root execution at the API in 1 of 1 container: runAsNonRoot is unset and no non-zero runAsUser is set. The container image's USER directive is invisible to a read-only API client, so an unset spec is reported as UNCONFIRMED non-root, never \"runs as root\" — and rated Medium, like the other PSS fields a spec can leave unset. It is rated High only when root is confirmed or near-certain: an explicit runAsUser:0 / runAsNonRoot:false, or a known root-by-default base image with no non-root assertion (each called out per container in the evidence). Set runAsNonRoot:true (and a non-zero runAsUser) on the pod or container securityContext to make non-root intent explicit and admission-enforceable. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"workers","m":"risk-batch-processor"}],"k":["daemonsets","deployments","statefulsets"]},"286e1369a764":{"d":"Deployment payments/payments-orchestrator runs 3 replicas but declares no podAntiAffinity and no topologySpreadConstraints. The scheduler may co-locate replicas on one node, so an involuntary failure of that node could take several down together. (A PodDisruptionBudget already bounds how many pods a voluntary drain can evict at once, so the drain blast radius is limited; the involuntary node-failure exposure remains.) Observed 12 schedulable nodes across 3 zones.","r":[{"k":"Deployment","n":"payments","m":"payments-orchestrator"}],"y":"# Validate against your workload before applying: with whenUnsatisfiable: ScheduleAnyway this is\n# soft (won't block scheduling); spread is bounded by the number of schedulable nodes/zones.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: payments-orchestrator\n  namespace: payments\nspec:\n  template:\n    spec:\n      topologySpreadConstraints:\n        - maxSkew: 1\n          topologyKey: kubernetes.io/hostname\n          whenUnsatisfiable: ScheduleAnyway\n          labelSelector:\n            matchLabels:\n              app: payments-orchestrator\n","k":["daemonsets","deployments","nodes","poddisruptionbudgets","statefulsets"]},"29e495848160":{"d":"Namespace workers runs 4 long-running workloads (Deployments/StatefulSets/DaemonSets) with no ResourceQuota and no LimitRange object. There is no namespace-level cap on how much CPU or memory the namespace can claim against the cluster, and no LimitRange to supply default per-container requests. 1 container here also declare no explicit CPU/memory requests, so without a LimitRange defaultRequest they schedule as BestEffort and have no per-pod floor. Note: this is an object-presence check — defaults injected at admission time by a mutating webhook or policy engine (Kyverno, OPA/Gatekeeper) are not visible to a read-only scan and may already govern this namespace; verify before acting.","r":[{"k":"Namespace","m":"workers"}],"y":"apiVersion: v1\nkind: LimitRange\nmetadata:\n  name: default-limits\n  namespace: workers\nspec:\n  limits:\n    - type: Container\n      defaultRequest:   # starting point — right-size from usage before applying\n        cpu: 100m\n        memory: 128Mi\n      default:          # starting point — right-size from usage before applying\n        cpu: 500m\n        memory: 512Mi\n","k":["daemonsets","deployments","limitranges","resourcequotas","statefulsets"]},"2b90e41e773a":{"d":"The DiskPressure condition on Node ip-10-0-2-b has read \"True\" since 2026-07-15T04:20:00Z, and this reading was taken at 2026-09-15T05:28:50Z. In the controller's own terms, the kubelet has signalled that free disk or inodes on this node are below its eviction threshold. Nothing in this reading says what has happened in between: the timestamp records the last change, so an unattended condition and a controller that stopped writing look the same from here.","r":[{"k":"Node","m":"ip-10-0-2-b"}],"k":["deployments","namespaces","nodes","pods"]},"2b9f8a33905b":{"d":"PersistentVolumeClaim payments/data-payments-ledger-db-0 sets spec.storageClassName to \"acme-retired-ssd\", and no StorageClass by that name exists in this reading. Its phase is Bound. What that means depends on when the class went away: a claim bound while the class existed keeps its volume, and a claim created afterwards has nothing to provision it — and this reading cannot tell those apart.","r":[{"k":"PersistentVolumeClaim","n":"payments","m":"data-payments-ledger-db-0"}],"k":["persistentvolumeclaims","storageclasses"]},"2dfd0e7bff3f":{"d":"StatefulSet workers/licensed-etl runs exactly one replica and no PodDisruptionBudget matches its pods. No Service in the namespace selects its pods on a serving port, so loss of the pod is not directly user-facing — but any node drain or interruption still takes the single replica down until it reschedules. This is a StatefulSet: do NOT simply scale to 2 — verify the application supports \u003e1 replica (replication / quorum) first, or a second replica can corrupt data.","r":[{"k":"StatefulSet","n":"workers","m":"licensed-etl"}],"c":"# verify the app supports \u003e1 replica (replication/quorum) before scaling a StatefulSet\nkubectl -n workers scale statefulset/licensed-etl --replicas=2","s":"one-click","k":["daemonsets","deployments","poddisruptionbudgets","services","statefulsets"]},"320f01c079a1":{"d":"Deployment api/search-indexer reserves CPU/memory above what its 7d usage ever needed, across 3 replicas. CPU is sized to the busiest replica's p95 plus 30% headroom; memory to the larger of p95×1.3 and the observed 7d max. The memory recommendation is floored at the observed 7d max so a bursty or GC-heavy workload is not down-sized below a working set it provably reaches. This reclaims reserved capacity the workload's 7d p95 never used — but the 95th percentile excludes tail bursts, so verify against the container's 7d max and your latency SLOs before applying: CPU below request is throttled, memory below peak is OOMKilled.","r":[{"k":"Deployment","n":"api","m":"search-indexer"}],"y":"apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: search-indexer\n  namespace: api\nspec:\n  template:\n    spec:\n      containers:\n        - name: search-indexer\n          resources:\n            requests:\n              cpu: 630m      # 7d p95 ×1.3, right-sized\n              memory: 3744Mi  # 7d p95 ×1.3, right-sized\n","pb":"priced","sk":"compute","k":["daemonsets","deployments","nodes","pods","statefulsets"],"us":"prometheus"},"342b2f4d7fb8":{"d":"Ingress api/acme-public declares 1 backend reference that this reading could not resolve: either no Service of that name was listed in the namespace, or the Service exists and its EndpointSlices publish no address with conditions.ready=true. Those are two different statements and the evidence says which applies to each backend. What the Ingress controller does with an unresolved backend is controller-specific and not read here.","r":[{"k":"Ingress","n":"api","m":"acme-public"},{"k":"Service","n":"api","m":"api-gateway"}],"k":["endpointslices","ingresses","services"]},"380248bc3f40":{"d":"2 PersistentVolumes resolve to the gp2 EBS type. gp3 is priced below gp2 per GB-month in every region this build carries, and its free baseline is 3000 IOPS and 125 MB/s. This is a rate difference on storage that is already provisioned — the volumes, their sizes and their data are unchanged by it.","r":[{"k":"PersistentVolume","m":"pvc-ledger-archive"},{"k":"PersistentVolume","m":"pvc-analytics-scratch"}],"pb":"priced","sk":"storage","k":["nodes","persistentvolumes","storageclasses"]},"38b56f608b04":{"d":"Node pool r6i.4xlarge (3 × r6i.4xlarge) shows 1 node of AGGREGATE slack between summed pod requests (DaemonSet pods excluded) and allocatable capacity. This is an upper-bound ceiling, not a drainable count: it is requests-only and is NOT a safe basis for removing nodes — pods that request less than they use will OOM when packed onto fewer nodes, the autoscaler gates on the same requests, and the figure assumes free repacking it never verifies (it does not model PDBs, anti-affinity/topology-spread, or bin-packing fragmentation). Treat it as a candidate to INVESTIGATE with real utilisation (connect Prometheus), not a realisable saving — the dollar impact here is 0 until usage confirms the headroom.","r":[{"k":"Node","m":"ip-10-0-2-a"},{"k":"Node","m":"ip-10-0-2-b"},{"k":"Node","m":"ip-10-0-2-c"}],"c":"# DO NOT drain blindly. First confirm real usage \u003c requests for pool r6i.4xlarge (kubectl top nodes/pods, or Prometheus). Only then lower the node group's min/desired count and `kubectl drain`.","s":"one-click","pb":"unpriced","sk":"compute","k":["nodes","pods"]},"3a00f5538dd0":{"d":"StatefulSet monitoring/prometheus-k8s runs exactly one replica and no PodDisruptionBudget matches its pods. A Service routes to it on a serving port, so a node drain, autoscaler consolidation, or spot interruption drops user-reachable capacity until the pod reschedules. This is a StatefulSet: do NOT simply scale to 2 — verify the application supports \u003e1 replica (replication / quorum) first, or a second replica can corrupt data.","r":[{"k":"StatefulSet","n":"monitoring","m":"prometheus-k8s"}],"c":"# verify the app supports \u003e1 replica (replication/quorum) before scaling a StatefulSet\nkubectl -n monitoring scale statefulset/prometheus-k8s --replicas=2","s":"one-click","k":["daemonsets","deployments","poddisruptionbudgets","services","statefulsets"]},"3a88f9c0cd04":{"d":"Namespace monitoring runs 3 workloads and defines zero upstream (networking.k8s.io/v1) NetworkPolicy objects. This cluster runs Cilium, which may enforce segmentation through its own CRDs (e.g. CiliumNetworkPolicy / projectcalico.org policies) that shoalcheck does not yet read — so zero upstream objects does NOT prove the namespace is unsegmented. If it is genuinely flat, start with a default-deny-ingress policy, then add explicit allows for the flows that exist.","r":[{"k":"Namespace","m":"monitoring"}],"y":"# NOTE: this cluster runs Cilium. Verify the namespace is not already segmented via Cilium CRDs\n# before adding this upstream object; validate against your workload's real flows before applying.\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-ingress\n  namespace: monitoring\nspec:\n  podSelector: {}  # empty selector = every pod in the namespace\n  policyTypes:\n    - Ingress\n","k":["daemonsets","deployments","networkpolicies","server-resources","statefulsets"]},"3bd52b116bda":{"d":"If every node in zone eu-central-1a were unavailable, 2 pods running there would have no remaining node in this reading that satisfies the constraints this model checks. The model checks a subset of what the Kubernetes scheduler checks, which is why it can report that nothing satisfies it and cannot report the opposite: preemption could free room the model does not see, and an autoscaler could add nodes this reading does not contain.","r":[{"k":"Pod","n":"payments","m":"payments-ledger-db-0"},{"k":"Pod","n":"workers","m":"licensed-etl-0"}],"k":["nodes","persistentvolumeclaims","persistentvolumes","pods"]},"3c8cba621747":{"d":"ClusterRoleBinding acme-break-glass names Group system:masters as a subject and points at ClusterRole cluster-admin, cluster-wide. system:masters is authorized above RBAC: the API server grants its members every action on every resource without consulting any Role, so this binding is a signal that a break-glass path exists rather than the thing that grants the power. This is what the binding says; what any holder of that subject can actually do is the union over every binding that names it, and the absence of a binding is not the absence of the subject: a client certificate carrying O=system:masters, an OIDC claim or a provider IAM mapping makes its holder a member with no RBAC object anywhere.","r":[{"k":"ClusterRoleBinding","m":"acme-break-glass"}],"k":["clusterrolebindings","rolebindings"]},"409d1b10d7e2":{"d":"The metrics source reports up=0 for 2 of the 55 targets it is configured to scrape. A target that cannot be scraped produces no series, and a rule or dashboard built on those series shows a gap rather than an error.","us":"prometheus"},"4103b7675e51":{"d":"The pods of Deployment api/api-gateway report 2 distinct image digests for container \"api-gateway\", whose spec image is the single tag \"registry.acme.example/api-gateway:latest\". A tag is a moving pointer, so this is what a tag looks like after it moved and only some pods restarted: the manifest says one thing, and two different builds are running under it.","r":[{"k":"Pod","n":"api","m":"api-gateway-7f4b9c0-a"},{"k":"Pod","n":"api","m":"api-gateway-7f4b9c1-b"}],"k":["daemonsets","deployments","pods","statefulsets"]},"419497d16695":{"d":"Deployment monitoring/node-exporter ships containers without health probes: no liveness probe means a hung or deadlocked process is never restarted by the kubelet; no readiness probe is configured; readiness also gates Service traffic where applicable, but this workload exposes no ports and sits behind no Service we observed.","r":[{"k":"Deployment","n":"monitoring","m":"node-exporter"}],"y":"# TEMPLATE — do NOT apply blind. A liveness probe configured too aggressively\n# (no startupProbe, low failureThreshold, short timeout) will restart healthy-but-slow\n# pods and can cascade the whole Deployment into CrashLoopBackOff. Set the real\n# health path/port and tune the timings to your workload's warmup + GC behaviour first.\n#\n# startupProbe gates liveness until the app has finished starting; give slow-start\n# apps (JVM, large models, migrations) a generous startup budget.\nstartupProbe:\n  httpGet: { path: /healthz, port: http }   # \u003c-- set to your real health endpoint\n  periodSeconds: 10\n  failureThreshold: 30                       # ~5 min warmup budget; raise for slow starters\nlivenessProbe:\n  httpGet: { path: /healthz, port: http }   # \u003c-- set to your real health endpoint\n  periodSeconds: 15\n  timeoutSeconds: 5\n  failureThreshold: 3","k":["daemonsets","deployments","services","statefulsets"]},"44531237a3ea":{"d":"If node ip-10-0-2-a were unavailable, 1 pod running on it would have no remaining node in this reading that satisfies the constraints this model checks. This is a different question from whether a disruption budget would permit the eviction: a budget that allows a pod to leave does not produce anywhere for it to arrive. The model checks a subset of the scheduler's predicates, so it can report that nothing satisfies it and cannot report the opposite — preemption could free room it does not see, and an autoscaler could add nodes this reading does not contain.","r":[{"k":"Pod","n":"workers","m":"licensed-etl-0"}],"k":["nodes","persistentvolumeclaims","persistentvolumes","pods"]},"486e5cb98fc5":{"d":"Evacuating node ip-10-0-1-c requires evicting 1 pod covered by PodDisruptionBudget payments/payments-orchestrator-pdb. The budget's own published status decides whether the eviction API permits that. The budget's own remedy, where one is needed, is reported by rule k8s.reliability.pdb-blocks-drains.","r":[{"k":"Node","m":"ip-10-0-1-c"},{"k":"PodDisruptionBudget","n":"payments","m":"payments-orchestrator-pdb"}],"k":["nodes","poddisruptionbudgets","pods"]},"48801d2358ee":{"d":"Ingress api/acme-public sets spec.ingressClassName to \"traefik-v1\", and no IngressClass by that name exists in this reading. An IngressClass is what tells a controller the Ingress is addressed to it, so a name matching no class is a rule no controller has claimed. Whether anything is serving these hosts is not readable from here.","r":[{"k":"Ingress","n":"api","m":"acme-public"}],"k":["ingressclasses","ingresses"]},"48b08a5999b7":{"d":"Namespace api runs workloads but does not enforce a PodSecurity admission profile of baseline or restricted (enforce=\u003cunset\u003e). Without enforcement, the per-container PSS findings in this report describe the spec AS AUTHORED — nothing in the cluster actually blocks a privileged, root, or capability-laden pod from being admitted here. Apply the labels gradually: set warn and audit first to surface what would break, then set enforce. Enforcing restricted on a namespace that already runs noncompliant pods does NOT evict them, but it WILL block the next admission (a redeploy or rollout) — stage it. baseline is the safe first target (it blocks privileged, hostPath, hostNetwork, and host namespaces); however, the per-container findings in this report for this namespace (seccomp, drop-ALL capabilities, allowPrivilegeEscalation, runAsNonRoot) are Restricted-profile controls, so enforce=restricted is required to fully close them — baseline alone will not.","r":[{"k":"Namespace","m":"api"}],"c":"kubectl label --overwrite namespace api pod-security.kubernetes.io/warn=baseline pod-security.kubernetes.io/audit=baseline   # surface breakage first, then set enforce=baseline; use restricted (not baseline) on both warn/audit/enforce to close the per-container seccomp/capabilities/runAsNonRoot findings","s":"one-click","k":["daemonsets","deployments","namespaces","statefulsets"]},"4a5d593fb699":{"d":"Deployment workers/risk-batch-processor has 1 of 1 container without a read-only root filesystem. Note: PSS does NOT require this (it is a hardening extension, not part of the Baseline or Restricted profile), so this is a Low-severity defense-in-depth suggestion — set readOnlyRootFilesystem:true and mount writable paths as emptyDir/PVC volumes where the app genuinely needs to write. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"workers","m":"risk-batch-processor"}],"k":["daemonsets","deployments","statefulsets"]},"4e3bc6910d02":{"d":"Deployment api/auth-service ships containers without health probes: no liveness probe means a hung or deadlocked process is never restarted by the kubelet; no readiness probe is configured; readiness also gates Service traffic where applicable, but this workload exposes no ports and sits behind no Service we observed.","r":[{"k":"Deployment","n":"api","m":"auth-service"}],"y":"# TEMPLATE — do NOT apply blind. A liveness probe configured too aggressively\n# (no startupProbe, low failureThreshold, short timeout) will restart healthy-but-slow\n# pods and can cascade the whole Deployment into CrashLoopBackOff. Set the real\n# health path/port and tune the timings to your workload's warmup + GC behaviour first.\n#\n# startupProbe gates liveness until the app has finished starting; give slow-start\n# apps (JVM, large models, migrations) a generous startup budget.\nstartupProbe:\n  httpGet: { path: /healthz, port: http }   # \u003c-- set to your real health endpoint\n  periodSeconds: 10\n  failureThreshold: 30                       # ~5 min warmup budget; raise for slow starters\nlivenessProbe:\n  httpGet: { path: /healthz, port: http }   # \u003c-- set to your real health endpoint\n  periodSeconds: 15\n  timeoutSeconds: 5\n  failureThreshold: 3","k":["daemonsets","deployments","services","statefulsets"]},"4f927b28b036":{"d":"In namespace payments, 3 pods are selected by more than one PodDisruptionBudget (acme-platform-baseline, payments-orchestrator-pdb). The eviction API does not combine overlapping budgets — it refuses the eviction and returns an error naming the conflict.","r":[{"k":"PodDisruptionBudget","n":"payments","m":"acme-platform-baseline"},{"k":"PodDisruptionBudget","n":"payments","m":"payments-orchestrator-pdb"},{"k":"Pod","n":"payments","m":"payments-orchestrator-7f4b9c0-a"},{"k":"Pod","n":"payments","m":"payments-orchestrator-7f4b9c1-b"},{"k":"Pod","n":"payments","m":"payments-orchestrator-7f4b9c2-c"}],"k":["poddisruptionbudgets","pods"]},"5004381bb1d3":{"d":"Deployment default/legacy-cron-runner has 1 of 1 container without a read-only root filesystem. Note: PSS does NOT require this (it is a hardening extension, not part of the Baseline or Restricted profile), so this is a Low-severity defense-in-depth suggestion — set readOnlyRootFilesystem:true and mount writable paths as emptyDir/PVC volumes where the app genuinely needs to write. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"default","m":"legacy-cron-runner"}],"k":["daemonsets","deployments","statefulsets"]},"507584056829":{"d":"Deployment api/auth-service sets no dedicated ServiceAccount and mounts the default SA's API token into every container. No RoleBinding or ClusterRoleBinding observed in this cluster references this namespace's default SA, so the token grants only baseline authenticated/discovery access today — but any future RoleBinding silently widens this exposure to every pod already on the default SA. If this workload does need API access, give it a dedicated ServiceAccount with a scoped Role instead. Exception: if this pod uses the projected token for cloud IAM (EKS IRSA / Pod Identity, GKE Workload Identity), disabling automount will break that — give it a dedicated SA configured for the integration instead of turning the token off.","r":[{"k":"Deployment","n":"api","m":"auth-service"}],"y":"# Validate before applying: if this pod relies on a projected token for\n# cloud IAM (EKS IRSA / Pod Identity, GKE Workload Identity) or actually\n# calls the Kubernetes API, do NOT disable automount — give it a dedicated\n# ServiceAccount configured for that integration instead.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: auth-service\n  namespace: api\nspec:\n  template:\n    spec:\n      automountServiceAccountToken: false\n","k":["clusterrolebindings","daemonsets","deployments","rolebindings","serviceaccounts","statefulsets"]},"539cf71c68b7":{"d":"Evacuating node ip-10-0-1-b requires evicting 1 pod covered by PodDisruptionBudget payments/payments-orchestrator-pdb. The budget's own published status decides whether the eviction API permits that. The budget's own remedy, where one is needed, is reported by rule k8s.reliability.pdb-blocks-drains.","r":[{"k":"Node","m":"ip-10-0-1-b"},{"k":"PodDisruptionBudget","n":"payments","m":"payments-orchestrator-pdb"}],"k":["nodes","poddisruptionbudgets","pods"]},"54462bd924c3":{"d":"Deployment workers/risk-batch-processor has 1 of 1 container where allowPrivilegeEscalation is unset (it defaults to true) or explicitly true. Set allowPrivilegeEscalation:false on each container's securityContext — required by the PSS-Restricted profile. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profi 1 of 1 container whose effective seccompProfile is unset or Unconfined (computed pod then container). Set seccompProfile.type:RuntimeDefault at the pod level so every container inherits syscall filtering — required by PSS-Restricted (CIS 5.7.2 maps to 5.2.1 in this benchmark version). This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"api","m":"auth-service"}],"k":["daemonsets","deployments","statefulsets"]},"5ca79ff7752f":{"d":"1 pod of Deployment default/legacy-cron-runner report a Ready condition of False in this reading, taken at 2026-09-15T05:28:50Z. The kubelet published: no reason published by the kubelet. This is what it is saying now — how long it has been saying it is a separate question and a separate finding.","r":[{"k":"Pod","n":"default","m":"legacy-cron-runner-7f4b9c0-a"}],"k":["daemonsets","deployments","pods","statefulsets"]},"6033acc002d3":{"d":"ClusterRoleBinding acme-deployer-cluster-admin binds the cluster-admin ClusterRole (cluster-wide) to 1 ServiceAccount. Every pod running under such an account carries a token with unrestricted API access. The grant itself is a fact; whether it is justified depends on what the workload actually does.","r":[{"k":"ClusterRoleBinding","m":"acme-deployer-cluster-admin"},{"k":"ServiceAccount","n":"workers","m":"cicd-deployer"}],"y":"# Least-privilege replacement for a cluster-admin grant.\n# DO NOT delete the original ClusterRoleBinding until this scoped role is confirmed to cover\n# the ServiceAccount's OBSERVED usage — removing it first will break the\n# workload. Fill the rules below from what cicd-deployer actually does (audit logs / what\n# it watches), then cut over and remove the cluster-admin binding.\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: cicd-deployer-scoped\nrules:\n  # fill with the verbs this SA actually uses (placeholder below)\n  - apiGroups: [\"\"]\n    resources: [\"pods\"]\n    verbs: [\"get\", \"list\"]\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRoleBinding\nmetadata:\n  name: cicd-deployer-scoped\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: ClusterRole\n  name: cicd-deployer-scoped\nsubjects:\n  - kind: ServiceAccount\n    name: cicd-deployer\n    namespace: workers\n","k":["clusterrolebindings","rolebindings"]},"62cc16fb0b88":{"d":"Deployment monitoring/node-exporter does not enforce non-root execution at the API in 1 of 1 container: runAsNonRoot is unset and no non-zero runAsUser is set. The container image's USER directive is invisible to a read-only API client, so an unset spec is reported as UNCONFIRMED non-root, never \"runs as root\" — and rated Medium, like the other PSS fields a spec can leave unset. It is rated High only when root is confirmed or near-certain: an explicit runAsUser:0 / runAsNonRoot:false, or a known root-by-default base image with no non-root assertion (each called out per container in the evidence). Set runAsNonRoot:true (and a non-zero runAsUser) on the pod or container securityContext to make non-root intent explicit and admission-enforceable. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"monitoring","m":"node-exporter"}],"k":["daemonsets","deployments","statefulsets"]},"65e23c8822dd":{"d":"Deployment payments/payments-orchestrator reserves CPU/memory above what its 7d usage ever needed, across 3 replicas. CPU is sized to the busiest replica's p95 plus 30% headroom; memory to the larger of p95×1.3 and the observed 7d max. The memory recommendation is floored at the observed 7d max so a bursty or GC-heavy workload is not down-sized below a working set it provably reaches. This reclaims reserved capacity the workload's 7d p95 never used — but the 95th percentile excludes tail bursts, so verify against the container's 7d max and your latency SLOs before applying: CPU below request is throttled, memory below peak is OOMKilled.","r":[{"k":"Deployment","n":"payments","m":"payments-orchestrator"}],"y":"apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: payments-orchestrator\n  namespace: payments\nspec:\n  template:\n    spec:\n      containers:\n        - name: payments-orchestrator\n          resources:\n            requests:\n              cpu: 420m      # 7d p95 ×1.3, right-sized\n              memory: 1248Mi  # 7d p95 ×1.3, right-sized\n","pb":"priced","sk":"compute","k":["daemonsets","deployments","nodes","pods","statefulsets"],"us":"prometheus"},"6a299ed4fbf0":{"d":"Deployment default/legacy-cron-runner sets no dedicated ServiceAccount and mounts the default SA's API token into every container. No RoleBinding or ClusterRoleBinding observed in this cluster references this namespace's default SA, so the token grants only baseline authenticated/discovery access today — but any future RoleBinding silently widens this exposure to every pod already on the default SA. If this workload does need API access, give it a dedicated ServiceAccount with a scoped Role instead. Exception: if this pod uses the projected token for cloud IAM (EKS IRSA / Pod Identity, GKE Workload Identity), disabling automount will break that — give it a dedicated SA configured for the integration instead of turning the token off.","r":[{"k":"Deployment","n":"default","m":"legacy-cron-runner"}],"y":"# Validate before applying: if this pod relies on a projected token for\n# cloud IAM (EKS IRSA / Pod Identity, GKE Workload Identity) or actually\n# calls the Kubernetes API, do NOT disable automount — give it a dedicated\n# ServiceAccount configured for that integration instead.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: legacy-cron-runner\n  namespace: default\nspec:\n  template:\n    spec:\n      automountServiceAccountToken: false\n","k":["clusterrolebindings","daemonsets","deployments","rolebindings","serviceaccounts","statefulsets"]},"6cd65827cd51":{"d":"Deployment workers/risk-batch-processor runs 4 replicas but declares no podAntiAffinity and no topologySpreadConstraints. The scheduler may co-locate replicas on one node, so one node failure or drain could take several down together. Observed 12 schedulable nodes across 3 zones.","r":[{"k":"Deployment","n":"workers","m":"risk-batch-processor"}],"y":"# Validate against your workload before applying: with whenUnsatisfiable: ScheduleAnyway this is\n# soft (won't block scheduling); spread is bounded by the number of schedulable nodes/zones.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: risk-batch-processor\n  namespace: workers\nspec:\n  template:\n    spec:\n      topologySpreadConstraints:\n        - maxSkew: 1\n          topologyKey: kubernetes.io/hostname\n          whenUnsatisfiable: ScheduleAnyway\n          labelSelector:\n            matchLabels:\n              app: risk-batch-processor\n","k":["daemonsets","deployments","nodes","poddisruptionbudgets","statefulsets"]},"6cf812a096d9":{"d":"Deployment api/auth-service runs 2 replicas but declares no podAntiAffinity and no topologySpreadConstraints. The scheduler may co-locate replicas on one node, so one node failure or drain could take several down together. Observed 12 schedulable nodes across 3 zones.","r":[{"k":"Deployment","n":"api","m":"auth-service"}],"y":"# Validate against your workload before applying: with whenUnsatisfiable: ScheduleAnyway this is\n# soft (won't block scheduling); spread is bounded by the number of schedulable nodes/zones.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: auth-service\n  namespace: api\nspec:\n  template:\n    spec:\n      topologySpreadConstraints:\n        - maxSkew: 1\n          topologyKey: kubernetes.io/hostname\n          whenUnsatisfiable: ScheduleAnyway\n          labelSelector:\n            matchLabels:\n              app: auth-service\n","k":["daemonsets","deployments","nodes","poddisruptionbudgets","statefulsets"]},"71076a148653":{"d":"PersistentVolumeClaim payments/data-payments-ledger-db-0 is Bound with status.capacity = 50Gi while spec.resources.requests.storage asks for 100Gi. A bound claim's capacity is written by its controller, so the two values are a request the storage layer has not matched — most often an expansion that was accepted and did not finish, and sometimes a StorageClass with allowVolumeExpansion unset.","r":[{"k":"PersistentVolumeClaim","n":"payments","m":"data-payments-ledger-db-0"}],"k":["persistentvolumeclaims"]},"719907e2e77b":{"d":"ClusterRoleBinding acme-everyone-can-read names Group system:authenticated as a subject and points at ClusterRole acme-secret-sync, cluster-wide. system:authenticated is every identity the authenticator accepts, which includes every ServiceAccount in every namespace. This is what the binding says; what any holder of that subject can actually do is the union over every binding that names it, and the absence of a binding is not the absence of the subject: every identity the authenticator accepts belongs to this group, and which identities those are is decided outside the cluster.","r":[{"k":"ClusterRoleBinding","m":"acme-everyone-can-read"}],"k":["clusterrolebindings","rolebindings"]},"71eeda6f8736":{"d":"The m6i.xlarge pool (9 nodes) is billed at on-demand list. AWS publishes a Compute Savings Plan rate for this type in this region; the evidence states what the pool would cost under it and the two conditions under which that figure is real. Nothing is counted toward the headline.","r":[{"k":"Node","m":"ip-10-0-1-a"},{"k":"Node","m":"ip-10-0-1-b"},{"k":"Node","m":"ip-10-0-1-c"},{"k":"Node","m":"ip-10-0-1-d"},{"k":"Node","m":"ip-10-0-1-e"},{"k":"Node","m":"ip-10-0-1-f"},{"k":"Node","m":"ip-10-0-1-g"},{"k":"Node","m":"ip-10-0-1-h"}],"pb":"unpriced","sk":"compute","k":["nodes"]},"723b76447261":{"d":"Deployment default/legacy-cron-runner ships containers without health probes: no liveness probe means a hung or deadlocked process is never restarted by the kubelet; no readiness probe is configured; readiness also gates Service traffic where applicable, but this workload exposes no ports and sits behind no Service we observed.","r":[{"k":"Deployment","n":"default","m":"legacy-cron-runner"}],"y":"# TEMPLATE — do NOT apply blind. A liveness probe configured too aggressively\n# (no startupProbe, low failureThreshold, short timeout) will restart healthy-but-slow\n# pods and can cascade the whole Deployment into CrashLoopBackOff. Set the real\n# health path/port and tune the timings to your workload's warmup + GC behaviour first.\n#\n# startupProbe gates liveness until the app has finished starting; give slow-start\n# apps (JVM, large models, migrations) a generous startup budget.\nstartupProbe:\n  httpGet: { path: /healthz, port: http }   # \u003c-- set to your real health endpoint\n  periodSeconds: 10\n  failureThreshold: 30                       # ~5 min warmup budget; raise for slow starters\nlivenessProbe:\n  httpGet: { path: /healthz, port: http }   # \u003c-- set to your real health endpoint\n  periodSeconds: 15\n  timeoutSeconds: 5\n  failureThreshold: 3","k":["daemonsets","deployments","services","statefulsets"]},"72b028e08d42":{"d":"Deployment default/legacy-cron-runner runs exactly one replica and no PodDisruptionBudget matches its pods. No Service in the namespace selects its pods on a serving port, so loss of the pod is not directly user-facing — but any node drain or interruption still takes the single replica down until it reschedules.","r":[{"k":"Deployment","n":"default","m":"legacy-cron-runner"}],"c":"kubectl -n default scale deployment/legacy-cron-runner --replicas=2\n# only AFTER \u003e=2 replicas, add a PodDisruptionBudget (e.g. maxUnavailable: 1); a minAvailable equal to the replica count deadlocks every node drain","s":"one-click","k":["daemonsets","deployments","poddisruptionbudgets","services","statefulsets"]},"770d026ea370":{"d":"Node pool m6i.xlarge (9 × m6i.xlarge) shows 2 nodes of AGGREGATE slack between summed pod requests (DaemonSet pods excluded) and allocatable capacity. This is an upper-bound ceiling, not a drainable count: it is requests-only and is NOT a safe basis for removing nodes — pods that request less than they use will OOM when packed onto fewer nodes, the autoscaler gates on the same requests, and the figure assumes free repacking it never verifies (it does not model PDBs, anti-affinity/topology-spread, or bin-packing fragmentation). Treat it as a candidate to INVESTIGATE with real utilisation (connect Prometheus), not a realisable saving — the dollar impact here is 0 until usage confirms the headroom.","r":[{"k":"Node","m":"ip-10-0-1-a"},{"k":"Node","m":"ip-10-0-1-b"},{"k":"Node","m":"ip-10-0-1-c"},{"k":"Node","m":"ip-10-0-1-d"},{"k":"Node","m":"ip-10-0-1-e"},{"k":"Node","m":"ip-10-0-1-f"},{"k":"Node","m":"ip-10-0-1-g"},{"k":"Node","m":"ip-10-0-1-h"},{"k":"Node","m":"ip-10-0-1-i"}],"c":"# DO NOT drain blindly. First confirm real usage \u003c requests for pool m6i.xlarge (kubectl top nodes/pods, or Prometheus). Only then lower the node group's min/desired count and `kubectl drain`.","s":"one-click","pb":"unpriced","sk":"compute","k":["nodes","pods"]},"787835dc1449":{"d":"Deployment monitoring/node-exporter has 1 of 1 container that do not drop ALL capabilities, so each keeps the default Linux capability set (NET_RAW included). The PSS-Restricted profile requires capabilities.drop:[ALL]; add back only NET_BIND_SERVICE if the container binds a privileged port. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"monitoring","m":"node-exporter"}],"k":["daemonsets","deployments","statefulsets"]},"797eeb071701":{"d":"1 pod in namespace workers carry no controller ownerReference. Nothing recreates a pod like this: if its node is drained, fails or is replaced, the pod is gone and no Deployment, StatefulSet, DaemonSet or Job notices.","r":[{"k":"Pod","n":"workers","m":"debug-shell-ondemand"}],"k":["pods"]},"79d3c2f7e473":{"d":"2 finished Jobs in namespace workers set no ttlSecondsAfterFinished and are owned by no CronJob. Nothing deletes them: a finished Job and its pods stay in etcd until somebody removes them by hand, and each keeps a pod object with it.","r":[{"k":"Job","n":"workers","m":"acme-backfill-0114"},{"k":"Job","n":"workers","m":"acme-schema-migrate-0117"}],"k":["jobs"]},"7abfd8902b1e":{"d":"This cluster's own monitoring reports 1 distinct alerting rule in a firing state, across 1 series. These are the operators' own declared thresholds, read from their Prometheus rather than judged by this reading.","us":"prometheus"},"7b3aeab57996":{"d":"Deployment payments/payments-gateway takes 1 value from 1 Secret (payments-db-credentials) as environment variables. The pod template names the Secret; no Secret was read and no value was seen.","r":[{"k":"Deployment","n":"payments","m":"payments-gateway"}],"k":["daemonsets","deployments","statefulsets"]},"7cb250877d80":{"d":"Namespace workers runs 4 workloads and defines zero upstream (networking.k8s.io/v1) NetworkPolicy objects. This cluster runs Cilium, which may enforce segmentation through its own CRDs (e.g. CiliumNetworkPolicy / projectcalico.org policies) that shoalcheck does not yet read — so zero upstream objects does NOT prove the namespace is unsegmented. If it is genuinely flat, start with a default-deny-ingress policy, then add explicit allows for the flows that exist.","r":[{"k":"Namespace","m":"workers"}],"y":"# NOTE: this cluster runs Cilium. Verify the namespace is not already segmented via Cilium CRDs\n# before adding this upstream object; validate against your workload's real flows before applying.\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-ingress\n  namespace: workers\nspec:\n  podSelector: {}  # empty selector = every pod in the namespace\n  policyTypes:\n    - Ingress\n","k":["daemonsets","deployments","networkpolicies","server-resources","statefulsets"]},"7cc03878e386":{"d":"Deployment workers/risk-batch-processor has 1 of 1 container that do not drop ALL capabilities, so each keeps the default Linux capability set (NET_RAW included). The PSS-Restricted profile requires capabilities.drop:[ALL]; add back only NET_BIND_SERVICE if the container binds a privileged port. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"workers","m":"risk-batch-processor"}],"k":["daemonsets","deployments","statefulsets"]},"80bdb1b2f68e":{"d":"Deployment workers/risk-batch-processor has 1 of 1 container whose effective seccompProfile is unset or Unconfined (computed pod then container). Set seccompProfile.type:RuntimeDefault at the pod level so every container inherits syscall filtering — required by PSS-Restricted (CIS 5.7.2 maps to 5.2.1 in this benchmark version). This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"workers","m":"risk-batch-processor"}],"k":["daemonsets","deployments","statefulsets"]},"8380b8f3ff8b":{"d":"CronJob workers/acme-nightly-reconcile leaves spec.startingDeadlineSeconds unset. The controller then has no bound on how late a missed run may start: after an outage it counts every schedule it missed, and past a hundred it stops scheduling the CronJob entirely until the next window. With the deadline set, runs older than it are skipped and the count never accumulates.","r":[{"k":"CronJob","n":"workers","m":"acme-nightly-reconcile"}],"k":["cronjobs"]},"84f33e0e702b":{"d":"Deployment api/api-gateway reserves CPU/memory above what its 7d usage ever needed, across 2 replicas. CPU is sized to the busiest replica's p95 plus 30% headroom; memory to the larger of p95×1.3 and the observed 7d max. The memory recommendation is floored at the observed 7d max so a bursty or GC-heavy workload is not down-sized below a working set it provably reaches. This reclaims reserved capacity the workload's 7d p95 never used — but the 95th percentile excludes tail bursts, so verify against the container's 7d max and your latency SLOs before applying: CPU below request is throttled, memory below peak is OOMKilled.","r":[{"k":"Deployment","n":"api","m":"api-gateway"}],"y":"apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: api-gateway\n  namespace: api\nspec:\n  template:\n    spec:\n      containers:\n        - name: api-gateway\n          resources:\n            requests:\n              cpu: 210m      # 7d p95 ×1.3, right-sized\n              memory: 624Mi  # 7d p95 ×1.3, right-sized\n","pb":"priced","sk":"compute","k":["daemonsets","deployments","nodes","pods","statefulsets"],"us":"prometheus"},"850875e6f8e6":{"d":"Service payments/legacy-payments-lb is type=LoadBalancer but its selector matches no pods (any phase) and its EndpointSlices published no endpoint entries, so a provisioned cloud load balancer would be billed with nothing behind it. This is read from a point-in-time snapshot, so verify it's truly unused — not mid-rollout — before deleting the Service to release the LB.","r":[{"k":"Service","n":"payments","m":"legacy-payments-lb"}],"c":"# verify unused, then: kubectl -n payments delete service legacy-payments-lb","s":"one-click","pb":"priced","sk":"network","k":["endpointslices","nodes","pods","services"]},"883b67775cc6":{"d":"Deployment api/api-gateway declares spread across 1 topology key that no node in this reading is labelled with: kubernetes.io/hostname. The operator declared it as a hard requirement (requiredDuringSchedulingIgnoredDuringExecution), so the cluster is being asked to place pods across a domain it does not label. Both halves are read verbatim — the key from the workload, the label set from the nodes.","r":[{"k":"Deployment","n":"api","m":"api-gateway"}],"k":["deployments","nodes","statefulsets"]},"8a4946523606":{"d":"Every EndpointSlice listed for Service payments/legacy-checkout-lb publishes zero entries with conditions.ready=true. An entry records that a controller published an address as a backend of this Service, so this is a count of what was published and says nothing about what any request did. Whether the count is expected depends on what this Service is for, which the snapshot does not record: a batch endpoint nobody calls, the idle half of a blue/green pair, and a Service whose consumers were retired all read exactly the same way.","r":[{"k":"Service","n":"payments","m":"legacy-checkout-lb"}],"k":["endpointslices","services"]},"8a9c190a59a5":{"d":"A node-image upgrade replaces nodes one at a time, and each replacement needs the node drained first. A drain stops on 5 of this cluster's 12 nodes — a budget that allows no eviction, a pod nothing recreates, a volume pinned to the node, or work this reading finds no remaining node for. Each is already reported on its own; this states what they mean together, which is that the roll does not complete without forcing one of them.","r":[{"k":"Node","m":"ip-10-0-1-a"},{"k":"Node","m":"ip-10-0-1-b"},{"k":"Node","m":"ip-10-0-1-c"},{"k":"Node","m":"ip-10-0-1-d"},{"k":"Node","m":"ip-10-0-2-a"}],"k":["nodes","persistentvolumeclaims","persistentvolumes","poddisruptionbudgets","pods"]},"8b41daa3737b":{"d":"Deployment workers/webhook-dispatcher runs 6 replicas but declares no podAntiAffinity and no topologySpreadConstraints. The scheduler may co-locate replicas on one node, so one node failure or drain could take several down together. Observed 12 schedulable nodes across 3 zones.","r":[{"k":"Deployment","n":"workers","m":"webhook-dispatcher"}],"y":"# Validate against your workload before applying: with whenUnsatisfiable: ScheduleAnyway this is\n# soft (won't block scheduling); spread is bounded by the number of schedulable nodes/zones.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: webhook-dispatcher\n  namespace: workers\nspec:\n  template:\n    spec:\n      topologySpreadConstraints:\n        - maxSkew: 1\n          topologyKey: kubernetes.io/hostname\n          whenUnsatisfiable: ScheduleAnyway\n          labelSelector:\n            matchLabels:\n              app: webhook-dispatcher\n","k":["daemonsets","deployments","nodes","poddisruptionbudgets","statefulsets"]},"8bc1b4db3ed8":{"d":"Deployment api/api-gateway has 1 of 1 container where allowPrivilegeEscalation is unset (it defaults to true) or explicitly true. Set allowPrivilegeEscalation:false on each container's securityContext — required by the PSS-Restricted profile. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"api","m":"api-gateway"}],"k":["daemonsets","deployments","statefulsets"]},"8bcd0694256d":{"d":"Deployment monitoring/node-exporter runs 3 replicas but declares no podAntiAffinity and no topologySpreadConstraints. The scheduler may co-locate replicas on one node, so one node failure or drain could take several down together. Observed 12 schedulable nodes across 3 zones.","r":[{"k":"Deployment","n":"monitoring","m":"node-exporter"}],"y":"# Validate against your workload before applying: with whenUnsatisfiable: ScheduleAnyway this is\n# soft (won't block scheduling); spread is bounded by the number of schedulable nodes/zones.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: node-exporter\n  namespace: monitoring\nspec:\n  template:\n    spec:\n      topologySpreadConstraints:\n        - maxSkew: 1\n          topologyKey: kubernetes.io/hostname\n          whenUnsatisfiable: ScheduleAnyway\n          labelSelector:\n            matchLabels:\n              app: node-exporter\n","k":["daemonsets","deployments","nodes","poddisruptionbudgets","statefulsets"]},"8c3a3bb8cf4a":{"d":"The 12 nodes whose kubelet version this reading could parse report 2 distinct minor versions — 1.29, 1.31. This is read from Node.status.nodeInfo, which is what each kubelet published about itself; it says nothing about how those nodes are configured, which is not readable without reaching the node.","r":[{"k":"Node","m":"ip-10-0-2-c"},{"k":"Node","m":"ip-10-0-1-a"},{"k":"Node","m":"ip-10-0-1-b"},{"k":"Node","m":"ip-10-0-1-c"},{"k":"Node","m":"ip-10-0-1-d"},{"k":"Node","m":"ip-10-0-1-e"},{"k":"Node","m":"ip-10-0-1-f"},{"k":"Node","m":"ip-10-0-1-g"},{"k":"Node","m":"ip-10-0-1-h"},{"k":"Node","m":"ip-10-0-1-i"},{"k":"Node","m":"ip-10-0-2-a"},{"k":"Node","m":"ip-10-0-2-b"}],"k":["nodes"]},"8c3c1843022e":{"d":"StatefulSet payments/payments-ledger-db sets spec.serviceName to \"payments-ledger-db-headless\", and no Service by that name exists in namespace payments in this reading. The governing Service is what gives a StatefulSet's pods their stable per-pod DNS names; without the object, r":[{"k":"Deployment","n":"default","m":"legacy-cron-runner"}],"k":["daemonsets","deployments","statefulsets"]},"95001738e438":{"d":"Role acme-api-operator contains a rule permitting every verb on every resource, and 1 binding name subjects that activate it. The grant reaches within one namespace.","r":[{"k":"Role","n":"api","m":"acme-api-operator"},{"k":"RoleBinding","n":"api","m":"acme-api-operator"}],"k":["clusterrolebindings","clusterroles","rolebindings","roles"]},"9501d56c54d5":{"d":"The m6i.xlarge pool (9 nodes) is priced above at least one instance type of identical vCPU and memory in the same family line. The comparison is between two list prices for the same shape; nothing about the workloads on these nodes is assumed beyond what the tiers below state.","r":[{"k":"Node","m":"ip-10-0-1-a"},{"k":"Node","m":"ip-10-0-1-b"},{"k":"Node","m":"ip-10-0-1-c"},{"k":"Node","m":"ip-10-0-1-d"},{"k":"Node","m":"ip-10-0-1-e"},{"k":"Node","m":"ip-10-0-1-f"},{"k":"Node","m":"ip-10-0-1-g"},{"k":"Node","m":"ip-10-0-1-h"},{"k":"Node","m":"ip-10-0-1-i"}],"pb":"priced","sk":"compute","k":["nodes"]},"989158c7acd8":{"d":"Deployment default/legacy-cron-runner runs in the default namespace (CIS 5.7.4). This check flags WORKLOADS in the default namespace; standalone Services/Pods are not evaluated by this check. kubectl cannot move a resource between namespaces in place — recreate it in a dedicated, named namespace (e.g. `kubectl create namespace \u003cname\u003e`, then re-apply the manifest with `metadata.namespace: \u003cname\u003e` and delete the original) so it inherits that namespace's PodSecurity admission, NetworkPolicies, and quotas. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"default","m":"legacy-cron-runner"}],"k":["daemonsets","deployments","statefulsets"]},"990a9d899da0":{"d":"Deployment workers/ledger-reconciler sets no dedicated ServiceAccount and mounts the default SA's API token into every container. No RoleBinding or ClusterRoleBinding observed in this cluster references this namespace's default SA, so the token grants only baseline authenticated/discovery access today — but any future RoleBinding silently widens this exposure to every pod already on the default SA. If this workload does need API access, give it a dedicated ServiceAccount with a scoped Role instead. Exception: if this pod uses the projected token for cloud IAM (EKS IRSA / Pod Identity, GKE Workload Identity), disabling automount will break that — give it a dedicated SA configured for the integration instead of turning the token off.","r":[{"k":"Deployment","n":"workers","m":"ledger-reconciler"}],"y":"# Validate before applying: if this pod relies on a projected token for\n# cloud IAM (EKS IRSA / Pod Identity, GKE Workload Identity) or actually\n# calls the Kubernetes API, do NOT disable automount — give it a dedicated\n# ServiceAccount configured for that integration instead.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ledger-reconciler\n  namespace: workers\nspec:\n  template:\n    spec:\n      automountServiceAccountToken: false\n","k":["clusterrolebindings","daemonsets","deployments","rolebindings","serviceaccounts","statefulsets"]},"a134d5855b6d":{"d":"Deployment api/search-indexer declares spread across 1 topology key that no node in this reading is labelled with: kubernetes.io/hostname. The operator declared it as a hard requirement (requiredDuringSchedulingIgnoredDuringExecution), so the cluster is being asked to place pods across a domain it does not label. Both halves are read verbatim — the key from the workload, the label set from the nodes.","r":[{"k":"Deployment","n":"api","m":"search-indexer"}],"k":["deployments","nodes","statefulsets"]},"a23774f3cbc0":{"d":"ClusterRoleBinding acme-legacy-reporting has roleRef ClusterRole acme-reporting-reader, and no such object exists in this reading. A binding whose role is absent is a permission grant with nothing on the other end of it — and because the binding object itself is valid, nothing in the cluster reports the pairing.","r":[{"k":"ClusterRoleBinding","m":"acme-legacy-reporting"}],"k":["clusterrolebindings","clusterroles","rolebindings","roles"]},"a4c78812a9e5":{"d":"Deployment api/api-gateway has 1 of 1 container without a read-only root filesystem. Note: PSS does NOT require this (it is a hardening extension, not part of the Baseline or Restricted profile), so this is a Low-severity defense-in-depth suggestion — set readOnlyRootFilesystem:true and mount writable paths as emptyDir/PVC volumes where the app genuinely needs to write. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"api","m":"api-gateway"}],"k":["daemonsets","deployments","statefulsets"]},"a85f78cb6063":{"d":"A container in Deployment api/auth-service declares the same environment variable name more than once. Kubernetes accepts this and the last one wins, so the earlier value is silently discarded — the manifest reads as though both were set.","r":[{"k":"Deployment","n":"api","m":"auth-service"}],"k":["daemonsets","deployments","statefulsets"]},"a8efe8be5bea":{"d":"ClusterRole acme-secret-sync contains a rule permitting reading Secrets, and 3 bindings name subjects that activate it. The grant reaches cluster-wide.","r":[{"k":"ClusterRole","m":"acme-secret-sync"},{"k":"ClusterRoleBinding","m":"acme-everyone-can-read"},{"k":"ClusterRoleBinding","m":"acme-secret-sync"},{"k":"RoleBinding","n":"workers","m":"acme-legacy-migrator"}],"k":["clusterrolebindings","clusterroles","rolebindings","roles"],"sc":["acme-pay-oauth-client","acme-pay-stripe-key"]},"aa536944aca2":{"d":"HorizontalPodAutoscaler api/auth-service-v1 has scaleTargetRef Deployment auth-service-v1, and no Deployment by that name exists in namespace api in this reading. The autoscaler object is valid and will keep reporting its own status; what is missing is the thing it points at.","r":[{"k":"HorizontalPodAutoscaler","n":"api","m":"auth-service-v1"}],"k":["deployments","horizontalpodautoscalers","statefulsets"]},"ab2cff4cba76":{"d":"Deployment api/api-gateway does not enforce non-root execution at the API in 1 of 1 container: runAsNonRoot is unset and no non-zero runAsUser is set. The container image's USER directive is invisible to a read-only API client, so an unset spec is reported as UNCONFIRMED non-root, never \"runs as root\" — and rated Medium, like the other PSS fields a spec can leave unset. It is rated High only when root is confirmed or near-certain: an explicit runAsUser:0 / runAsNonRoot:false, or a known root-by-default base image with no non-root assertion (each called out per container in the evidence). Set runAsNonRoot:true (and a non-zero runAsUser) on the pod or container securityContext to make non-root intent explicit and admission-enforceable. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"api","m":"api-gateway"}],"k":["daemonsets","deployments","statefulsets"]},"abf66312763e":{"d":"The DaemonSet controller wrote status.numberMisscheduled = 2 for monitoring/acme-log-agent, which is its own count of pods it is running on nodes that no longer match the DaemonSet's node selector, affinity or tolerations. The controller does not remove these on its own in every case, and this reading does not say which nodes they are on.","r":[{"k":"DaemonSet","n":"monitoring","m":"acme-log-agent"}],"k":["daemonsets"]},"ac220240ba62":{"d":"The pod template of Deployment workers/risk-batch-processor sets serviceAccountName to \"risk-batch-runner\", and no ServiceAccount by that name exists in namespace workers in this reading. What happens next depends on when each pod was created: a pod already running holds a token it was issued earlier, and this reading cannot tell those apart from a pod that has yet to be admitted.","r":[{"k":"Deployment","n":"workers","m":"risk-batch-processor"}],"k":["daemonsets","deployments","serviceaccounts","statefulsets"]},"aef94b13aab4":{"d":"Deployment payments/payments-gateway reserves CPU/memory above what its 7d usage ever needed, across 1 replica. CPU is sized to the busiest replica's p95 plus 30% headroom; memory to the larger of p95×1.3 and the observed 7d max. The memory recommendation is floored at the observed 7d max so a bursty or GC-heavy workload is not down-sized below a working set it provably reaches. This reclaims reserved capacity the workload's 7d p95 never used — but the 95th percentile excludes tail bursts, so verify against the container's 7d max and your latency SLOs before applying: CPU below request is throttled, memory below peak is OOMKilled.","r":[{"k":"Deployment","n":"payments","m":"payments-gateway"}],"y":"apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: payments-gateway\n  namespace: payments\nspec:\n  template:\n    spec:\n      containers:\n        - name: payments-gateway\n          resources:\n            requests:\n              cpu: 210m      # 7d p95 ×1.3, right-sized\n              memory: 624Mi  # 7d p95 ×1.3, right-sized\n","pb":"priced","sk":"compute","k":["daemonsets","deployments","nodes","pods","statefulsets"],"us":"prometheus"},"afab58f65d7e":{"d":"PodDisruptionBudget payments/payments-orchestrator-pdb declares spec.min kload's 7d p95 never used — but the 95th percentile excludes tail bursts, so verify against the container's 7d max and your latency SLOs before applying: CPU below request is throttled, memory below peak is OOMKilled.","r":[{"k":"Deployment","n":"workers","m":"webhook-dispatcher"}],"y":"apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: webhook-dispatcher\n  namespace: workers\nspec:\n  template:\n    spec:\n      containers:\n        - name: webhook-dispatcher\n          resources:\n            requests:\n              cpu: 840m      # 7d p95 ×1.3, right-sized\n              memory: 4992Mi  # 7d p95 ×1.3, right-sized\n","pb":"priced","sk":"compute","k":["daemonsets","deployments","nodes","pods","statefulsets"],"us":"prometheus"},"b7a81b6c303a":{"d":"Deployment monitoring/node-exporter sets no dedicated ServiceAccount and mounts the default SA's API token into every container. No RoleBinding or ClusterRoleBinding observed in this cluster references this namespace's default SA, so the token grants only baseline authenticated/discovery access today — but any future RoleBinding silently widens this exposure to every pod already on the default SA. If this workload does need API access, give it a dedicated ServiceAccount with a scoped Role instead. Exception: if this pod uses the projected token for cloud IAM (EKS IRSA / Pod Identity, GKE Workload Identity), disabling automount will break that — give it a dedicated SA configured for the integration instead of turning the token off.","r":[{"k":"Deployment","n":"monitoring","m":"node-exporter"}],"y":"# Validate before applying: if this pod relies on a projected token for\n# cloud IAM (EKS IRSA / Pod Identity, GKE Workload Identity) or actually\n# calls the Kubernetes API, do NOT disable automount — give it a dedicated\n# ServiceAccount configured for that integration instead.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: node-exporter\n  namespace: monitoring\nspec:\n  template:\n    spec:\n      automo "n":"monitoring","m":"node-exporter"}],"k":["daemonsets","deployments","statefulsets"]},"bff0772f646f":{"d":"kubectl drain refuses to evict the pod on node ip-10-0-1-a unless it is given --force, and with --force deletes it: nothing recreates a pod no controller manages.","r":[{"k":"Node","m":"ip-10-0-1-a"},{"k":"Pod","n":"workers","m":"debug-shell-ondemand"}],"k":["nodes","pods"]},"c1629f6ae3df":{"d":"Deployment api/auth-service has 1 of 1 container that do not drop ALL capabilities, so each keeps the default Linux capability set (NET_RAW included). The PSS-Restricted profile requires capabilities.drop:[ALL]; add back only NET_BIND_SERVICE if the container binds a privileged port. This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"api","m":"auth-service"}],"k":["daemonsets","deployments","statefulsets"]},"c23a8a6e996e":{"d":"The r6i.4xlarge pool (3 nodes) is billed at on-demand list. AWS publishes a Compute Savings Plan rate for this type in this region; the evidence states what the pool would cost under it and the two conditions under which that figure is real. Nothing is counted toward the headline.","r":[{"k":"Node","m":"ip-10-0-2-a"},{"k":"Node","m":"ip-10-0-2-b"},{"k":"Node","m":"ip-10-0-2-c"}],"pb":"unpriced","sk":"compute","k":["nodes"]},"c886fc0b97a6":{"d":"Every EndpointSlice listed for Service payments/legacy-payments-lb publishes zero entries with conditions.ready=true. An entry records that a controller published an address as a backend of this Service, so this is a count of what was published and says nothing about what any request did. Whether the count is expected depends on what this Service is for, which the snapshot does not record: a batch endpoint nobody calls, the idle half of a blue/green pair, and a Service whose consumers were retired all read exactly the same way.","r":[{"k":"Service","n":"payments","m":"legacy-payments-lb"}],"k":["endpointslices","services"]},"c8d39771bd4f":{"d":"Deployment default/legacy-cron-runner has 1 of 1 container whose effective seccompProfile is unset or Unconfined (computed pod then container). Set seccompProfile.type:RuntimeDefault at the pod level so every container inherits syscall filtering — required by PSS-Restricted (CIS 5.7.2 maps to 5.2.1 in this benchmark version). This reads the spec AS AUTHORED, not as admitted: a PodSecurity admission profile or mutating webhook could reject or fill this field at admission time. Read alongside the namespace's PodSecurity admission level (k8s.namespace.pss-admission-not-enforced) to know whether the cluster actually enforces it.","r":[{"k":"Deployment","n":"default","m":"legacy-cron-runner"}],"k":["daemonsets","deployments","statefulsets"]},"d0e911c264d1":{"d":"Deployment api/auth-service reserves CPU/memory above what its 7d usage ever needed, across 2 replicas. CPU is sized to the busiest replica's p95 plus 30% headroom; memory to the larger of p95×1.3 and the observed 7d max. The memory recommendation is floored at the observed 7d max so a bursty or GC-heavy workload is not down-sized below a working set it provably reaches. This reclaims reserved capacity the workload's 7d p95 never used — but the 95th percentile excludes tail bursts, so verify against the container's 7d max and your latency SLOs before applying: CPU below request is throttled, memory below peak is OOMKilled.","r":[{"k":"Deployment","n":"api","m":"auth-service"}],"y":"apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: auth-service\n  namespace: api\nspec:\n  template:\n    spec:\n      containers:\n        - name: auth-service\n          resources:\n            requests:\n              cpu: 110m      # 7d p95 ×1.3, right-sized\n              memory: 320Mi  # 7d p95 ×1.3, right-sized\n","pb":"priced","sk":"compute","k":["daemonsets","deployments","nodes","pods","statefulsets"],"us":"prometheus"},"d197f23cd6b4":{"d":"Namespace workers runs workloads but does not enforce a PodSecurity admission profile of baseline or restricted (enforce=\u003cunset\u003e). Without enforcement, the per-container PSS findings in this report describe the spec AS AUTHORED — nothing in the cluster actually blocks a privileged, root, or capability-laden pod from being admitted here. Apply the labels gradually: set warn and audit first to surface what would break, then set enforce. Enforcing restricted on a namespace that already runs noncompliant pods does NOT evict them, but it WILL block the next admission (a redeploy or rollout) — stage it. baseline is the safe first target (it blocks privileged, hostPath, hostNetwork, and host namespaces); however, the per-container findings in this report for this namespace (seccomp, drop-ALL capabilities, allowPrivilegeEscalation, runAsNonRoot) are Restricted-profile controls, so enforce=restricted is required to fully close them — baseline alone will not.","r":[{"k":"Namespace","m":"workers"}],"c":"kubectl label --overwrite namespace workers pod-security.kubernetes.io/warn=baseline pod-security.kubernetes.io/audit=baseline   # surface breakage first, then set enforce=baseline; use restricted (not baseline) on both warn/audit/enforce to close the per-container seccomp/capabilities/runAsNonRoot findings","s":"one-click","k":["daemonsets","deployments","namespaces","statefulsets"]},"d28b8e6a4c64":{"d":"Deployment api/auth-service does not enforce non-root execution at the API in 1 of 1 container: runAsNonRoot is unset and no non-zero runAsUser is set. The container image's USER directive is invisible to a read-only API client, so an unset spec is reported as UNCONFIRMED non-root, never \"runs as root\" — and rated Medium, like the other PSS fields a spec can leave unset. It is rated High only when root is confirmed or near
