/* ═══════════════════════════════════════════════════════════════════════════
   SHOALCHECK — the design system, shared by both surfaces.

   The reading document and the application window are one product and must look
   like one. Everything that decides that — the colour tokens for all three theme
   states, the type faces and scale, the spacing step, the severity and category
   ramps, the focus ring — lives here and is used by both. What does not live
   here is layout: the document is a canvas of panels, the app is a workbench of
   views, and their frames have no reason to agree.

   This file is generated from the first section of instrument.css and is the
   authority; instrument.css imports it rather than repeating it. A token added
   on one side and not the other is the drift this split exists to end.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════════════
   SHOALCHECK — the instrument.

   WHY THIS IS SHAPED THE WAY IT IS.

   The engine computes far more than a list of findings: node pools with their
   purchase mode and price basis, availability zones with every node in them,
   observed service edges, privilege chains read from role bodies, dated
   obligations, compliance coverage against a named ruler, a session trace of
   every request it issued, and — new — what each finding does NOT establish.
   A single scrolling table uses about a quarter of that.

   So the surface is EIGHT WORKSPACES, each answering one question, each held
   to five-to-nine panels because that is where working memory gives out. Not
   one page with everything on it; not a page per schema field.

     OVERVIEW    what is this cluster, and what do I do first
     BLAST       what stops working if a node or a zone goes
     COST        where the money is, and what is recoverable
     ACCESS      who can do what
     TOPOLOGY    how traffic reaches what
     COMPLIANCE  what an auditor will ask
     FINDINGS    the triage workbench — rules · workloads · findings
     METHOD      what it read, what it was refused, what it cost

   FIVE RULES, applied everywhere, each earned:

   1. EVERY NUMBER IS A CONTROL. A count you cannot click to become the set it
      counts is a dead end. "25 failed" → the 25.
   2. EVERY PANEL STATES ITS BASIS. A chart that cannot say what it rests on
      does not ship. This is the product's whole differentiator; burying it
      would be throwing away the reason to buy it.
   3. NOTHING TO CONFIGURE. The corpus is bounded and precomputed, so there is
      no query language, no time-range picker, no empty state, no spinner.
   4. COLOUR IS MEANING. Severity, purchase mode and pass/fail encode; nothing
      else is coloured. Never colour alone — always a letter or a position too.
   5. THE READER'S NOUNS. namespace · workload · node · team. Never "pillar".
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  color-scheme: light;
  --bg:        #f7f7f8;
  --surface:   #ffffff;
  --sunk:      #f1f1f3;
  --rail:      #ededf0;
  --line:      #e3e3e7;
  --line-soft: #eeeef1;
  /* Every one of these is at or above 4.5:1 on the quietest ground it is used on
     (--sunk), measured, not judged. The muted end of the ramp used to sit at
     2.2:1, which is a decorative grey pretending to be text. Hierarchy is carried
     by size, weight and spacing instead — 17:1 / 9:1 / 5.3:1 / 4.5:1 are four
     legible steps, and the quietest one is still text somebody can read. */
  --fg:        #17171a;
  --fg-mid:    #45454d;
  --fg-faint:  #6b6b73;
  /* category — a closed set of five, so hue can name the kind and leave
     intensity free to mean magnitude. */
  --cat-security:    #7c3aed;  --cat-security-bg:    #f1ebfe;
  --cat-reliability: #1d63d1;  --cat-reliability-bg: #e6eefc;
  --cat-cost:        #0d7a5f;  --cat-cost-bg:        #e0f2ec;
  --cat-config:      #b06a12;  --cat-config-bg:      #fbeddb;
  --cat-compliance:  #9333a8;  --cat-compliance-bg:  #f8eafb;
  /* The accent is legible as a 2px stroke or a 15px fill at 3.3:1; as 10px text
     it is not. A fill and a label are different jobs, so they are different
     tokens rather than one token used twice and failing once. */
  --accent:    #0d9488;
  --accent-bg: #e0f2f0;
  --accent-mid:#5eead4;
  /* severity — weight follows urgency, so the common bands recede */
  --sev-0: #b42318;  --sev-0-bg: #fee4e2;   /* critical */
  --sev-1: #c4470c;  --sev-1-bg: #fdecd8;   /* high     */
  --sev-2: #76683e;  --sev-2-bg: #efe9dc;   /* medium   */  --sev-3-bg: #ececed;   /* low      */  --sev-4-bg: #f2f2f4;   /* info     */
  /* The text that sits ON a severity fill is a theme decision, not a constant.
     White on the light theme's #b42318 is 7.4:1; white on the dark theme's
     #f97066 is 2.3:1 and fails AA outright. Naming the foreground makes the two
     themes able to disagree, which is the entire point of a token. */
  --on-sev-0: #ffffff;  --on-sev-1: #ffffff;
  --on-heat:  #ffffff;
  --scrim:    rgba(10,10,12,.5);
  /* status — pass / fail / not assessed. The third is a real state and looks it. */
  --ok:    #067647;  --ok-bg:  #dcfae6;
  --bad:   #b42318;  --bad-bg: #fee4e2;
--unk-bg: #efeff1;
  /* purchase mode, used only where capacity is the subject */
  --spot:  #7839ee;  --spot-bg: #ece9fe;
  --od:    #175cd3;  --od-bg:   #d1e9ff;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r:  6px;
  --row: 30px;
  --shadow-1: 0 1px 2px rgba(16,16,20,.05);
  --shadow-2: 0 4px 12px -4px rgba(16,16,20,.12), 0 1px 2px rgba(16,16,20,.06);
  --shadow-3: 0 16px 40px -12px rgba(16,16,20,.24), 0 2px 6px rgba(16,16,20,.08);
  --accent-text: #007c70;
  --hover: #f0f0f3;
  --sev-3: #6a6a74;
  --sev-4: #6d6d76;
  --fg-dim: #6d6d76;
  --unk: #66666f;
}

  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* The `hidden` attribute is a UA style, and ANY class rule that sets display
   beats it. Both the drawer and the selection bar set display, so both stayed
   visible-but-empty the moment they were hidden — a 34px white band under the
   canvas. The artifact host happens to ship this rule in its reset, which hid the
   bug there; the product ships as a standalone file with no host, so it declares
   it itself rather than inheriting somebody's floor. */
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }


/* The document's own layout. The shared design system lives in tokens.css and is
   concatenated ahead of this file by the renderer — NOT imported, because an
   @import inside an inlined <style> is a network fetch, and this document's first
   promise is that it makes none. */

/* ── app frame ─────────────────────────────────────────────────────────── */
/* the selection bar's row is `auto`, so it costs nothing while hidden */
/* `min-width: 0` on every row, for the same reason `min-height: 0` is on the
   canvas: a grid item's minimum is its CONTENT by default, so a row that scrolls
   internally — the facet strip, the cut bar, the header — still forces the grid
   wider than the viewport and the PAGE scrolls sideways instead. At 320px this
   pushed the document to 1707px. The overflow-x on those rows only takes effect
   once they are allowed to be narrower than what they hold. */
.app { height: 100dvh; display: grid; grid-template-rows: 40px 40px minmax(0,1fr) auto 32px; }
.app > * { min-width: 0; }

/* A chip, not a second title: outlined at the header's own size and weight, so it cannot read as a near-miss of
   the cluster name beside it (the apparatus-register gate failed the first, 600-weight version). */
.top .state { color: var(--sev-1); padding: 0 7px; border: 1px solid currentColor; border-radius: 999px; line-height: 18px; }
.top .state[hidden] { display: none; }
.sample-note {
  grid-column: 1 / -1; padding: var(--s3) var(--s4); border: 1px solid var(--line); border-left: 3px solid var(--sev-1);
  border-radius: 6px; background: var(--surface); color: var(--fg-mid); font-size: 13px; line-height: 1.5;
  max-width: 92ch; /* the measure gate caps a line at 96 characters; a full-bleed note ran 176 at 2560px */
}
.sample-note b { color: var(--fg); }
/* A label is the operator's own words, not a sample warning: the neutral rule, not amber. */
.label-note { border-left-color: var(--fg-faint); }
.fl-label { display: block; font-size: 11px; color: var(--fg-faint); white-space: normal; }
.top {
  display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s3); border-bottom: 1px solid var(--line); background: var(--surface);
  font-family: var(--mono); font-size: 11.5px; color: var(--fg-dim); white-space: nowrap;
  overflow-x: auto; scrollbar-width: none;
}
.top::-webkit-scrollbar { display: none; }
.top .right { flex: none; }
.top .cl { color: var(--fg); font-weight: 600; font-size: 13px; }
.top .dot { color: var(--fg-faint); }
.top .sig { display: inline-flex; align-items: center; gap: 5px; color: var(--ok); }
.top .right { margin-left: auto; display: flex; align-items: center; gap: var(--s2); }
.ghost {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px;
  border-radius: 5px; color: var(--fg-dim); font-family: var(--sans); font-size: 12px;
  transition: background .15s ease, color .15s ease;
}
.ghost:hover { background: var(--sunk); color: var(--fg); }
.kbd {
  font-family: var(--mono); font-size: 10px; padding: 2px 5px; border-radius: 4px;
  border: 1px solid var(--line); color: var(--fg-faint); background: var(--sunk);
}

/* ── workspace rail ────────────────────────────────────────────────────── */
.main { display: grid; grid-template-columns: 196px minmax(0,1fr); min-height: 0; min-width: 0; }
.rail {
  border-right: 1px solid var(--line); background: var(--sunk);
  overflow-y: auto; min-height: 0; padding: var(--s3) 0 var(--s5);
  display: flex; flex-direction: column; gap: 2px;
}
.rail .cap {
  margin: var(--s4) var(--s3) var(--s1); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em; color: var(--fg-faint);
}
.rail .cap:first-child { margin-top: 0; }
.ws {
  display: grid; grid-template-columns: 18px 1fr auto; gap: var(--s2); align-items: center;
  padding: 7px var(--s3); text-align: left; color: var(--fg-mid); font-size: 12.5px;
  transition: background .12s ease, color .12s ease;
}
.ws svg { opacity: .7; }
.ws .n { font-family: var(--mono); font-size: 10.5px; color: var(--fg-faint); font-variant-numeric: tabular-nums; }
.ws:hover { background: var(--rail); color: var(--fg); }
.ws[aria-current="page"] {
  background: var(--surface); color: var(--fg); font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
}
.ws[aria-current="page"] svg { opacity: 1; color: var(--accent); }

/* ── a phone ──────────────────────────────────────────────────────────────
   The 196px rail took half of a 390px screen: the canvas got about 170px, titles truncated to a letter, and the
   header's "Illustrative sample" chip sat past the right edge — on a page that says it is labelled as a sample
   on every screen. Under 760px the rail is a strip of workspaces across the top that scrolls sideways, the
   canvas takes the width, and the header keeps the cluster and its chip (where and when are in the overview). */
@media screen and (max-width: 760px) {
  .main { grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0,1fr); }
  .rail { flex-direction: row; align-items: center; overflow-x: auto; overflow-y: hidden; border-right: 0;
          border-bottom: 1px solid var(--line); padding: var(--s2); gap: var(--s1); scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail .cap { display: none; }
  .ws { grid-template-columns: 16px auto auto; flex: none; white-space: nowrap; padding: 6px 10px; border-radius: 6px; }
  .ws[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--accent); }
  .canvas { padding: var(--s3); }
  /* The header is one line that scrolls sideways when it is longer than the screen, and what scrolls out of view
     first is its end — the "Illustrative sample" chip. So on a phone the header keeps who and what, and drops
     where, when and how many, which the page's own panels carry: the reading's region and time, the fleet's time
     and its clusters, read and not read. The chip never shrinks; a long name does, with an ellipsis. */
  .top #t-where, .top #t-at, .top #f-at, .top #f-count, .top .dot { display: none; }
  .top .cl { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .top .state { flex: none; }
  .top .ghost { font-size: 0; gap: 0; }
  .top .ghost .kbd { display: none; }
  /* A PANEL KEEPS ITS TITLE. Beside a long aside the title shrank to its first letter — "W" for "What talks to
     what" — so on a phone the aside takes the line under the title. */
  .panel > header { flex-wrap: wrap; row-gap: 2px; }
  .panel > header .aside { margin-left: 0; white-space: normal; flex-basis: 100%; }
  /* A GRAPH KEEPS ITS SCALE. Drawn 1,300 units wide into 350 pixels it was a picture of a graph; it keeps a width
     its labels can be read at and scrolls sideways inside its panel (.gwrap). */
  .gwrap .graph { min-width: 720px; }
}

/* ── the canvas ────────────────────────────────────────────────────────── */
.canvas { overflow-y: auto; min-height: 0; padding: var(--s4); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: var(--s3);
        align-content: start; align-items: start; }
.grid > .fill { align-self: stretch; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; }
.c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; }
.c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
@media screen and (max-width: 1240px) {
  .c3, .c4, .c5 { grid-column: span 6; } .c7, .c8, .c9 { grid-column: span 12; }
}
@media screen and (max-width: 820px) { .grid > * { grid-column: span 12 !important; } }

/* ── panel — the one repeated object ───────────────────────────────────────
   Same edges, same inner padding, same header rhythm, every time. A panel is
   a question with an answer under it and its basis at the foot; anything that
   cannot fill all three is not a panel. */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow-1); display: flex; flex-direction: column; min-width: 0;
  overflow: hidden;
}
.panel > header {
  display: flex; align-items: baseline; gap: var(--s2);
  padding: var(--s3) var(--s3) 0; min-width: 0;
}
.panel > header h2 {
  margin: 0; font-size: 12.5px; font-weight: 600; color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.panel > header .aside {
  margin-left: auto; font-family: var(--sans); font-size: 11px; color: var(--fg-faint);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.panel > .body { padding: var(--s3); flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s3); }
.panel > .basis {
  padding: 7px var(--s3) 8px; border-top: 1px solid var(--line-soft); background: var(--sunk);
  font-family: var(--sans); font-size: 11.5px; color: var(--fg-dim); line-height: 1.55;
  max-width: 84ch;
}
.panel > .basis code, .panel > .basis .mono { font-family: var(--mono); font-size: 10.5px; }
.panel > .basis b { color: var(--fg-mid); font-weight: 500; }

/* ── figures ───────────────────────────────────────────────────────────── */
.figs { display: flex; flex-wrap: wrap; gap: var(--s5); }
.fig { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.fig .v {
  font-family: var(--mono); font-size: 22px; font-weight: 600;
  font-variant-numeric: tabular-nums; line-height: 1.15;
}
.fig .v.sm { font-size: 17px; }
.fig .k { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-dim); }
.fig.act { text-align: left; border-radius: 5px; padding: 3px 8px; margin: -3px -8px; transition: background .12s ease; }
.fig.act:hover { background: var(--sunk); }
.v.teal, b.teal, .teal { color: var(--accent-text); } .v.bad { color: var(--bad); } .v.ok { color: var(--ok); }

/* ── stacked proportion bar ────────────────────────────────────────────── */
.stack { display: flex; height: 26px; border-radius: 4px; overflow: hidden; gap: 1px; background: var(--line-soft); }
.stack button, .stack span {
  display: flex; align-items: center; justify-content: center; min-width: 30px;
  font-family: var(--mono); font-size: 10.5px; font-weight: 600;
  transition: filter .15s ease;
}
.stack button:hover { filter: brightness(1.08); }
.stack button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--fg); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); font-size: 11px; color: var(--fg-dim); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ── ranked bars — the workhorse for "where is it concentrated" ─────────── */
.ranks { display: flex; flex-direction: column; gap: 3px; }
.rank {
  display: grid; grid-template-columns: minmax(0,1fr) 54px; gap: var(--s3); align-items: center;
  padding: 3px 5px; border-radius: 4px; text-align: left; transition: background .12s ease;
}
.rank:hover { background: var(--sunk); }
.rank .lab { position: relative; min-width: 0; display: flex; align-items: center; height: 20px; }
.rank .fill {
  position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent-bg);
  border-left: 2px solid var(--accent);
}
.rank .txt {
  position: relative; padding: 0 7px; font-size: 12px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.rank .txt.mono { font-family: var(--mono); font-size: 11px; }
.rank .val { font-family: var(--mono); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; color: var(--fg-mid); }

/* ── matrix / heat grid ────────────────────────────────────────────────── */
.matrix { display: grid; gap: 2px; font-size: 11px; overflow-x: auto; }
.matrix .mh {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-faint);
  padding-bottom: 3px; white-space: nowrap;
}
.matrix .mr { font-family: var(--mono); font-size: 11px; color: var(--fg-mid); padding-right: var(--s2); white-space: nowrap; }
.cell {
  display: flex; align-items: center; justify-content: center; height: 24px; border-radius: 3px;
  font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
  transition: transform .12s ease, box-shadow .12s ease;
}
.cell:hover { transform: scale(1.06); box-shadow: var(--shadow-2); z-index: 2; }
.cell.z { color: var(--fg-faint); background: var(--sunk); }

/* ── node grid — the blast-radius picture ──────────────────────────────── */
.zones { display: flex; flex-direction: column; gap: var(--s3); }
.zone { display: grid; grid-template-columns: 118px minmax(0,1fr); gap: var(--s3); align-items: start; }
.zone .zn { display: flex; flex-direction: column; gap: 1px; padding-top: 2px; }
.zone .zn b { font-family: var(--mono); font-size: 11.5px; font-weight: 600; }
.zone .zn span { font-size: 10.5px; color: var(--fg-dim); }
.nodes { display: flex; flex-wrap: wrap; gap: 4px; }
.node {
  display: grid; gap: 1px; min-width: 92px; padding: 5px 7px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--sunk); text-align: left;
  transition: border-color .12s ease, transform .12s ease;
}
.node:hover { border-color: var(--accent); transform: translateY(-1px); }
.node b { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--fg); }
.node span { font-family: var(--mono); font-size: 9.5px; color: var(--fg-mid); }
.node .tag { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
.node.blocked { border-color: var(--bad); background: var(--bad-bg); }

/* ── chain — subject → binding → role ──────────────────────────────────── */
.chains { display: flex; flex-direction: column; gap: var(--s2); }
.chain {
  display: grid; gap: var(--s2); padding: var(--s2) var(--s3); border-radius: 5px;
  border: 1px solid var(--line); border-left-width: 3px; background: var(--sunk); text-align: left;
  transition: border-color .12s ease;
}
.chain:hover { border-color: var(--accent); }
.chain .hop { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; }
.chain .hop b { font-weight: 500; color: var(--fg); }
.chain .arr { color: var(--fg-faint); }
.chain .who { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-faint); }

/* ── flow — ingress → service → workload ───────────────────────────────── */
.flow { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s3); border: 1px solid var(--line); border-radius: 5px; background: var(--sunk); }
.flow .ft { font-size: 12px; font-weight: 600; }
.hops { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; }
.hop-box {
  display: grid; gap: 1px; padding: 6px 10px; border: 1px solid var(--line);
  background: var(--surface); border-radius: 5px; min-width: 0;
}
.hop-box b { font-family: var(--mono); font-size: 11px; font-weight: 500; }
.hop-box span { font-size: 10px; color: var(--fg-dim); }
.hop-arr { display: flex; align-items: center; padding: 0 6px; color: var(--fg-faint); }

/* ── coverage strip: pass / fail / manual / n-a, honestly proportioned ──── */
.cov { display: flex; height: 34px; border-radius: 5px; overflow: hidden; gap: 1px; background: var(--line-soft); }
.cov button {
  display: grid; place-items: center; gap: 0; min-width: 34px; padding: 0 4px;
  font-family: var(--mono); font-size: 11px; font-weight: 600; transition: filter .15s ease;
}
.cov button:hover { filter: brightness(1.08); }
.cov button small { font-size: 9px; font-weight: 500; opacity: .85; text-transform: uppercase; letter-spacing: .08em; }

/* ── table (the workbench) ─────────────────────────────────────────────── */
.tbl { display: grid; grid-template-rows: auto minmax(0,1fr); min-height: 0; height: 100%; }
.thead {
  display: grid; align-items: center; gap: var(--s2); padding: 0 var(--s3); height: 28px;
  border-bottom: 1px solid var(--line); background: var(--sunk);
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-faint); font-weight: 600;
}
.thead button { text-align: left; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; }
.thead button:hover { color: var(--fg); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow: auto; min-height: 0; position: relative; }
.spacer { position: relative; width: 100%; }
.rows { position: absolute; inset: 0 0 auto 0; }
.row {
  display: grid; align-items: center; gap: var(--s2); height: var(--row); padding: 0 var(--s3);
  cursor: pointer; border-bottom: 1px solid var(--line-soft); position: relative;
}
.row:hover { background: var(--sunk); }
.row[aria-selected="true"] { background: var(--accent-bg); }
.row .edge { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A MEASURE, because a mono BLOCK carries prose as often as it carries an identifier.
   Found by the analyzer-bearing corpus document the moment it existed: an evidence line ran 109 characters
   on one drawn line at 2560px, against this project's 96-character floor. Nothing had rendered it before,
   because no fixture carried an analyzer finding and analyzer evidence is longer than rule evidence.
   84ch matches the cap .panel > .basis already uses, and max-width does nothing to an inline box — so the
   identifiers that travel in <span class="mono"> are untouched, and only the blocks that wrap are capped. */
.mono { font-family: var(--mono); font-size: 11.5px; max-width: 84ch; }
.dim { color: var(--fg-dim); } .faint { color: var(--fg-faint); }

/* severity chip — a letter as well as a colour, always */
.sv {
  display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px;
  border-radius: 3px; font-family: var(--mono); font-size: 9.5px; font-weight: 700; flex: none;
}
.sv0 { background: var(--sev-0); color: var(--on-sev-0); } .sv1 { background: var(--sev-1); color: var(--on-sev-1); }
.sv2 { background: var(--sev-2-bg); color: var(--sev-2); box-shadow: inset 0 0 0 1px var(--sev-2); }
.sv3 { background: var(--sev-3-bg); color: var(--sev-3); box-shadow: inset 0 0 0 1px var(--sev-3); }
.sv4 { background: var(--sev-4-bg); color: var(--sev-4); box-shadow: inset 0 0 0 1px var(--sev-4); }
.e0 { background: var(--sev-0); } .e1 { background: var(--sev-1); } .e2 { background: var(--sev-2); }
.e3 { background: var(--sev-3); } .e4 { background: var(--sev-4); }

/* ── detail drawer ─────────────────────────────────────────────────────── */
.drawer {
  position: fixed; top: 40px; right: 0; bottom: 32px; width: min(460px, 42vw);
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-3);
  overflow-y: auto; z-index: 30;
}
.drawer-in { padding: var(--s4) var(--s4) var(--s7); display: flex; flex-direction: column; gap: var(--s4); }
.drawer h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.32; }
.drawer .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--fg-dim); }
.sect { display: flex; flex-direction: column; gap: var(--s2); }
.sect > .h { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-faint); font-weight: 600; }
.sect p { margin: 0; color: var(--fg-mid); }
.sect ul { margin: 0; padding-left: 17px; display: flex; flex-direction: column; gap: 5px; }
.sect.limits li { color: var(--fg-dim); }
.sect.limits { border-left: 2px solid var(--line); padding-left: var(--s3); margin-left: -2px; }

/* ── cut bar ───────────────────────────────────────────────────────────── */
.cut {
  min-width: 0; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3);
  border-top: 1px solid var(--line); background: var(--surface);
  font-family: var(--mono); font-size: 11.5px; color: var(--fg-dim);
  overflow-x: auto; white-space: nowrap;
}
.cut b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.cut .teal { color: var(--accent-text); }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--sunk);
  color: var(--fg-mid); font-size: 11px; transition: border-color .12s ease, color .12s ease;
}
.chip:hover { border-color: var(--accent); color: var(--fg); }
.cut .right { margin-left: auto; display: flex; align-items: center; gap: var(--s2); }

/* ── command palette ───────────────────────────────────────────────────── */
.pal-bg { position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(2px); z-index: 60; display: flex; justify-content: center; padding-top: 11vh; }
.pal { width: min(640px, 92vw); height: fit-content; max-height: 70vh; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-3); overflow: hidden; display: flex; flex-direction: column; }
.pal input { width: 100%; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--fg); font-family: var(--mono); font-size: 14px; outline: none; }
.pal ul { list-style: none; margin: 0; padding: 5px; overflow-y: auto; min-height: 0; }
.pal li { display: grid; grid-template-columns: 1fr auto; gap: var(--s3); align-items: center; padding: 8px 11px; border-radius: 5px; cursor: pointer; font-size: 12.5px; }
.pal li[aria-selected="true"] { background: var(--accent-bg); }
.pal li .s { font-family: var(--mono); font-size: 10.5px; color: var(--fg-dim); }
.pal .hint { padding: 8px 16px; border-top: 1px solid var(--line); background: var(--sunk); font-size: 11px; color: var(--fg-faint); display: flex; gap: var(--s4); }

.empty { padding: var(--s6) var(--s4); text-align: center; color: var(--fg-faint); font-size: 12.5px; }
.note { font-size: 11.5px; color: var(--fg-dim); line-height: 1.5; }
.note b { color: var(--fg-mid); font-weight: 500; }

/* ── tracking ────────────────────────────────────────────────────────────────
   Three roles carry letter-spacing and each carries exactly ONE value: uppercase
   labels at or below 13px (0.08em), large mono readings at 36px and up, and large
   sans display at 28px and up. Everything else is zero.

   The negative tracking that used to sit on 12.5px panel headings and 22px
   figures was doing nothing a reader could see: the embedded Inter has an opsz
   axis that has already tightened those letterforms before any manual value
   applies, so the declaration was a second opinion about a decision the font had
   made. Four different values across .lbl, .k, .mh and small were four answers to
   one question. */

/* ── the facet strip ───────────────────────────────────────────────────────
   Every workspace draws the same cut, so the control that narrows it belongs
   above all of them rather than inside one. A facet shows its own count under
   the *rest* of the cut, so a reader can see what a click would cost before
   they spend it — and a facet whose count is 0 is drawn, greyed, not hidden:
   an absence is a fact about this cluster, not a reason to remove a control. */
.facets {
  display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s4); height: 40px; background: var(--surface);
  border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none;
}
.facets::-webkit-scrollbar { display: none; }
.fgroup { display: flex; align-items: center; gap: 3px; flex: none; }
.fgroup > .lbl {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--fg-faint); margin-right: 3px;
}
.facet {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  /* WCAG 2.2 target size (minimum): 24x24. These sat at 21 and were the densest
     controls on the page — the ones most likely to be mis-hit. */
  height: 24px; padding: 0 8px; border-radius: 4px; cursor: pointer;
  border: 1px solid transparent; background: var(--sunk);
  font-family: var(--mono); font-size: 10.5px; color: var(--fg-mid);
  line-height: 1; white-space: nowrap; transition: background .12s, color .12s, border-color .12s;
}
.facet:hover { background: var(--hover); color: var(--fg); }
.facet .n { font-variant-numeric: tabular-nums; color: var(--fg-faint); font-size: 10px; }
.facet[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.facet[aria-pressed="true"] .n { color: var(--surface); opacity: .7; }
.facet[data-empty="1"] { opacity: .38; cursor: default; }
.facet[data-empty="1"]:hover { background: var(--sunk); color: var(--fg-mid); }
.facet .sw { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.facet.s0 .sw { background: var(--sev-0); } .facet.s1 .sw { background: var(--sev-1); }
.facet.s2 .sw { background: var(--sev-2); } .facet.s3 .sw { background: var(--sev-3); }
.facet.s4 .sw { background: var(--sev-4); }
.facet.security    .sw { background: var(--cat-security); }
.facet.reliability .sw { background: var(--cat-reliability); }
.facet.cost        .sw { background: var(--cat-cost); }
.facet.config      .sw { background: var(--cat-config); }
.facet.compliance  .sw { background: var(--cat-compliance); }
.fsep { width: 1px; height: 16px; background: var(--line); flex: none; }
.fclear {
  margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 9px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--line); background: transparent;
  font-family: var(--mono); font-size: 10.5px; color: var(--fg-dim);
}
.fclear:hover { border-color: var(--fg-dim); color: var(--fg); }

/* ── severity-segmented ranks ──────────────────────────────────────────────
   The flat version of this bar spent its whole length saying "how many". The
   segmented one says how many AND how bad in the same pixels, which is the
   only honest reason to add ink: a namespace with 30 low findings and one with
   30 criticals were previously drawn identically. */
.sranks { display: flex; flex-direction: column; gap: 5px; }
.srank {
  display: grid; grid-template-columns: 96px minmax(0,1fr) 34px; gap: var(--s2);
  align-items: center; background: none; border: 0; padding: 0; cursor: pointer;
  text-align: left; font: inherit; color: inherit; border-radius: 3px;
}
.srank .nm {
  font-family: var(--mono); font-size: 11px; color: var(--fg-mid);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.srank:hover .nm { color: var(--fg); }
.srank .seg { display: flex; height: 15px; border-radius: 3px; overflow: hidden; background: var(--sunk); }
/* The row, not the bar, is the target: 24px tall so it clears WCAG 2.2's minimum
   while the bar inside stays the width the data gives it. */
.srank { min-height: 24px; }
.srank .seg i { display: block; height: 100%; }
.srank .tot {
  font-family: var(--mono); font-size: 11px; color: var(--fg-mid); text-align: right;
  font-variant-numeric: tabular-nums;
}
.srank:hover .seg { outline: 1px solid var(--line); outline-offset: 1px; }

/* ── treemap ───────────────────────────────────────────────────────────────
   Area is the count and hue is the category. Cells below a legible size carry no
   text rather than clipped text: a label that cannot be read is noise that costs
   contrast. */
.tmap { position: relative; width: 100%; height: 208px; border-radius: 4px; overflow: hidden; background: var(--sunk); }
/* A treemap cell is smaller than the 24px target minimum whenever its rule is a
   small share of the mass — and that is not a defect to correct, because the
   cell's size IS the datum. WCAG 2.2 exempts a target whose size is essential to
   the information conveyed. The same filter is reachable at full size from the
   Rules workspace and from the command palette, which is the equivalent-control
   route the exception asks for. */
.tcell {
  position: absolute; overflow: hidden; cursor: pointer; border: 0; padding: 5px 6px;
  text-align: left; font: inherit; color: var(--fg);
  outline: 1.5px solid var(--surface); outline-offset: -1.5px;
  transition: filter .12s;
}
.tcell:hover { filter: brightness(.93) saturate(1.15); z-index: 2; }
.tcell .tn {
  display: block; font-family: var(--mono); font-size: 10px; line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg);
}
.tcell .tv {
  display: block; font-family: var(--mono); font-size: 13px; font-weight: 600;
  line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--fg);
}
.tlegend { display: flex; flex-wrap: wrap; gap: var(--s3); }
.tlegend span { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10.5px; color: var(--fg-dim); }
.tlegend i { width: 8px; height: 8px; border-radius: 2px; }

/* ── the reachability graph ────────────────────────────────────────────────
   Edges are drawn under nodes and kept quiet: the reader is looking for the
   shape of the connection, not admiring the line. A node with no inbound edge
   is dashed, because "no path this reading found" is a weaker claim than "no
   path", and the drawing must not say the stronger one. */
.graph { display: block; overflow: visible; width: 100%; height: auto; }
.graph .gnum { font-family: var(--mono); font-size: 11px; font-weight: 600;
               fill: var(--fg-mid); text-anchor: end; }
.graph .edges path { fill: none; stroke: var(--line); stroke-width: 1.25; }
.graph .gnode rect { transition: stroke .12s, filter .12s; }
.graph .gnode { cursor: pointer; }
.graph .gnode:hover rect:first-of-type { filter: brightness(.97); }
.graph .gnode:hover rect { stroke: var(--fg-dim); }
.graph .gnode:focus-visible rect:first-of-type { stroke: var(--accent); stroke-width: 2; }
.graph .gnode.orphan rect:first-of-type { stroke-dasharray: 3 2.5; }
.graph .gn { font-family: var(--mono); font-size: 10.5px; fill: var(--fg); }
.graph .gs { font-family: var(--mono); font-size: 9px; fill: var(--fg-faint); }
.graph .glab {
  font-family: var(--mono); font-size: 9px; fill: var(--fg-faint);
  letter-spacing: .08em; text-transform: uppercase;
}
.gwrap { overflow-x: auto; margin: 0 calc(var(--s3) * -1); padding: 0 var(--s3); }

/* ── graph focus ───────────────────────────────────────────────────────────
   One class on the <svg> drives the whole state change, so a hover costs one
   write and the cascade does the work. Dimming is opacity only — nothing moves,
   nothing reflows, and the graph's shape is identical before and after, which is
   the point: the reader is being helped to read the same drawing, not shown a
   different one. */
.graph .gnode, .graph .edges path { transition: opacity .14s ease-out, stroke .14s ease-out; }
.graph.focused .gnode.off { opacity: .17; }
.graph.focused .edges path { opacity: .12; }
.graph.focused .edges path.on { opacity: 1; stroke: var(--accent); stroke-width: 1.9; }
/* The observed map: a dropped edge is red and dashed, a failing one red, and every edge carries its rate in words
   haloed against the panel so a crossing line does not cut through them. */
.graph .edges path.dropped { stroke: var(--sev-0); stroke-dasharray: 4 3; }
.graph .edges path.erring { stroke: var(--sev-0); }
.graph .elab { font-family: var(--mono); font-size: 11px; fill: var(--fg-dim); paint-order: stroke;
               stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; transition: opacity .14s ease-out; }
.graph .elab.dropped, .graph .elab.erring { fill: var(--sev-0); }
.graph.focused .edges .elab { opacity: .15; }
.graph.focused .edges .elab.on { opacity: 1; }
.graph.focused .gnode.on rect:first-of-type { stroke: var(--accent); stroke-width: 1.6; }
.graph.searching .gnode { opacity: .2; }
.graph.searching .gnode.hit { opacity: 1; }
.graph.searching .gnode.hit rect:first-of-type { stroke: var(--accent); stroke-width: 1.8; }
@media (prefers-reduced-motion: reduce) {
  .graph .gnode, .graph .edges path { transition: none; }
}

/* ── detached workloads ────────────────────────────────────────────────────
   Twelve of these stacked in the graph's column made the drawing four times
   taller than the flow it draws. As a grid they are legible AND the graph above
   is compact — the same facts, a quarter of the page. */
.detached { margin-top: var(--s4); padding-top: var(--s3); border-top: 1px dashed var(--line); }
.detached .dh {
  display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--fg-faint); margin-bottom: var(--s2);
}
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 6px; }
.dchip {
  display: grid; grid-template-columns: minmax(0,1fr) auto; grid-template-rows: auto auto;
  align-items: center; gap: 0 var(--s2); text-align: left; cursor: pointer;
  padding: 6px 9px; border: 1px solid var(--line); border-left: 3px solid var(--line);
  border-radius: 4px; background: var(--surface); transition: border-color .12s, background .12s;
}
.dchip:hover { background: var(--hover); border-color: var(--fg-faint); }
.dchip .dn { font-family: var(--mono); font-size: 11px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dchip .ds { grid-column: 1; font-family: var(--mono); font-size: 9.5px; color: var(--fg-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dchip .dc {
  grid-column: 2; grid-row: 1 / span 2; font-family: var(--mono); font-size: 12px;
  font-weight: 600; color: var(--fg-mid); font-variant-numeric: tabular-nums;
}

/* ── workload cards ────────────────────────────────────────────────────────── */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 7px; }
.card {
  display: grid; grid-template-columns: minmax(0,1fr) auto; grid-template-rows: auto auto auto;
  gap: 3px var(--s2); align-items: center; text-align: left; cursor: pointer;
  padding: 9px 11px; border: 1px solid var(--line); border-left: 3px solid var(--line);
  border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-1);
  transition: border-color .12s, transform .12s, box-shadow .12s;
}
.card:hover { border-color: var(--fg-faint); transform: translateY(-1px); box-shadow: var(--shadow-2); }
.card .cn { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--fg);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .cm { grid-column: 1 / -1; font-family: var(--mono); font-size: 9.5px; color: var(--fg-faint);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .cm b { color: var(--ok); font-weight: 500; }
.card .cbar { grid-column: 1 / -1; display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--sunk); }
.card .cbar i { display: block; height: 100%; }
.card .cf { grid-row: 1; grid-column: 2; font-family: var(--mono); font-size: 15px; font-weight: 600;
            color: var(--fg); font-variant-numeric: tabular-nums; }
.card .cf .none { font-size: 10px; font-weight: 400; color: var(--ok); }
.card .cu { grid-row: 2; grid-column: 2; font-family: var(--mono); font-size: 10px; color: var(--accent-text); text-align: right; }

/* ── namespace scorecards ─────────────────────────────────────────────────── */
.score-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 9px; }
.score { padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--r);
         background: var(--surface); box-shadow: var(--shadow-1); cursor: pointer;
         transition: border-color .12s, transform .12s; }
.score:hover { border-color: var(--fg-faint); transform: translateY(-1px); }
.score .sh { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
.score .sn { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--fg);
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Named .snum, not .sv2: ".sv2" already means "severity 2" and carries a fill and
   an inset ring, so a scorecard's count was being drawn as a severity chip. Two
   meanings on one class name is a collision waiting for the next component. */
.score .snum { font-family: var(--mono); font-size: 17px; font-weight: 600; color: var(--fg);
               font-variant-numeric: tabular-nums; white-space: nowrap; }
.score .snum small { font-size: 9px; font-weight: 400; color: var(--fg-mid); margin-left: 4px; }
.score .sbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden;
               background: var(--sunk); margin: 8px 0 9px; }
.score .sbar i { display: block; height: 100%; }
.score .sg { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
.score .g { font-family: var(--mono); font-size: 9.5px; padding: 2px 6px; border-radius: 3px; }
.score .g.on  { background: var(--ok-bg);  color: var(--ok); }
.score .g.off { background: var(--bad-bg); color: var(--bad); }
.score .g.unk { background: var(--unk-bg); color: var(--unk); }
.score .sf { font-family: var(--mono); font-size: 10px; color: var(--fg-faint); }
.score .sf b { color: var(--accent-text); }

/* ── rule list ────────────────────────────────────────────────────────────── */
.rulelist { display: flex; flex-direction: column; gap: 2px; }
.rl {
  /* IDENTICAL to .rulehead — a header on one template and rows on another puts
     every column label over the wrong column, which is worse than no header. */
  display: grid; grid-template-columns: 20px minmax(0,1fr) 92px 58px 46px 62px;
  gap: var(--s2); align-items: center; text-align: left; cursor: pointer;
  padding: 4px 6px; border: 0; border-radius: 4px; background: none; font: inherit;
  transition: background .1s;
}
.rl:hover { background: var(--hover); }
.rl .sv { width: 18px; height: 18px; border-radius: 3px; display: grid; place-items: center;
          font-family: var(--mono); font-size: 10px; font-weight: 700; }
.rl .sv.sv0 { background: var(--sev-0); color: var(--on-sev-0); } .rl .sv.sv1 { background: var(--sev-1); color: var(--on-sev-1); }
.rl .sv.sv2 { background: var(--sev-2-bg); color: var(--sev-2); }
.rl .sv.sv3 { background: var(--sev-3-bg); color: var(--sev-3); }
.rl .sv.sv4 { background: var(--sev-4-bg); color: var(--sev-4); }
.rl .rn { font-family: var(--mono); font-size: 11px; color: var(--fg);
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rl .rc { font-family: var(--mono); font-size: 9.5px; padding: 2px 7px; border-radius: 3px;
          text-align: center; color: var(--fg-mid); justify-self: stretch; }
.rl .rv, .rl .rs, .rl .ru { font-family: var(--mono); font-size: 11px; text-align: right;
                            font-variant-numeric: tabular-nums; }
.rl .rv { color: var(--fg); font-weight: 600; } .rl .rs { color: var(--fg-faint); font-size: 10px; }
.rl .ru { color: var(--accent-text); }

/* ── timeline ─────────────────────────────────────────────────────────────── */
.tl { display: flex; flex-direction: column; }
.tli { display: grid; grid-template-columns: 104px 22px minmax(0,1fr); gap: var(--s2); align-items: start; padding: 9px 0; }
.tli + .tli { border-top: 1px solid var(--line-soft); }
.tld { font-family: var(--mono); font-size: 12px; color: var(--fg); font-variant-numeric: tabular-nums; }
.tli.past .tld { color: var(--bad); }
.tlm { position: relative; align-self: stretch; }
.tlm::before { content: ""; position: absolute; left: 50%; top: 5px; width: 8px; height: 8px;
               margin-left: -4px; border-radius: 50%; background: var(--fg-faint); }
.tli.past .tlm::before { background: var(--bad); }
.tlm::after { content: ""; position: absolute; left: 50%; top: 15px; bottom: -14px; width: 1px;
              margin-left: -.5px; background: var(--line); }
.tli:last-child .tlm::after { display: none; }
.tlo { display: block; font-size: 13px; line-height: 1.5; color: var(--fg-mid); max-width: 88ch; }
.tls { display: block; font-family: var(--mono); font-size: 10px; color: var(--fg-faint); margin-top: 3px; }

.unread { display: flex; flex-direction: column; gap: var(--s3); }
.ur { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: var(--s3); align-items: baseline; }
.ur .uc { font-family: var(--mono); font-size: 11.5px; color: var(--fg); }
.ur .uw { font-size: 12.5px; line-height: 1.55; color: var(--fg-dim); }

/* ── act ──────────────────────────────────────────────────────────────────── */
.tickets { display: flex; flex-direction: column; gap: 4px; }
.tk { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: var(--s2);
      align-items: center; padding: 6px; border-radius: 4px; }
.tk:hover { background: var(--hover); }
.tk .sv { width: 18px; height: 18px; border-radius: 3px; display: grid; place-items: center;
          font-family: var(--mono); font-size: 10px; font-weight: 700; }
.tk .sv.sv0 { background: var(--sev-0); color: var(--on-sev-0); } .tk .sv.sv1 { background: var(--sev-1); color: var(--on-sev-1); }
.tk .sv.sv2 { background: var(--sev-2-bg); color: var(--sev-2); }
.tk .sv.sv3 { background: var(--sev-3-bg); color: var(--sev-3); }
.tk .sv.sv4 { background: var(--sev-4-bg); color: var(--sev-4); }
.tk .tkn { min-width: 0; display: grid; gap: 1px; }
.tk .tkn b { font-size: 12.5px; font-weight: 500; color: var(--fg);
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk .tkm { font-family: var(--mono); font-size: 10px; color: var(--fg-faint); }
.tk .tka { display: flex; gap: 3px; }
.mini {
  font-family: var(--mono); font-size: 10.5px; min-height: 24px; padding: 4px 9px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg-mid); cursor: pointer;
  transition: border-color .12s, color .12s, background .12s;
}
.mini:hover { border-color: var(--fg-dim); color: var(--fg); background: var(--hover); }
.mini.done { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }

.exports { display: flex; flex-direction: column; gap: var(--s3); }
.ex { display: grid; gap: 3px; }
.ex .exn { font-size: 12px; font-weight: 600; color: var(--fg); }
.ex .exc { font-family: var(--mono); font-size: 10.5px; color: var(--accent-text);
           background: var(--sunk); padding: 3px 6px; border-radius: 3px; justify-self: start; }
.ex .exd { font-size: 11.5px; line-height: 1.5; color: var(--fg-dim); }

.code {
  font-family: var(--mono); font-size: 10.5px; line-height: 1.6; color: var(--fg-mid);
  background: var(--sunk); border: 1px solid var(--line-soft); border-radius: 5px;
  padding: 10px 12px; margin: 0 0 var(--s2); overflow-x: auto; white-space: pre;
}

/* ── screen transition ─────────────────────────────────────────────────────
   Moving down the rail slides content up, moving up slides it down: the motion
   carries the direction of travel, which is the only thing motion is for here.
   It is 150ms and it never blocks input — the next click lands mid-flight. */
@media (prefers-reduced-motion: no-preference) {
  .canvas.enter-down > .grid, .canvas.enter-down > .tbl { animation: sl-down 170ms cubic-bezier(.16,1,.3,1); }
  .canvas.enter-up   > .grid, .canvas.enter-up   > .tbl { animation: sl-up   170ms cubic-bezier(.16,1,.3,1); }
}
@keyframes sl-down { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes sl-up   { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

.trackercfg {
  display: grid; grid-template-columns: auto minmax(0,220px) 1fr; gap: var(--s2);
  align-items: center; padding-bottom: var(--s3); margin-bottom: var(--s2);
  border-bottom: 1px solid var(--line-soft);
}
.trackercfg label { font-family: var(--mono); font-size: 10.5px; color: var(--fg-dim); }
.trackercfg input {
  font-family: var(--mono); font-size: 11px; color: var(--fg); padding: 4px 8px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--surface);
  transition: border-color .12s, box-shadow .12s;
}
.trackercfg input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
.trackercfg input.needed { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad-bg); }
.trackercfg #jirahostnote { font-family: var(--mono); font-size: 10px; color: var(--fg-faint); }

/* ── mass bars ─────────────────────────────────────────────────────────────
   The rule name gets the room it needs; the bar takes what is left. A name is
   never truncated here — if it does not fit, the layout is wrong, not the name. */
.mbars { display: flex; flex-direction: column; gap: 3px; }
.mbar {
  display: grid; grid-template-columns: minmax(0, 260px) minmax(0,1fr) 40px;
  gap: var(--s3); align-items: center; min-height: 24px; padding: 2px 4px;
  border: 0; border-radius: 4px; background: none; text-align: left; cursor: pointer;
  font: inherit; color: inherit; transition: background .1s;
}
.mbar:hover { background: var(--hover); }
.mbar .mn { font-family: var(--mono); font-size: 11px; color: var(--fg); }
.mbar .mt { height: 14px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.mbar .mf { display: block; height: 100%; border-radius: 3px; }
.mbar .mv {
  font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--fg);
  text-align: right; font-variant-numeric: tabular-nums;
}
@media screen and (max-width: 1240px) { .mbar { grid-template-columns: minmax(0, 190px) minmax(0,1fr) 36px; } }

/* ── binding ledger ────────────────────────────────────────────────────────
   The band label is a word, not a shouty uppercase sentence repeated on every
   row. Five rows previously carried five copies of "BAND READ FROM THE ROLE'S
   OWN RULES", which is a footnote wearing a row's clothes; it is in the panel's
   basis line once, where a footnote belongs. */
.binds { display: flex; flex-direction: column; gap: 3px; }
.bind {
  display: grid; grid-template-columns: 74px minmax(0,1fr); gap: var(--s3);
  align-items: center; min-height: 30px; padding: 5px 9px; cursor: pointer;
  border: 1px solid var(--line); border-left: 3px solid var(--line);
  border-radius: 5px; background: var(--surface); text-align: left; font: inherit;
  transition: background .12s, border-color .12s;
}
.bind:hover { background: var(--hover); border-color: var(--fg-faint); }
.bind .bsev {
  font-family: var(--mono); font-size: 9.5px; padding: 2px 0; border-radius: 3px;
  text-align: center;
}
.bind .bpath {
  font-family: var(--mono); font-size: 11px; color: var(--fg);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bind .bpath .dim { color: var(--fg-dim); }
 /* DRAWN, NOT TYPED. U+2192 is absent from both embedded faces, so a typed arrow
    is painted by whatever the reader's machine happens to have — Lucida Grande on
    one desk, nothing at all on another. A document that ships its typefaces so it
    looks the same everywhere cannot then borrow a glyph. */
.bind .bpath .arr { display: inline-block; width: 13px; height: 1px; position: relative;
                    background: var(--fg-faint); vertical-align: middle; margin: 0 2px; }
.bind .bpath .arr::after { content: ""; position: absolute; right: 0; top: -2.5px;
                           border: 3px solid transparent; border-left-color: var(--fg-faint);
                           border-right: 0; }

/* a ticket title wraps rather than truncating — the title IS the thing being
   raised, and half of it raises nothing */
.tk .tkn b { white-space: normal; overflow: visible; line-height: 1.35; }

/* ── zone loss ─────────────────────────────────────────────────────────────── */
.zloss { display: flex; flex-direction: column; gap: 6px; }
.zl {
  display: grid; grid-template-columns: 128px minmax(0,1fr) 40px; grid-template-rows: auto auto;
  gap: 2px var(--s3); align-items: center; min-height: 24px; padding: 5px 6px;
  border: 0; border-radius: 5px; background: none; text-align: left; font: inherit;
  color: inherit; cursor: pointer; transition: background .1s;
}
.zl:hover { background: var(--hover); }
.zl .zn { font-family: var(--mono); font-size: 11.5px; color: var(--fg); }
.zl .zbar { height: 14px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.zl .zf { display: block; height: 100%; border-radius: 3px; }
.zl .zp { font-family: var(--mono); font-size: 11.5px; font-weight: 600; text-align: right;
          font-variant-numeric: tabular-nums; color: var(--fg); }
.zl .zm { grid-column: 2 / -1; font-family: var(--mono); font-size: 10px; color: var(--fg-dim); }
.zl .zm b { color: var(--sev-1); }

/* ── fleet composition ─────────────────────────────────────────────────────── */
.pools { display: flex; flex-direction: column; gap: 7px; }
.fl { display: grid; grid-template-columns: 118px 108px minmax(0,1fr) 34px 92px;
      gap: var(--s3); align-items: center; }
.fl .fn { font-family: var(--mono); font-size: 11.5px; color: var(--fg); }
.fl .fs { font-family: var(--mono); font-size: 10px; color: var(--fg-dim); }
.fl .fbar { height: 12px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.fl .ff { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.fl .fc { font-family: var(--mono); font-size: 11.5px; font-weight: 600; text-align: right;
          font-variant-numeric: tabular-nums; color: var(--fg); }
.fl .fcap { font-family: var(--mono); font-size: 9.5px; padding: 2px 7px; border-radius: 3px; text-align: center; }
.fl .fcap.od   { background: var(--od-bg);   color: var(--od); }
.fl .fcap.spot { background: var(--spot-bg); color: var(--spot); }
.fl .fcap.unk  { background: var(--unk-bg);  color: var(--unk); }

.score { border-top: 3px solid var(--line); }
.score .scat { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 7px; }
.score .ck { font-family: var(--mono); font-size: 9.5px; padding: 2px 6px; border-radius: 3px; color: var(--fg-mid); }

/* ── guardrail coverage ────────────────────────────────────────────────────── */
.gcov { display: flex; flex-direction: column; gap: 9px; }
.gc { display: grid; grid-template-columns: 128px minmax(0,1fr) 52px; gap: var(--s3); align-items: center; }
.gc .gcn { font-family: var(--mono); font-size: 11px; color: var(--fg); }
.gc .gcbar { height: 12px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.gc .gcf { display: block; height: 100%; border-radius: 3px; }
.gc .gcv { font-family: var(--mono); font-size: 11px; color: var(--fg-mid); text-align: right;
           font-variant-numeric: tabular-nums; }
.gc .gcv.none { color: var(--bad); }

/* ── graph manipulation ────────────────────────────────────────────────────── */
.graph { touch-action: none; cursor: grab; }
.graph.zoomed { cursor: grab; }
.graph:active { cursor: grabbing; }
.graph .gnode.pin rect:first-of-type { stroke: var(--accent); stroke-width: 2.2; }
.ghint {
  display: flex; gap: var(--s4); font-family: var(--mono); font-size: 10px;
  color: var(--fg-faint); margin-top: 6px;
}
.ghint b { color: var(--fg-dim); font-weight: 500; }

/* ── sortable rule header ──────────────────────────────────────────────────── */
.rulehead {
  display: grid; grid-template-columns: 20px minmax(0,1fr) 92px 58px 46px 62px;
  gap: var(--s2); align-items: center; padding: 0 6px 5px;
  border-bottom: 1px solid var(--line); margin-bottom: 4px;
}
.rh {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--fg-faint); background: none; border: 0; padding: 3px 2px; cursor: pointer;
  text-align: right; white-space: nowrap; min-height: 24px;
}
.rh:nth-child(2) { text-align: left; }
.rh:nth-child(3) { text-align: left; }
.rh:hover { color: var(--fg); }
.rh[aria-sort] { color: var(--fg); }
.rh i { font-style: normal; margin-left: 3px; }

/* ── affected resources ────────────────────────────────────────────────────── */
.reslist { display: flex; flex-wrap: wrap; gap: 4px; }
.res {
  font-family: var(--mono); font-size: 10.5px; color: var(--fg-mid);
  background: var(--sunk); border: 1px solid var(--line-soft);
  border-radius: 3px; padding: 3px 7px;
}
.res b { color: var(--fg); font-weight: 500; }
.res .dim { color: var(--fg-faint); }
.drawer .sect .h em { font-style: normal; color: var(--fg-faint); font-weight: 400; margin-left: 5px; }

/* ── remediation ───────────────────────────────────────────────────────────
   A command carries its safety classification in the border it is drawn with,
   and never a button that runs it: this product makes no write anywhere, and a
   one-click apply would be the first. */
.cmd {
  display: flex; align-items: flex-start; gap: var(--s2);
  border-left: 3px solid var(--line); background: var(--sunk);
  border-radius: 4px; padding: 8px 10px; margin-bottom: 6px;
}
.cmd.ok { border-left-color: var(--ok); }
.cmd.byhand { border-left-color: var(--sev-1); }
.cmd code {
  flex: 1; font-family: var(--mono); font-size: 11px; line-height: 1.55;
  color: var(--fg); word-break: break-word; white-space: pre-wrap;
}
.safety { font-size: 11.5px; line-height: 1.5; color: var(--fg-dim); margin: 0; }
.safety.byhand { color: var(--sev-1); }
.safety.ok { color: var(--fg-dim); }
.safety b { color: var(--fg-mid); }
.drawer .code { max-height: 320px; overflow: auto; margin-bottom: 6px; }

/* ── control rows ──────────────────────────────────────────────────────────── */
.fwblock + .fwblock { margin-top: var(--s4); }
.fwh { display: flex; align-items: baseline; gap: var(--s3); margin-bottom: 5px;
       padding-bottom: 4px; border-bottom: 1px solid var(--line-soft); }
.fwn { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--fg); }
.fwc { font-family: var(--mono); font-size: 10px; color: var(--fg-faint); }
.fwc b { color: var(--bad); font-weight: 500; }
.ctrls { display: flex; flex-direction: column; gap: 1px; }
.ctrl {
  display: grid; grid-template-columns: 108px minmax(0,1fr) 62px 34px; gap: var(--s3);
  align-items: center; min-height: 24px; padding: 3px 6px; border: 0; border-radius: 4px;
  background: none; text-align: left; font: inherit; color: inherit; cursor: pointer;
  transition: background .1s;
}
.ctrl:hover { background: var(--hover); }
.ctrl .cno { font-family: var(--mono); font-size: 11px; color: var(--fg); font-variant-numeric: tabular-nums; }
.ctrl .ctt { font-size: 12px; color: var(--fg-mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctrl .cst { font-family: var(--mono); font-size: 9.5px; padding: 2px 0; border-radius: 3px; text-align: center; }
.ctrl .cst.ok  { background: var(--ok-bg);  color: var(--ok); }
.ctrl .cst.bad { background: var(--bad-bg); color: var(--bad); }
.ctrl .cst.unk { background: var(--unk-bg); color: var(--unk); }
.ctrl .cev { font-family: var(--mono); font-size: 10.5px; color: var(--fg-dim); text-align: right;
             font-variant-numeric: tabular-nums; }

/* ── selection bar ──────────────────────────────────────────────────────────
   Named .selbar, not .picked: ".picked" is already the state a selected ROW
   carries, and `.row.picked` matched both, so the bar's `display:flex` beat the
   row's `display:grid` and every selected row lost its columns. That is the
   second time in this build a component name and a state name collided — the
   rule is that a component root and a state modifier never share a word. */
.selbar {
  min-width: 0; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3);
  height: 34px; background: var(--fg); color: var(--surface);
  font-family: var(--mono); font-size: 11.5px; white-space: nowrap; overflow-x: auto;
}
.selbar b { color: var(--surface); font-weight: 700; }
.selbar b.teal { color: var(--accent-mid); }
.selbar .dot { opacity: .5; }
.selbar .segs { display: inline-flex; width: 110px; height: 7px; border-radius: 4px;
                overflow: hidden; margin-left: var(--s2); }
.selbar .segs i { display: block; height: 100%; }
.selbar .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
/* The bar's ground is --fg, which is near-black in light and near-white in dark.
   A literal white border therefore vanishes in one of the two themes; mixing from
   --surface inverts with the ground the way the text on it already does. */
.selbar .mini {
  background: transparent; color: var(--surface);
  border-color: color-mix(in srgb, var(--surface) 34%, transparent);
}
.selbar .mini:hover {
  background: color-mix(in srgb, var(--surface) 14%, transparent);
  border-color: color-mix(in srgb, var(--surface) 62%, transparent);
  color: var(--surface);
}
.selbar .mini.done { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.selbar .ghost { color: var(--surface); opacity: .75; }
.selbar .ghost:hover { opacity: 1; }

/* ── row pick ──────────────────────────────────────────────────────────────── */
.pick {
  width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--line);
  background: var(--surface); cursor: pointer; padding: 0; flex: none;
  transition: background .1s, border-color .1s;
}
.pick:hover { border-color: var(--fg-dim); }
.pick[aria-checked="true"] { background: var(--fg); border-color: var(--fg); }
.pick[aria-checked="true"]::after {
  content: ""; display: block; width: 3.5px; height: 7px; margin: 0 auto;
  border: solid var(--surface); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg) translate(-1px, -1px);
}
/* A selected row keeps its own text colours and is marked at the edge instead.
   Tinting the whole row put dim greys on a saturated ground — a contrast failure
   that no audit of the resting page can see, because the state only exists after
   a click. States get audited too now. */
.row.picked { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.row.picked .edge { box-shadow: inset 3px 0 0 var(--accent); }
.row.picked .t, .row.picked .num { color: var(--fg); }
.row.picked .t.dim { color: var(--fg-mid); }
.row.picked .t.faint { color: var(--fg-dim); }

/* ── saved views ───────────────────────────────────────────────────────────── */
.pal.views { max-width: 520px; }
.vhead {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: var(--s3) var(--s3) var(--s2); font-family: var(--mono); font-size: 9.5px;
  letter-spacing: .08em; text-transform: uppercase; color: var(--fg-faint);
  border-bottom: 1px solid var(--line-soft);
}
.vhead .vc { font-variant-numeric: tabular-nums; }
.vsave { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: var(--s2); padding: var(--s3); }
.vsave input {
  font-family: var(--sans); font-size: 12.5px; color: var(--fg); padding: 6px 9px;
  border: 1px solid var(--line); border-radius: 5px; background: var(--surface); min-height: 30px;
}
.vsave input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
.vlist { list-style: none; margin: 0; padding: var(--s2) var(--s2) var(--s3); display: flex;
         flex-direction: column; gap: 2px; max-height: 320px; overflow-y: auto; }
.vlist li { display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 2px; align-items: center; }
.vgo {
  display: grid; gap: 2px; text-align: left; padding: 7px 9px; border: 0; border-radius: 5px;
  background: none; font: inherit; color: inherit; cursor: pointer; min-width: 0;
  transition: background .1s;
}
.vgo:hover { background: var(--hover); }
.vgo .vn { font-size: 12.5px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vgo .vd { font-family: var(--mono); font-size: 10px; color: var(--fg-faint);
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vdel {
  width: 24px; height: 24px; border: 0; border-radius: 4px; background: none;
  color: var(--fg-faint); cursor: pointer; font-size: 12px; line-height: 1;
}
.vdel:hover { background: var(--bad-bg); color: var(--bad); }

/* A cap is a statement, not a fade-out: it says how many are missing and where
   they are, because a list that simply stops has lied about being a list. */
.capnote {
  margin: var(--s3) 0 0; padding: 7px 10px; border-radius: 4px;
  background: var(--sunk); border-left: 2px solid var(--fg-faint);
  font-size: 11.5px; line-height: 1.5; color: var(--fg-dim);
}
.capnote b { color: var(--fg); font-weight: 600; }
/* ═══════════════════════════════════════════════════════════════════════════
   SHOALCHECK — the report.

   The same reading as the app, arranged as a document: one self-contained file
   that survives being forwarded, read top to bottom by a stranger who has not
   met this product, and printed.

   Three constraints from the walkthrough of the shipped document, which measured
   it rather than recalled it:

     1. THE FIRST SCREEN IS THE PRODUCT. In the shipped report the first sentence
        about the reader's own cluster began at y=402 of a 757px viewport; 53% of
        that screen was logo, a chip repeating the cluster name, a theme toggle
        and a date. Everything above the first claim is a cost.
     2. CHROME STAYS BEHIND. Its masthead was position:static, so following any
        anchor scrolled the reader past ~370px of the same furniture again. The
        nav is the one piece worth keeping on screen, and it was the piece that
        scrolled away.
     3. ONE NOUN. The same 134 records were called issues, findings, observations
        and issue types — and the cover used "issues", the one word that asserts
        something is wrong. The word is `finding`, everywhere.

   And one the walkthrough could only imply: a document built out of 469 things
   that can be opened has no statements in it, only containers for statements.
   There is no <details> in this file.
   ═══════════════════════════════════════════════════════════════════════════ */

.doc {
  max-width: 1080px; margin: 0 auto; padding: 0 var(--s5) var(--s7);
  background: var(--bg);
}

/* ── cover ─────────────────────────────────────────────────────────────────
   The claims lead. The census — nodes examined, pods counted — is apparatus and
   is set as apparatus, because every scanner on the market prints a census and
   only this one prints "4 nodes cannot be evacuated". */
.cover { padding: var(--s7) 0 var(--s6); border-bottom: 1px solid var(--line); }
.cover .ident {
  display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap;
  font-family: var(--mono); font-size: 11.5px; color: var(--fg-dim);
}
.cover .ident .name { font-size: 15px; font-weight: 600; color: var(--fg); }
.cover .ident .sig { display: inline-flex; align-items: center; gap: 5px; color: var(--ok); }
.cover h1 {
  margin: var(--s5) 0 var(--s3); font-size: 13px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--fg-faint);
}
.claims { display: flex; flex-direction: column; gap: var(--s4); margin: 0 0 var(--s5); }
.claim { display: grid; gap: 3px; }
.claim .c {
  font-size: 25px; font-weight: 600; line-height: 1.22;
  color: var(--fg); text-wrap: balance; max-width: 34ch;
}
.claim .b { font-family: var(--mono); font-size: 11.5px; color: var(--fg-dim); line-height: 1.5; }
/* Apparatus, not body copy — but still a sentence somebody reads, so it is set in
   the text face at a size that can be read, across the measure the page actually
   has rather than a 45-character column in the middle of a 1080px page. */
.apparatus {
  font-family: var(--sans); font-size: 12.5px; color: var(--fg-dim); line-height: 1.6;
  border-top: 1px solid var(--line-soft); padding-top: var(--s3); max-width: 88ch;
}
.apparatus b { color: var(--fg-mid); font-weight: 600; }

/* The first claim leads; the rest support it. Four identical headlines is a list,
   not a finding order, and the opening machinery already ranked them. */
.claims .claim:first-child .c { font-size: 31px; }

/* ── contents: sticky, and the only chrome that persists ──────────────────── */
.toc {
  position: sticky; top: 0; z-index: 30; display: flex; gap: 2px; flex-wrap: wrap;
  padding: var(--s2) 0; margin-bottom: var(--s5);
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.toc a {
  padding: 5px 9px; border-radius: 4px; text-decoration: none;
  font-family: var(--mono); font-size: 11px; color: var(--fg-dim); white-space: nowrap;
}
.toc a:hover { background: var(--hover); color: var(--fg); }
.toc a[aria-current="true"] { background: var(--fg); color: var(--surface); }
.toc .n { color: var(--fg-faint); margin-right: 5px; }
.toc a[aria-current="true"] .n { color: var(--surface); opacity: .65; }

/* ── sections ─────────────────────────────────────────────────────────────── */
.sec { padding-top: var(--s6); scroll-margin-top: 52px; }
.sec > .head { display: flex; align-items: baseline; gap: var(--s3); margin-bottom: var(--s4); }
.sec > .head h2 {
  margin: 0; font-size: 19px; font-weight: 600; color: var(--fg);
}
.sec > .head .num {
  font-family: var(--mono); font-size: 11px; color: var(--fg-faint);
  border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px;
}
.sec > .head .lede { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--fg-dim); }

/* ── §7 the record: one block per rule, because a rule is one decision ────── */
.rec { display: flex; flex-direction: column; gap: var(--s3); }
.dec {
  border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
  box-shadow: var(--shadow-1); overflow: hidden;
}
.dec > .top {
  display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: var(--s3);
  align-items: start; padding: var(--s3);
}
.dec .sv {
  width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 10.5px; font-weight: 700; flex: none;
}
.dec .sv.sv0 { background: var(--sev-0); color: #fff; }
.dec .sv.sv1 { background: var(--sev-1); color: #fff; }
.dec .sv.sv2 { background: var(--sev-2-bg); color: var(--sev-2); }
.dec .sv.sv3 { background: var(--sev-3-bg); color: var(--sev-3); }
.dec .sv.sv4 { background: var(--sev-4-bg); color: var(--sev-4); }
.dec h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; line-height: 1.35; }
.dec .rid { font-family: var(--mono); font-size: 10.5px; color: var(--fg-faint); }
.dec .cnt {
  font-family: var(--mono); font-size: 11px; color: var(--fg-mid); text-align: right;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

/* ── what paper changes ─────────────────────────────────────────────────────
   Three things behave differently on paper because paper cannot be scrolled,
   expanded or hovered.

   NOTHING TRUNCATES. An ellipsis on screen is a promise that the full string is a
   hover or a click away. On paper it is a string nobody can recover, so every
   clipped label wraps instead.

   NOTHING CLIPS. A container with overflow:hidden shows a scrollbar on screen and
   a clean edge on paper, with the text simply gone. Overflow is visible and the
   content wraps.

   NOTHING FALLS UNDER 9pt. Screen sizes between 9 and 12.5px land between 6.75pt
   and 9.4pt when the page scales, and a table nobody can read is a table that
   should not have been printed. The small end is raised rather than the whole
   scale, so the hierarchy survives. */

     card meta line under it — 64 strings that ended in an ellipsis on a page

  .srank .nm, .mbar .mn, .card .cn, .score .sn, .ctrl .ctt, .rl .rn,
  .bind .bpath, .dchip .dn, .dchip .ds, .row .t, .vgo .vn, .vgo .vd,
  .printable [class], .printable [style] {

       element itself, and an inline style beats any selector without it. */

    text-overflow: clip !important;
    white-space: normal !important;
    word-break: break-word;

  .binds, .zloss, .fleet, .pools, .mbars, .sranks, .detached, .reslist, .drawer {
    overflow: visible !important;
  }

     every size below 12px lands under 9pt, which is the floor below which this
     project does not print. Chasing the offenders selector by selector missed
     the ones written inline by the generator and would miss the next one added.

     So paper gets its own scale. The floor is declared once for everything the
     page prints, and the roles that must be larger are declared above it — which
     is how a type scale is supposed to be written, and is what the screen scale
     already does. The chrome is not in this list because print hides it: a rail,
     a facet strip and a cut bar are instruments for narrowing, and paper cannot
     be narrowed. */

     on classes and, for generated markup, on the elements themselves; a print
     rule at lower specificity loses to both, and raising specificity selector by
     selector is how the last three attempts each missed a different set. A print
     stylesheet overriding a screen scale wholesale is the case this keyword is
     for, and it is used here for exactly that and nothing else. */

  .panel > header h2, .printable .panel > header h2 { font-size: 12pt !important; line-height: 1.3 !important; }
