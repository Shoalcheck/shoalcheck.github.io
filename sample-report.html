  var ver = (D.method || {});
  h += panel({
    span: 'c5', title: 'The version this reading saw',
    body: '<div class="figs">' +
      '<div class="fig"><span class="v sm mono" style="font-size:14px">' + esc(D.k8s || '—') + '</span><span class="k">kubernetes</span></div>' +
      '<div class="fig"><span class="v sm mono" style="font-size:14px">' + esc(D.provider || '—') + '</span><span class="k">provider</span></div></div>' +
      '<p class="note">Support dates above are read from a dated reference table embedded in the binary, and the ' +
      'table names its own vintage. A build older than a change in the vendor\'s schedule will say the older thing.</p>',
    basis: 'Nothing here is fetched at run time. The dataset ships with the binary so a reading taken offline ' +
           'says the same as one taken online.'
  });
  return h;
}

/* ── since the last reading ───────────────────────────────────────────────────
   Rendered only when the reading carries a trend block, which means it was taken
   with `--save-history` and a prior snapshot for the same cluster existed.

   The vocabulary here is the schema's and it is deliberate. The engine emits
   `noLongerInSetCount`, not "resolved", because Shoalcheck does not watch a cluster:
   it reads two states some time apart and reports the difference. A finding that
   is absent the second time may have been fixed, or its object deleted, or an
   autoscaler may have moved, or a rule may not have run — and nothing in a
   read-only snapshot can tell those apart. So this panel says "no longer in the
   set" and never "fixed", and it prints the not-evaluated count beside it,
   because a strip claiming three departures while four could not be compared is
   telling half a truth. */
function wsTrend(rows, t) {
  var h = '', tr = D.trend;

  if (!tr) {
    h += panel({
      span: 'c12', title: 'Since the last reading', aside: 'no prior snapshot',
      body: '<p class="note">This reading has nothing to compare against. A comparison appears here once ' +
        'two readings of the same cluster exist:</p>' +
        '<pre class="code">shoalcheck audit --context prod --save-history\n' +
        '# then, after some time has passed:\n' +
        'shoalcheck audit --context prod --save-history   # this one carries the delta</pre>' +
        '<p class="note">History is kept on your machine. Nothing is uploaded, and no reading is sent anywhere ' +
        'to be diffed.</p>',
      basis: 'A comparison is between <b>two readings</b>, not a stream. This product takes a snapshot when ' +
             'you run it and has no view of the cluster in between.'
    });
    return h;
  }

  /* WHICH FINDINGS ARE NEW, not only how many. The count stood alone, and over a real pair of readings
     "13 new in this reading" named none of the thirteen. newIds are the rows' own ids for the fifth gate's
     set difference: the figure cuts the table to all of them, and the list below opens each one. */
  var newIds = tr.newIds || [], newSet = {};
  newIds.forEach(function (id) { newSet[id] = 1; });
  var openNew = newIds.length
    ? ' data-ctrl="' + esc(newIds.join(',')) + '" data-why="new since the last reading"'
    : '';

  var d = function (n, goodWhenDown) {
    if (!n) return '<span class="v sm">0</span>';
    var down = n < 0, good = goodWhenDown ? down : !down;
    return '<span class="v sm ' + (good ? 'ok' : 'bad') + '">' + (n > 0 ? '+' : '') + num(n) + '</span>';
  };

  h += panel({
    span: 'c7', title: 'Since the last reading',
    aside: tr.prevAt ? 'previous reading ' + esc(when(tr.prevAt)) : 'previous reading',
    body: '<div class="figs">' +
      '<div class="fig">' + d(tr.dFind, true) + '<span class="k">findings, net</span></div>' +
      (openNew
        ? '<button class="fig act"' + openNew + '><span class="v sm">' + num(tr.new) + '</span><span class="k">new in this reading</span></button>'
        : '<div class="fig"><span class="v sm">' + num(tr.new) + '</span><span class="k">new in this reading</span></div>') +
      '<div class="fig"><span class="v sm">' + num(tr.gone) + '</span><span class="k">no longer in the set</span></div>' +
      '<div class="fig"><span class="v sm ' + (tr.notEval ? 'unk' : '') + '">' + num(tr.notEval) +
        '</span><span class="k">could not be compared</span></div></div>' +
      (tr.regressed || tr.changed
        ? '<div class="figs" style="margin-top:var(--s3)">' +
          '<div class="fig"><span class="v sm ' + (tr.regressed ? 'bad' : '') + '">' + num(tr.regressed) +
            '</span><span class="k">got worse</span></div>' +
          '<div class="fig"><span class="v sm">' + num(tr.changed) + '</span><span class="k">changed</span></div></div>'
        : '') +
      '<p class="note"><b>“No longer in the set” is not “fixed.”</b> Two readings minutes or weeks apart show a ' +
      'difference between two states; the object may have been deleted, an autoscaler may have acted, or a rule ' +
      'may not have run. This product never claims the cause.</p>',
    basis: (tr.kept ? '<b>' + num(tr.kept) + '</b> ' + noun(tr.kept, 'reading', 'readings') + ' kept on this machine. ' : '') +
           'Comparison runs through five ordered gates so an <b>absence is never reported as a fix</b>: a finding ' +
           'whose basis the other reading could not confirm is counted as not compared, not as resolved.'
  });

  h += panel({
    span: 'c5', title: 'What moved in the money', aside: 'identified, not billed',
    body: '<div class="figs">' +
      /* "$0" FOR THE CHANGE IN IDENTIFIED SPEND READS AS "THE MONEY DID NOT MOVE", and over two readings
         that never had a figure nothing moved because nothing was ever priced. dSaveUnpriced is the
         reading's own answer to which of the two it is — see types.TrendDelta.SavingsUnpriced. */
      '<div class="fig">' + (tr.dSaveUnpriced
        ? '<span class="v sm">unpriced</span>'
        : tr.dSave
          ? '<span class="v ' + (tr.dSave > 0 ? 'bad' : 'ok') + '">' + (tr.dSave > 0 ? '+' : '−') +
            usd(Math.abs(tr.dSave)) + '</span>'
          : '<span class="v sm">$0</span>') +
      '<span class="k">identified / mo, change</span></div></div>' +
      (tr.priceChanged
        ? '<p class="note"><b>Pricing coverage changed between the readings.</b> Part of this movement may be ' +
          'the price table, not the cluster.</p>'
        : '') +
      (tr.refData && tr.refData.length
        ? '<p class="note">Reference data changed: <b>' + esc(tr.refData.join(', ')) + '</b>' +
          (tr.refReason ? ' — ' + esc(tr.refReason) : '') + '</p>'
        : '') +
      (tr.engineNote ? '<p class="note">' + esc(tr.engineNote) + '</p>' : ''),
    basis: 'A change in identified spend is a change in what the rules found at list price. It is not a change ' +
           'in an invoice, and nothing here has been reclaimed.'
  });

  if (newIds.length) {
    var fresh = rows.filter(function (r) { return newSet[r[ID]]; }).sort(function (a, b) {
      return a[SEV] - b[SEV] || (a[TITLE] < b[TITLE] ? -1 : a[TITLE] > b[TITLE] ? 1 : 0);
    });
    h += panel({
      span: 'c12', title: 'New in this reading',
      aside: fresh.length === newIds.length
        ? num(newIds.length) + ' finding' + (newIds.length === 1 ? '' : 's')
        : num(fresh.length) + ' of ' + num(newIds.length) + ' in this cut',
      body: (fresh.length
        ? '<div class="rulelist">' + fresh.slice(0, 12).map(function (r) {
            return '<button class="rl" data-open="' + esc(r[ID]) + '">' +
              '<span class="sv sv' + r[SEV] + '">' + SEVL[r[SEV]] + '</span>' +
              '<span class="rn">' + esc(r[TITLE]) + '</span>' +
              '<span class="rc" style="background:' + catBg(r[CAT]) + '">' + esc(r[CAT]) + '</span>' +
              '<span class="rv"></span><span class="rs"></span>' +
              '<span class="ru">' + usdOrDash(r[USD]) + '</span></button>';
          }).join('') + '</div>'
        : '<p class="note">None of the new findings is in this cut.</p>') +
        '<p class="note">' + (fresh.length > 12 ? '<b>' + num(fresh.length - 12) + '</b> more than the twelve shown. ' : '') +
        '<button class="mini"' + openNew + '>' + (newIds.length === 1 ? 'Open it in Findings' : 'Open all ' + num(newIds.length) + ' in Findings') + '</button></p>',
      basis: '<b>New</b> means the earlier reading read everything a finding rests on and did not report it. ' +
             'One the earlier reading could not have seen is counted as not compared, never as new.'
    });
  }

  if (tr.notCompared) {
    h += panel({
      span: 'c12', title: 'What could not be compared', aside: 'named, not silently dropped',
      body: '<pre class="code">' + esc(JSON.stringify(tr.notCompared, null, 2)) + '</pre>',
      basis: 'Carried verbatim from the reading so the reason a finding fell out of the comparison travels with ' +
             'the number that excludes it.'
    });
  }
  return h;
}

/* ── act: turn a reading into work somebody does ─────────────────────────────
   Every integration on this surface is OUTBOUND-BY-THE-OPERATOR: a file written
   to disk, text placed on the clipboard, a URL the operator's own browser opens.
   Nothing here calls an API, holds a credential or opens a socket.

   That is a design constraint, not a limitation to apologise for. The product's
   load-bearing claim is that the binary contacts no service of ours and makes no
   write anywhere; a live Jira or Linear integration would put a credential and an
   egress path into the one tool whose whole pitch is that it has neither. The
   ticket body is the valuable part, and it costs no network to hand it over. */
function ticketBody(k, g, m) {
  var wheres = [], seen = {}, i;
  for (i = 0; i < g.length; i++) {
    /* A cluster-scoped finding names no namespace and no workload. An em-dash in a
       ticket reads as a rendering bug; "cluster-scoped" is the actual fact, and the
       finding id is what makes the row traceable back to the reading. */
    var lbl = g[i][WL] ? wlLabel(wlId(g[i][WL]))
            : g[i][NS] ? g[i][NS] + ' (namespace)'
            : 'cluster-scoped · f-' + g[i][ID];
    if (!seen[lbl]) { seen[lbl] = 1; wheres.push(lbl); }
  }
  var usd0 = 0, worst = 9;
  for (i = 0; i < g.length; i++) { usd0 += g[i][USD]; if (g[i][SEV] < worst) worst = g[i][SEV]; }

  var L = [];
  L.push(g[0][TITLE]);
  L.push('');
  L.push('Rule: ' + k + '  ·  Severity: ' + SEVN[worst] + '  ·  ' + plural(g.length, 'finding', 'findings'));
  L.push('Cluster: ' + D.cluster + ' (' + whereOf('Kubernetes') + ')');
  L.push('Reading taken: ' + D.at + '  ·  Shoalcheck ' + D.method.engine);
  if (usd0 > 0) L.push('Identified: ' + usd(usd0) + '/mo at dated list price — not a billed figure.');
  L.push('');
  if (m.w) { L.push('WHY IT MATTERS'); L.push(m.w); L.push(''); }
  if (m.e && m.e.length) { L.push('EVIDENCE'); m.e.forEach(function (e) { L.push('  - ' + e); }); L.push(''); }
  L.push('WHERE IT APPLIES (' + wheres.length + ')');
  wheres.slice(0, 40).forEach(function (w) { L.push('  - ' + w); });
  if (wheres.length > 40) L.push('  ... and ' + (wheres.length - 40) + ' more');
  L.push('');
  if (m.b && m.b.length) {
    L.push('WHAT THIS DOES NOT ESTABLISH');
    m.b.forEach(function (b) { L.push('  - ' + b); });
    L.push('');
  }
  /* The engine has a manifest or a command for 54 of 134 findings. A ticket that
     omits it makes the assignee rediscover what the reading already knows. */
  var fix = null;
  for (i = 0; i < g.length; i++) {
    var dd = (D.det || {})[g[i][ID]];
    if (dd && (dd.y || dd.c)) { fix = dd; break; }
  }
  if (fix) {
    L.push('SUGGESTED FIX');
    if (fix.c) { L.push(fix.c); L.push(''); }
    if (fix.y) { L.push(fix.y); L.push(''); }
    L.push(fix.s === 'one-click'
      ? '(every executable line uses a verb on Shoalcheck\u2019s safe allowlist)'
      : '(not classified for one-click use \u2014 read before running)');
    L.push('');
  }
  L.push('Reproduce: shoalcheck audit --context <ctx> && shoalcheck findings --rule ' + k);
  return L.join('\n');
}

/* The operator's tracker is theirs, not ours. It is kept in this browser's own
   storage, never in the document and never sent anywhere; a reading forwarded to
   somebody else carries no trace of it. */
function jiraHost() {
  try { return localStorage.getItem('shoalcheck.jira') || ''; } catch (e) { return ''; }
}
function setJiraHost(v) {
  try { localStorage.setItem('shoalcheck.jira', v); } catch (e) {}
}

function wsAct(rows, t) {
  var h = '', i;

  /* one decision = one ticket */
  var g = {};
  for (i = 0; i < rows.length; i++) (g[rows[i][RULE]] = g[rows[i][RULE]] || []).push(rows[i]);
  var keys = Object.keys(g).sort(function (a, b) {
    var wa = Math.min.apply(null, g[a].map(function (r) { return r[SEV]; }));
    var wb = Math.min.apply(null, g[b].map(function (r) { return r[SEV]; }));
    if (wa !== wb) return wa - wb;
    return g[b].length - g[a].length;
  });

  h += panel({
    span: 'c7', title: 'Raise it as work', aside: 'one rule is one ticket, however many findings it produced',
    body: '<div class="trackercfg"><label for="jirahost">Your Jira host</label>' +
      '<input id="jirahost" type="text" spellcheck="false" placeholder="acme.atlassian.net" ' +
      'value="' + esc(jiraHost()) + '" aria-describedby="jirahostnote">' +
      '<span id="jirahostnote">remembered in this browser only · Linear needs no host</span></div>' +
      '<div class="tickets">' + keys.slice(0, 8).map(function (k) {
      var rs = g[k], worst = Math.min.apply(null, rs.map(function (r) { return r[SEV]; }));
      return '<div class="tk">' +
        '<span class="sv sv' + worst + '">' + SEVL[worst] + '</span>' +
        '<span class="tkn"><b>' + esc(rs[0][TITLE]) + '</b>' +
          '<span class="tkm">' + esc(ruleShort(k)) + ' · ' + plural(rs.length, 'finding', 'findings') + '</span></span>' +
        '<span class="tka">' +
          '<button class="mini" data-tk="copy" data-rule="' + esc(k) + '">Copy</button>' +
          '<button class="mini" data-tk="jira" data-rule="' + esc(k) + '">Jira</button>' +
          '<button class="mini" data-tk="linear" data-rule="' + esc(k) + '">Linear</button>' +
        '</span></div>';
    }).join('') + '</div>' +
      (keys.length > 8 ? '<p class="note">' + num(keys.length - 8) + ' more ' + noun(keys.length - 8, 'rule', 'rules') + ' in this cut — open any finding to raise its rule.</p>' : ''),
    /* WHAT LEAVES, NAMED. This basis used to end "No token is stored and nothing is sent anywhere", which
       the clause before it contradicted: the title and body go into the tracker's URL, and ticketBody()
       puts this cluster's name, its provider and region, every namespace and workload the rule fired on,
       and the evidence lines into that body. Clicking Jira or Linear sends all of it to whoever runs that
       tracker. The document still makes no request — the navigation is the browser's, on the operator's
       click — and that distinction is worth keeping, but it is not the same claim as "nothing is sent". */
    basis: 'Copy places the body on your clipboard and nothing leaves this machine. <b>Jira</b> and ' +
      '<b>Linear</b> are navigations, not requests from this document: your browser opens a new-issue ' +
      'page with the title and body <b>in the URL</b> — the Jira host you enter above, or ' +
      '<b>linear.app</b>. That body carries this cluster’s name, its provider and region, the ' +
      'namespaces and workloads the rule fired on, and the evidence lines, so all of that reaches ' +
      'whoever runs that tracker. No token is stored and no credential is involved. To hand the text over ' +
      'without a third party, use Copy.'
  });

  h += panel({
    span: 'c5', title: 'Take the reading elsewhere',
    body: '<div class="exports">' +
      /* The commands as the binary takes them — each run on a kind cluster before it was printed here, and held
         by TestPrintedCommands_EveryFlagExists. They read the current kube context. */
      [['JSON', 'shoalcheck audit --output report.html --json reading.json', 'The whole reading, schema v1. Every field on this screen came from it.'],
       ['SARIF 2.1.0', 'shoalcheck audit --output report.html --export-sarif reading.sarif', 'For GitHub code scanning and any SARIF viewer. Rule metadata and claim boundaries travel with each result.'],
       ['This reading', 'shoalcheck render --input reading.json --output reading.html', 'This page: one self-contained file that works offline. What you would email.'],
       ['Printable document', 'shoalcheck render --input reading.json --output report.html --linear', 'The same reading top to bottom, print-ready.'],
       ['Evidence pack', 'shoalcheck evidence --input reading.json --out pack/', 'One file per control with what each rests on and what could not be examined.']]
      .map(function (x) {
        return '<div class="ex"><span class="exn">' + esc(x[0]) + '</span>' +
               '<code class="exc">' + esc(x[1]) + '</code>' +
               '<span class="exd">' + esc(x[2]) + '</span></div>';
      }).join('') + '</div>',
    basis: 'Each writes its file and exits <b>0</b>; <b>4</b> means the licence on this machine does not cover it, and <b>1</b> that it could not finish, with the reason.'
  });

  h += panel({
    span: 'c7', title: 'Ask it questions from your assistant', aside: 'MCP · read-only, local',
    /* NO FIGURE THIS READING DID NOT MEASURE. This sentence used to say "one cluster is roughly 712k–1,077k
       tokens" on every reading — a number from one large cluster, printed beside a Method workspace that
       measures this one. */
    body: '<p class="note">A reading is long to paste into a chat. <code>shoalcheck-mcp</code> serves it query-first over stdio, so an assistant asks for the slice it needs.</p>' +
      '<pre class="code" id="mcpcfg">' + esc(
        '{\n' +
        '  "mcpServers": {\n' +
        '    "shoalcheck": {\n' +
        '      "command": "shoalcheck-mcp",\n' +
        '      "args": ["--cluster", "' + (D.cluster || 'cluster') + '"]\n' +
        '    }\n' +
        '  }\n' +
        '}') + '</pre>' +
      '<button class="mini" data-tk="copycfg">Copy config</button>',
    basis: 'The server serves the newest reading this machine has kept of that cluster — <code>shoalcheck audit --output report.html --save-history</code> keeps one. It opens no cluster connection of its own, and a finding it returns carries the same claim boundaries this screen shows.'
  });

  h += panel({
    span: 'c5', title: 'Put it in the pipeline', aside: 'the exit code is the contract',
    body: '<pre class="code">' + esc(
      '- name: Shoalcheck preflight\n' +

/* ── APP DRIVER: rail, facets, drawer, virtualised workbench ─────────────── */
/* ── the workbench (findings) ─────────────────────────────────────────────── */
var COLS = {
  /* n is the narrow window's template and w the columns it leaves out: on a phone the name column was squeezed to
     "Right…" between columns that are all in the drawer one tap away. */
  rules:     { g: '16px 1fr 108px 66px 78px 76px', n: '16px minmax(0,1fr) 66px 76px', w: [2, 4], h: ['', 'Rule', 'Spread', 'Findings', 'Namespaces', '$ / mo'], k: [null,'name','sev','count',null,'usd'] },
  workloads: { g: '16px 1fr 108px 66px 96px 76px', n: '16px minmax(0,1fr) 66px 76px', w: [2, 4], h: ['', 'Workload', 'Severity', 'Findings', 'Owner', '$ / mo'], k: [null,'name','sev','count',null,'usd'] },
  /* the findings lens gains a pick column; the grouped lenses do not, because a
     group is not a thing you raise a ticket about — its findings are */
  findings:  { g: '18px 16px 1fr 172px 128px 76px', n: '18px 16px minmax(0,1fr) 76px', w: [3, 4], h: ['', '', 'Finding', 'Workload', 'Rule', '$ / mo'], k: [null,null,'title',null,null,'usd'] }
};
var NARROW = window.matchMedia ? window.matchMedia('(max-width: 760px)') : null;
function gtc(c) { return NARROW && NARROW.matches ? c.n : c.g; }
function wide(c, i) { return c.w.indexOf(i) >= 0 ? ' wide' : ''; }
/* Crossing the breakpoint redraws the table in the other template, so a rotated phone or a resized window never
   keeps a row shape its head no longer has. */
if (NARROW && NARROW.addEventListener) NARROW.addEventListener('change', function () {
  if (document.getElementById('thead')) { tableHead(); paintRows(); }
});
var view = [], ROWH = 30;

function groupBy(rows, keyOf) {
  var m = new Map();
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], k = keyOf(r) || '(cluster-scoped)';
    var g = m.get(k);
    if (!g) { g = { key: k, n: 0, usd: 0, sev: [0,0,0,0,0], worst: 4, ns: new Set(), wl: new Set(), owners: new Set() }; m.set(k, g); }
    g.n++; g.usd += r[USD]; g.sev[r[SEV]]++;
    if (r[SEV] < g.worst) g.worst = r[SEV];
    if (r[NS]) g.ns.add(r[NS]);
    if (r[WL]) g.wl.add(r[WL]);
    if (r[OWNER]) g.owners.add(r[OWNER]);
  }
  return [...m.values()];
}

function buildTable(rows) {
  if (S.lens === 'findings') {
    var c = rows.slice(), d = S.desc ? -1 : 1, k = S.sort;
    c.sort(function (a, b) {
      var x, y;
      if (k === 'usd') { x = a[USD]; y = b[USD]; } else { x = -a[SEV]; y = -b[SEV]; }
      if (x === y) return a[TITLE].localeCompare(b[TITLE]);
      return d * (x - y);
    });
    view = c;
  } else {
    var gs = groupBy(rows, function (r) { return S.lens === 'rules' ? r[RULE] : r[WL]; });
    var d2 = S.desc ? -1 : 1, kk = S.sort;
    gs.sort(function (a, b) {
      var x, y;
      if (kk === 'usd') { x = a.usd; y = b.usd; }
      else if (kk === 'sev') { x = -a.worst; y = -b.worst; }
      else if (kk === 'name') { return d2 * String(b.key).localeCompare(String(a.key)); }
      else { x = a.n; y = b.n; }
      if (x === y) return String(a.key).localeCompare(String(b.key));
      return d2 * (x - y);
    });
    view = gs;
  }
}

var printing = false;

function wsFindings(rows) {

/* ── the selection bar ───────────────────────────────────────────────────────
   Appears only when something is picked, and every action on it is the operator
   acting: text to a clipboard, a file their browser saves, their own tracker
   opened. Nothing here changes the cluster, and nothing leaves the page. */
function renderPicked() {
  var bar = $('selbar');
  if (!selN) { bar.hidden = true; bar.innerHTML = ''; return; }
  var rows = selRows(), usd0 = 0, sev = [0,0,0,0,0], rules = {}, i;
  for (i = 0; i < rows.length; i++) {

    '<span class="segs">' + sev.map(function (n, k) {
      return n ? '<i style="flex:' + n + ';background:var(--sev-' + k + ')" title="' + n + ' ' + SEVN[k] + '"></i>' : '';
    }).join('') + '</span>' +

      '<button class="mini" data-bulk="tickets">Copy as tickets</button>' +

      '<button class="mini" data-bulk="cut">Keep only these</button>' +
      '<button class="ghost" data-bulk="clear">clear</button>' +
    '</span>';
}

function bulkTickets(rows) {
  var by = {}, i;
  for (i = 0; i < rows.length; i++) (by[rows[i][RULE]] = by[rows[i][RULE]] || []).push(rows[i]);
  return Object.keys(by).map(function (k) {
    return ticketBody(k, by[k], D.rules[k] || {});
  }).join('\n\n' + new Array(60).join('─') + '\n\n');
}

function bulkCSV(rows) {
  /* A CSV a spreadsheet opens: RFC 4180 quoting, and the columns a reviewer sorts
     by rather than every column we happen to hold. */
  var head = ['id','rule','severity','category','namespace','workload','owner',
              'dollars_per_month','effort','confidence','title'];
  function q(v) {
    v = v == null ? '' : String(v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  var EFFN = ['low','medium','high'];
  var out = [head.join(',')];
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    out.push([r[ID], r[RULE], SEVN[r[SEV]], r[CAT], r[NS], r[WL] ? wlLabel(wlId(r[WL])) : '',
              r[OWNER], r[USD] || 0, EFFN[r[EFF]], r[CONF], r[TITLE]].map(q).join(','));
  }
  return out.join('\n');
}

/* ── handing the viewer a file ────────────────────────────────────────────────
   The shipped product is a self-contained HTML file opened from disk, where an
   <a download> works. Inside the artifact viewer it does not: the frame is
   sandboxed and a plain download link is inert, so the button would silently do
   nothing — the worst failure mode a control has.

   So: use the platform's save when a viewer grants it, fall back to the anchor
   otherwise, and if neither can hand over a file, put the CSV on the clipboard
   and say so. A control reports what it actually did. */
var DL = null, dlAsked = false;
function downloads() {
  if (dlAsked) return Promise.resolve(DL);
  dlAsked = true;
  if (!(window.claude && typeof window.claude.use === 'function')) return Promise.resolve(null);
  return window.claude.use('downloads').then(function (d) { DL = d; return d; },
                                             function () { return null; });
}

function saveFile(name, text, mime, btn) {
  function done(label) {
    if (!btn) return;
    var was = btn.textContent;
    btn.textContent = label; btn.classList.add('done');
    setTimeout(function () { btn.textContent = was; btn.classList.remove('done'); }, 1600);
  }
  downloads().then(function (d) {
    if (d) {
      return d.save({ filename: name, data: text }).then(function (r) {
        done(r.status === 'delivered' ? 'Sent' : 'Saved');
      }, function (err) {
        /* declined is the viewer's answer, not an error to route around */
        if (err && err.code === 'declined') { done('Cancelled'); return; }
        anchorOrClipboard();
      });
    }
    anchorOrClipboard();
  });

  function anchorOrClipboard() {
    try {
      var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      done('Saved');
    } catch (e) {
      copyText(text, btn, 'Copied instead');
    }
  }
}

/* ── cut bar ──────────────────────────────────────────────────────────────── */
var X = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function renderCut(rows) {
  var t = tally(rows), chips = '';
  function chip(kind, label) { return '<button class="chip" data-clear="' + kind + '">' + esc(label) + X + '</button>'; }
  if (S.urgent) chips += chip('urgent', 'critical + high');
  if (S.sev !== null) chips += chip('sev', SEVN[S.sev]);
  if (S.cat) chips += chip('cat', S.cat);
  if (S.ns) chips += chip('ns', 'ns ' + S.ns);
  if (S.rule) chips += chip('rule', ruleShort(S.rule));
  if (S.wl) chips += chip('wl', wlLabel(wlId(S.wl)));
  if (S.owner) chips += chip('owner', 'owner ' + S.owner);
  if (S.ids && S.ids.length) chips += chip('ids', num(S.ids.length) + ' ' + idsWhat());
  if (S.eff !== null && S.eff !== undefined) chips += chip('eff', ['low','medium','high'][S.eff] + ' effort');
  if (S.fix) chips += chip('fix', 'has a fix');
  if (S.q) chips += chip('q', '“' + S.q + '”');
  var whole = t.n === ALL.n;
  $('cut').innerHTML =
    '<b>' + num(t.n) + '</b> of ' + plural(ALL.n, 'finding', 'findings') +
    '<span class="dot"> · </span>' + (PRICED ? '<b class="teal">' + usd(t.usd) + '</b> of ' + usd(ALL.usd) : '<b>unpriced</b>') +
    (whole ? '<span class="dot"> · </span>the whole reading' : '') +
    (chips ? '<span class="dot"> · </span>' + chips : '') +
    '<span class="right">' + (whole ? '' : '<button class="chip" data-clear="all">clear all' + X + '</button>') +
    '<span class="kbd">/</span><span>search</span></span>';
}


/* ── the facet strip ──────────────────────────────────────────────────────────
   A facet's count is taken under the cut with that facet's OWN dimension lifted.
   Under the whole reading the number never moves and cannot guide a click; under
   the live cut every sibling reads 0 the moment one is picked. Lifting only the
   dimension being offered is what makes "high 10" mean "10 if you switch to
   high, given everything else you have narrowed" — the number a reader is
   actually deciding with.
   A facet that would yield nothing is drawn, dimmed and inert: on this product an
   absence is a fact about the cluster, and a control that disappears teaches the
   reader that the category was never checked. */
function cutExcept(dim) {
  var q = S.q.toLowerCase(), out = [];
  for (var i = 0; i < R.length; i++) {
    var r = R[i];
    if (dim !== 'sev' && S.urgent && r[SEV] > 1) continue;
    if (dim !== 'sev' && S.sev !== null && r[SEV] !== S.sev) continue;
    if (dim !== 'cat' && S.cat && r[CAT] !== S.cat) continue;
    if (dim !== 'ns'  && S.ns && r[NS] !== S.ns) continue;
    if (S.rule && r[RULE] !== S.rule) continue;
    if (S.wl && r[WL] !== S.wl) continue;
    if (S.owner && r[OWNER] !== S.owner) continue;
    if (q && (r[TITLE]+' '+r[RULE]+' '+r[WL]+' '+r[NS]+' '+r[OWNER]).toLowerCase().indexOf(q) < 0) continue;
    out.push(r);
  }
  return out;
}

function facet(o) {
  var n = o.n | 0, on = !!o.on, empty = n === 0 && !on;
  return '<button class="facet ' + (o.cls || '') + '"' +
    ' data-facet="' + esc(o.dim) + '" data-val="' + esc(o.val) + '"' +
    ' aria-pressed="' + (on ? 'true' : 'false') + '"' +
    (empty ? ' data-empty="1" disabled' : '') +
    ' title="' + esc(o.title || '') + '">' +
    (o.sw === false ? '' : '<span class="sw"></span>') +
    '<span>' + esc(o.label) + '</span><span class="n">' + num(n) + '</span></button>';
}

function renderFacets() {
  var h = '';

  var bySev = tally(cutExcept('sev')).sev;
  h += '<span class="fgroup"><span class="lbl">severity</span>';
  for (var i = 0; i < 5; i++) {
    h += facet({ dim: 'sev', val: i, cls: 's' + i, label: SEVN[i], n: bySev[i],
                 on: S.sev === i,
                 title: SEVN[i] + ' — the rule’s own judgement of consequence, not a score' });
  }
  h += '</span><span class="fsep"></span>';

  var byCat = tally(cutExcept('cat')).cat, cats = Object.keys(ALL.cat).sort();
  h += '<span class="fgroup"><span class="lbl">category</span>';
  for (var c = 0; c < cats.length; c++) {
    h += facet({ dim: 'cat', val: cats[c], cls: cats[c], label: cats[c],
                 n: byCat[cats[c]] || 0, on: S.cat === cats[c] });
  }
  h += '</span><span class="fsep"></span>';

  /* Namespaces are unbounded, so the strip carries the ones this cluster has and
     the count says how many are shown against how many exist. */
  var byNs = tally(cutExcept('ns')).ns;
  var names = Object.keys(ALL.ns).sort(function (a, b) { return (ALL.ns[b] || 0) - (ALL.ns[a] || 0); });
  var shown = names.slice(0, 6);
  h += '<span class="fgroup"><span class="lbl">namespace</span>';
  for (var k = 0; k < shown.length; k++) {
    var nm = shown[k];
    h += facet({ dim: 'ns', val: nm === '(cluster)' ? '' : nm, sw: false, label: nm,
                 n: byNs[nm] || 0, on: (S.ns || '(cluster)') === nm && (S.ns !== null && S.ns !== undefined) });
  }
  if (names.length > shown.length) {
    h += '<span class="facet" data-empty="1" style="cursor:default" title="' +
         esc('open the palette with / to reach any of the ' + names.length) + '">+' +
         (names.length - shown.length) + ' more</span>';
  }
  h += '</span>';

  var EFFN = ['low', 'medium', 'high'];
  var byEff = tally(cutExcept('eff')).eff;
  h += '<span class="fsep"></span><span class="fgroup"><span class="lbl">effort</span>';
  for (var ei = 0; ei < 3; ei++) {
    h += facet({ dim: 'eff', val: ei, sw: false, label: EFFN[ei], n: byEff[ei], on: S.eff === ei,
                 title: 'the rule\'s own estimate of the work, not a measurement' });
  }
  h += '</span>';

  var withFix = tally(cutExcept('fix')).fix;
  h += '<span class="fsep"></span><span class="fgroup">' +
    facet({ dim: 'fix', val: '1', sw: false, label: 'has a fix', n: withFix, on: !!S.fix,
            title: 'carries a manifest or a command from the engine' }) + '</span>';

  var any = S.urgent || S.sev !== null || S.cat || S.ns || S.rule || S.wl || S.owner || S.q ||
            (S.ids && S.ids.length) || S.eff !== null || S.fix;
  if (any) h += '<button class="fclear" data-clear="all">clear the cut' + X + '</button>';
  $('facets').innerHTML = h;
}

/* ── drawer ───────────────────────────────────────────────────────────────── */
// The island stores a pillar as its slug; the reader sees the name the engine is organised under.
var PILLARL = { 'ground-truth': 'Ground Truth', 'change-preflight': 'Change Preflight' };
function openFinding(id) {
  var r = null;
  for (var i = 0; i < R.length; i++) if (R[i][ID] === id) { r = R[i]; break; }
  if (!r) return;
  S.sel = id;
  var m = D.rules[r[RULE]] || {}, d = (D.det || {})[r[ID]] || {};
  var EFFN = ['low', 'medium', 'high'];

  var h = '<h2>' + esc(r[TITLE]) + '</h2>' +
    '<div class="meta"><span class="sv sv' + r[SEV] + '">' + SEVL[r[SEV]] + '</span><span>' + SEVN[r[SEV]] + '</span>' +
    '<span>·</span><span>' + esc(r[CAT]) + '</span>' + (r[PILLAR] ? '<span>·</span><span>' + esc(PILLARL[r[PILLAR]] || r[PILLAR]) + '</span>' : '') +
    '<span>·</span><span>' + usdOrDash(r[USD]) + '/mo</span>' +
    '<span>·</span><span title="the rule’s confidence that this is a problem, not that the read was accurate">' +
      r[CONF] + '% confidence</span>' +
    '<span>·</span><span title="the rule’s own estimate of the work">' + EFFN[r[EFF]] + ' effort</span>' +
    '<span>·</span><span class="mono">f-' + esc(r[ID]) + '</span></div>';

  if (d.d) h += '<div class="sect"><span class="h">What it is</span><p>' + esc(d.d) + '</p></div>';
  if (m.w) h += '<div class="sect"><span class="h">Why it matters</span><p>' + esc(m.w) + '</p></div>';

  /* ── the resources this finding actually names ─────────────────────────────
     Previously the drawer showed one derived "Kind/ns/name" string built from the
     id basis. The reading carries the whole affected set, and for a finding that
     names nine Services, one of them is not the answer. */
  if (d.r && d.r.length) {
    h += '<div class="sect"><span class="h">Affected resources <em>' + num(d.r.length) + '</em></span>' +
      '<div class="reslist">' + d.r.map(function (x) {
        return '<span class="res"><b>' + esc(x.k) + '</b>' + (x.n ? ' <span class="dim">' + esc(x.n) + '/</span>' : ' ') +
               esc(x.m) + '</span>';
      }).join('') + '</div></div>';
  } else if (r[WL]) {
    h += '<div class="sect"><span class="h">Workload</span><p class="mono">' + esc(wlLabel(wlId(r[WL]))) + '</p></div>';
  }
  if (r[OWNER]) h += '<div class="sect"><span class="h">Owner</span><p class="mono">' + esc(r[OWNER]) + '</p></div>';
  if (m.e && m.e.length) h += '<div class="sect"><span class="h">Evidence</span><ul>' +
    m.e.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';

  /* ── remediation ───────────────────────────────────────────────────────────
     The half of an audit that says what to DO, and it had never reached a screen:
     the engine has carried remediationYaml, remediationCommand and a safety
     classification since before this rebuild started. A command is shown with its
     safety verdict attached and never with a one-click "apply", because this
     product's whole claim is that it makes no write anywhere. */
  if (d.c) {
    /* The classification is the engine's, and it means one specific thing:
       `one-click` — every executable line is a verb on the safe allowlist, so a
       copy button may be offered. `by-hand` — at least one line was rejected as
       destructive or unrecognised; the command is still SHOWN, because an operator
       needs to know what the fix is, but it gets no button. The zero value fails
       safe the same way. Inventing friendlier words for these ("safe",
       "disruptive") would be a second copy of a safety policy living in the
       renderer, which is exactly what putting the verdict on the schema prevents. */
    var safety = d.s || '';
    var oneClick = safety === 'one-click';
    var allComments = d.c.split('\n').every(function (l) {
      var t = l.trim(); return t === '' || t.charAt(0) === '#';
    });
    h += '<div class="sect"><span class="h">' + (allComments ? 'How to fix it' : 'Command') + '</span>' +
      '<div class="cmd ' + (oneClick ? 'ok' : 'byhand') + '">' +
      '<code id="cmd-' + esc(r[ID]) + '">' + esc(d.c) + '</code>' +
      (oneClick ? '<button class="mini" data-copy="cmd-' + esc(r[ID]) + '">Copy</button>' : '') +
      '</div>' +
      '<p class="safety ' + (oneClick ? 'ok' : 'byhand') + '">' +
      (allComments
        ? 'Every line here is guidance for you to carry out — there is nothing to execute as written.'
        : oneClick
        ? 'Every executable line uses a verb on this product’s safe allowlist, so it is offered for copying.'
        : safety === 'by-hand'
        ? 'At least one line was refused by the classifier — a destructive verb, or one it does not recognise and cannot vouch for. It is shown so you know the fix, and deliberately given no copy button.'
        : 'Nothing has classified this command, which is treated the same as a refusal: shown, not offered.') +
      ' <b>Shoalcheck never runs it.</b></p></div>';
  }
  if (!d.c && !d.y) {
    h += '<div class="sect"><span class="h">Remediation</span>' +
      '<p class="note">This rule carries no manifest or command. That is a limit of the rule, ' +
      'not a judgement that nothing can be done.</p></div>';
  }

  if (m.b && m.b.length) h += '<div class="sect limits"><span class="h">What this does not establish</span><ul>' +
    m.b.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';

  /* ── how it was derived ── */
  var prov = [];
  if (d.k && d.k.length) prov.push('read from <b>' + esc(d.k.join(', ')) + '</b>');
  if (d.us) prov.push('usage from <b>' + esc(d.us) + '</b>');
  if (d.pb) prov.push('price basis <b>' + esc(d.pb) + '</b>');
  if (d.sk) prov.push('spend kind <b>' + esc(d.sk) + '</b>');
  if (m.v) prov.push('rule version <b>' + esc(m.v) + '</b>');
  h += '<div class="sect"><span class="h">Rule</span><p class="mono">' + esc(r[RULE]) + '</p>' +
    (prov.length ? '<p class="note">' + prov.join(' · ') + '</p>' : '') +
    '<div style="display:flex;gap:var(--s2);flex-wrap:wrap">' +
    '<button class="chip" data-f="rule" data-v="' + esc(r[RULE]) + '">all findings from this rule</button>' +
    (r[WL] ? '<button class="chip" data-f="wl" data-v="' + esc(r[WL]) + '">all findings on this workload</button>' : '') +
    '<button class="chip" data-tk="copy" data-rule="' + esc(r[RULE]) + '">copy as a ticket</button>' +
    '</div></div>';

  /* ── which controls this finding is evidence for ── */
  var ctrls = (D.controls || []).filter(function (c) { return (c.ids || []).indexOf(r[ID]) >= 0; });
  if (ctrls.length) {
    h += '<div class="sect"><span class="h">Named by ' + plural(ctrls.length, 'control', 'controls') + '</span><ul>' +
      ctrls.map(function (c) {
        return '<li><span class="mono">' + esc(c.f + ' ' + c.c) + '</span> — ' + esc(c.t) + '</li>';
      }).join('') + '</ul></div>';
  }

  $('drawer-in').innerHTML = h;
  var dr = $('drawer');
  dr.hidden = false;
  dr.animate([{ transform: 'translateX(16px)', opacity: 0 }, { transform: 'none', opacity: 1 }],
             { duration: 180, easing: 'cubic-bezier(.16,1,.3,1)' });
  paintRows();
}

function closeDrawer() { $('drawer').hidden = true; S.sel = null; paintRows(); }

/* ── render ───────────────────────────────────────────────────────────────── */
/* Thirteen workspaces in four bands. The bands are the reader's question, not our
   architecture: what is true of this cluster · how to slice the same mass · what
   to do next · why any of it should be believed. */
var WS = [
  ['@',          'The reading',  ''],
  ['overview',   'Overview',     'what is here, and what to do first'],
  ['blast',      'Blast radius', 'what stops if a node or zone goes'],
  ['cost',       'Cost',         'where the money is'],
  ['access',     'Access',       'who can do what'],
  ['topology',   'Topology',     'how traffic reaches what'],
  ['compliance', 'Compliance',   'what an auditor asks'],
  ['obligations','Obligations',  'everything with a date on it'],
  ['trend',      'Since last',    'what moved between two readings'],
  ['@',          'Slice it',     ''],
  ['findings',   'Findings',     'triage the whole set'],
  ['rules',      'Rules',        'what was checked, and what found nothing'],
  ['workloads',  'Workloads',    'one card per thing an engineer owns'],
  ['namespaces', 'Namespaces',   'one scorecard per thing a team owns'],
  ['@',          'Act on it',    ''],
  ['act',        'Export & act', 'tickets, exports, MCP, CI'],
  ['@',          'Trust it',     ''],
  ['method',     'Method',       'what it read, and what it refuses to establish']
];
var ICON = {
  overview:'<path d="M3 12h4l3 8 4-16 3 8h4"/>',
  blast:'<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/>',
  cost:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',
  access:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/>',
  topology:'<circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M5 8v3h14V8M12 11v5"/>',
  compliance:'<path d="M9 11l2 2 4-4"/><path d="M4 5h16v14H4z"/>',
  findings:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  method:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  obligations:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v5h-5"/>',
  rules:'<path d="M4 5h16M4 5v14M4 19h16M9 9h7M9 13h7"/>',
  workloads:'<path d="M3 4h8v7H3zM13 4h8v7h-8zM3 13h8v7H3zM13 13h8v7h-8z"/>',
  namespaces:'<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/>',
  act:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};

function renderRail(rows) {
  var t = tally(rows);
  var nWl = Object.keys(t.wl).length, nNs = Object.keys(t.ns).length, nRule = Object.keys(t.rule).length;
  $('rail').innerHTML = WS.map(function (w) {
    if (w[0] === '@') return '<div class="cap">' + esc(w[1]) + '</div>';
    var n = w[0] === 'findings' ? num(t.n) : w[0] === 'access' ? num((D.rbac || []).length)
          : w[0] === 'blast' ? num((D.azs || []).length) : w[0] === 'cost' ? num((D.pools || []).length)
          : w[0] === 'compliance' ? num((D.score || {}).total || 0)
          : w[0] === 'obligations' ? num((D.calendar || []).length)
          /* What moved, not the net: a week in which one finding arrived and one went printed "0" beside a
             workspace showing both. */
          : w[0] === 'trend' ? (D.trend ? num((D.trend.new || 0) + (D.trend.gone || 0)) : '')
          : w[0] === 'rules' ? num(nRule) : w[0] === 'workloads' ? num(nWl)
          : w[0] === 'namespaces' ? num(nNs) : '';
    return '<button class="ws" data-ws="' + w[0] + '"' + (S.ws === w[0] ? ' aria-current="page"' : '') + ' title="' + esc(w[2]) + '">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + ICON[w[0]] + '</svg>' +
      '<span>' + w[1] + '</span><span class="n">' + n + '</span></button>';
  }).join('');
}

/* ── undo ─────────────────────────────────────────────────────────────────────
   Every narrowing is one click and every widening used to be a hunt for which
   chip to clear. The cut is small and cheap to copy, so each change pushes the
   previous one and ⌘Z / Ctrl+Z pops it. Bounded at 40: this is an undo for a
   filter, not a document. */
/* ── selection ────────────────────────────────────────────────────────────────
   Narrowing answers "which of these", and selection answers "these specific
   ones" — a reviewer picking eleven findings out of a rule's forty is not
   expressing a filter. Selection is kept apart from the cut for that reason: it
   survives a filter change, and clearing the cut does not clear it. */
var SEL = Object.create(null), selN = 0;
function selHas(id) { return !!SEL[id]; }
function selToggle(id) { if (SEL[id]) { delete SEL[id]; selN--; } else { SEL[id] = 1; selN++; } }
function selClear() { SEL = Object.create(null); selN = 0; }
function selRows() {
  var out = [];
  for (var i = 0; i < R.length; i++) if (SEL[R[i][ID]]) out.push(R[i]);
  return out;
}

var CUTKEYS = ['urgent','sev','cat','ns','rule','wl','owner','q','ids','eff','fix'];
var cutPast = [], cutSuppress = false, lastPick = null;
function snapCut() {
  var o = {}; CUTKEYS.forEach(function (k) { o[k] = S[k]; });
  return JSON.stringify(o);
}
function pushCut() {
  if (cutSuppress) return;
  var now = snapCut();
  if (cutPast.length && cutPast[cutPast.length - 1] === now) return;
  cutPast.push(now);
  if (cutPast.length > 40) cutPast.shift();
}
function undoCut() {
  if (cutPast.length < 2) return false;
  cutPast.pop();                          // the state we are leaving
  var prev = JSON.parse(cutPast[cutPast.length - 1]);
  cutSuppress = true;
  CUTKEYS.forEach(function (k) { S[k] = prev[k]; });
  cutSuppress = false;
  return true;
}

var wsOrder = {}; (function () {
  var k = 0; for (var i = 0; i < WS.length; i++) if (WS[i][0] !== '@') wsOrder[WS[i][0]] = k++;
})();
var lastWs = null;

function render() {
  pushCut();
  var rows = cut(), t = tally(rows);
  renderRail(rows);
  var c = $('canvas');
  /* Direction of travel, not decoration: going down the rail moves content up. */
  var dir = lastWs === null || lastWs === S.ws ? null
          : (wsOrder[S.ws] > wsOrder[lastWs] ? 'enter-down' : 'enter-up');
  c.classList.remove('enter-down', 'enter-up');
  if (dir) { void c.offsetWidth; c.classList.add(dir); }
  lastWs = S.ws;
  if (S.ws === 'findings') {
    c.innerHTML = wsFindings(rows);
    buildTable(rows);
    $('spacer').style.height = (view.length * ROWH) + 'px';
    tableHead(); paintRows();
    $('scroll').addEventListener('scroll', paintRows, { passive: true });
    var qi = $('q'), qt;
    qi.addEventListener('input', function (e) {
      clearTimeout(qt); qt = setTimeout(function () { S.q = e.target.value.trim(); render(); setTimeout(function () { var n = $('q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 0); }, 110);
    });
  } else {
    var fn = { overview: wsOverview, blast: wsBlast, cost: wsCost, access: wsAccess,
               topology: wsTopology, compliance: wsCompliance, method: wsMethod,
               obligations: wsObligations, trend: wsTrend, rules: wsRules, workloads: wsWorkloads,
               namespaces: wsNamespaces, act: wsAct }[S.ws] || wsOverview;
    c.innerHTML = '<div class="grid">' + fn(rows, t) + '</div>';
    wireGraph(c);
    // Panels arrive: 8px rise + fade, staggered 26ms, capped at six. Two animated
    // things in this product and this is one of them.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      [].slice.call(c.querySelectorAll('.panel')).slice(0, 6).forEach(function (p, i) {
        p.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }],
                  { duration: 200, delay: i * 26, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' });
      });
    }
  }
  renderCut(rows);
  renderFacets();
  renderPicked();
  syncHash();
}

/* ── events ───────────────────────────────────────────────────────────────── */
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'jirahost') setJiraHost(e.target.value.trim());
});

document.addEventListener('click', function (e) {
  var t = e.target;
  var ws = t.closest('[data-ws]');
  if (ws) { S.ws = ws.dataset.ws; closeDrawer(); render(); return; }

  /* A facet toggles: clicking the one that is already on lifts it, so the strip
     never becomes a trap the reader has to find a separate control to escape. */
  var fac = t.closest('[data-facet]');
  if (fac && !fac.disabled) {
    var dim = fac.dataset.facet, raw = fac.dataset.val;
    if (dim === 'sev') { var iv = +raw; S.sev = (S.sev === iv ? null : iv); S.urgent = false; }
    else if (dim === 'cat') { S.cat = (S.cat === raw ? null : raw); }
    else if (dim === 'ns')  { S.ns  = (S.ns  === raw ? null : raw); }
    else if (dim === 'eff') { var ev = +raw; S.eff = (S.eff === ev ? null : ev); }
    else if (dim === 'fix') { S.fix = !S.fix; }
    closeDrawer(); render(); return;
  }

  /* Everything here is the operator acting, not this document acting: text onto
     their clipboard, or their browser opening their tracker. No token is held and
     no request leaves from here — the product's zero-egress claim is load-bearing
     and a convenience feature does not get to spend it. */
  var bk = t.closest('[data-bulk]');
  if (bk) {
    var act2 = bk.dataset.bulk, picked = selRows();
    if (act2 === 'clear') { selClear(); lastPick = null; paintRows(); renderPicked(); return; }
    if (!picked.length) return;
    if (act2 === 'tickets') { copyText(bulkTickets(picked), bk, 'Copied'); return; }
    if (act2 === 'ids') { copyText(picked.map(function (r) { return 'f-' + r[ID]; }).join('\n'), bk, 'Copied'); return; }
    if (act2 === 'csv') {
      saveFile((D.cluster || 'reading') + '-selected.csv', bulkCSV(picked), 'text/csv', bk);
      return;
    }
    if (act2 === 'cut') {
      S.ids = picked.map(function (r) { return r[ID]; }); S.idsWhy = 'picked by hand';
      S.ws = 'findings'; S.lens = 'findings';
      closeDrawer(); render(); return;
    }
  }

  var cp = t.closest('[data-copy]');
  if (cp) {
    var src = $(cp.dataset.copy);
    if (src) copyText(src.textContent, cp, 'Copied');
    return;
  }

  var tk = t.closest('[data-tk]');
  if (tk) {
    var act = tk.dataset.tk;
    if (act === 'copycfg') {
      copyText($('mcpcfg').textContent, tk, 'Copied');
      return;
    }
    var rk = tk.dataset.rule, grp = [], ri;
    for (ri = 0; ri < R.length; ri++) if (R[ri][RULE] === rk) grp.push(R[ri]);
    if (!grp.length) return;
    var body = ticketBody(rk, grp, D.rules[rk] || {});
    var title = grp[0][TITLE] + ' (' + grp.length + ' finding' + (grp.length > 1 ? 's' : '') + ')';
    if (act === 'copy') { copyText(body, tk, 'Copied'); return; }
    if (act === 'jira') {
      var host = (jiraHost() || '').replace(/^https?:\/\//, '').replace(/\/+$/, '');
      if (!host) {
        var inp = $('jirahost');
        if (inp) { inp.focus(); inp.classList.add('needed');
                   setTimeout(function () { inp.classList.remove('needed'); }, 1600); }
        return;
      }
      open('https://' + host + '/secure/CreateIssueDetails!init.jspa?summary=' +
           encodeURIComponent(title) + '&description=' + encodeURIComponent(body), '_blank', 'noopener');
      return;
    }
    if (act === 'linear') {
      open('https://linear.app/new?title=' + encodeURIComponent(title) +
           '&description=' + encodeURIComponent(body), '_blank', 'noopener');
      return;
    }
  }

  /* A control's evidence is a set of finding ids, so selecting it is a cut by id
     rather than by any of the dimensions the facet strip carries. The findings new
     since the last reading are the same kind of cut, and say which with data-why. */
  var ct = t.closest('[data-ctrl]');
  if (ct) {
    var ids = String(ct.dataset.ctrl || '').split(',').filter(Boolean);
    if (!ids.length) return;
    S.ids = ids; S.idsWhy = ct.dataset.why || null; S.ws = 'findings'; S.lens = 'findings';
    closeDrawer(); render(); return;
  }

  /* A finding named outside the table — the new ones under "Since the last reading" —
     opens the same drawer a row does. */
  var op = t.closest('[data-open]');
  if (op) { openFinding(op.dataset.open); return; }

  var rs = t.closest('[data-rsort]');
  if (rs) {
    var col = rs.dataset.rsort;
    if (S.ruleSort === col) S.ruleDesc = S.ruleDesc === false;
    else { S.ruleSort = col; S.ruleDesc = true; }
    render(); return;
  }

  var lens = t.closest('[data-lens]');
  if (lens) { S.lens = lens.dataset.lens; S.sort = S.lens === 'findings' ? 'sev' : 'count'; S.desc = true; render(); return; }

  var sort = t.closest('[data-sort]');
  if (sort) { var k = sort.dataset.sort; if (S.sort === k) S.desc = !S.desc; else { S.sort = k; S.desc = true; }
              buildTable(cut()); tableHead(); paintRows(); return; }

  var pk = t.closest('[data-pick]');
  if (pk) {
    var pid = pk.dataset.pick;
    /* Shift extends from the last pick through the row clicked, in the order the
       table is currently sorted — which is the order the reader can see. */
    if (e.shiftKey && lastPick) {
      var a = view.indexOf(view.filter(function (x) { return x[ID] === lastPick; })[0]);
      var b = view.indexOf(view.filter(function (x) { return x[ID] === pid; })[0]);
      if (a >= 0 && b >= 0) {
        var lo = Math.min(a, b), hi = Math.max(a, b), want = !selHas(pid);
        for (var q = lo; q <= hi; q++) {
          var rid = view[q][ID];
          if (want && !selHas(rid)) selToggle(rid);
          else if (!want && selHas(rid)) selToggle(rid);
        }
      }
    } else selToggle(pid);
    lastPick = pid;
    paintRows(); renderPicked();
    e.preventDefault(); e.stopPropagation();
    return;
  }

  var row = t.closest('.row');
  if (row) {
    if (row.dataset.id) { openFinding(row.dataset.id); return; }
    var k2 = row.dataset.key;
    if (S.lens === 'rules') S.rule = k2; else S.wl = (k2 === '(cluster-scoped)' ? '' : k2);
    S.lens = 'findings'; S.sort = 'sev'; render(); return;
  }

  var f = t.closest('[data-f]');
  if (f) {
    var kind = f.dataset.f, v = f.dataset.v;
    if (kind === 'sev') S.sev = (String(S.sev) === v) ? null : +v;
    else if (kind === 'urgent') { S.urgent = !S.urgent; S.sev = null; }
    else if (kind === 'ns') S.ns = (S.ns === v) ? null : v;
    else if (kind === 'cat') S.cat = (S.cat === v) ? null : v;
    else if (kind === 'rule') { S.rule = (S.rule === v) ? null : v; if (S.rule) { S.ws = 'findings'; S.lens = 'findings'; } }
    else if (kind === 'wl') { S.wl = (S.wl === v) ? null : v; if (S.wl) { S.ws = 'findings'; S.lens = 'findings'; } }
    else if (kind === 'owner') S.owner = (S.owner === v) ? null : v;
    else if (kind === 'q') { S.q = v; S.ws = 'findings'; S.lens = 'findings'; }
    else if (kind === 'catsev') { var cv = v.split('|'); S.cat = cv[0]; S.sev = +cv[1]; S.urgent = false; }
    else if (kind === 'nscat') { var p = v.split('|'); S.ns = p[0] === '(cluster)' ? '' : p[0]; S.cat = p[1]; S.ws = 'findings'; S.lens = 'findings'; }
    closeDrawer(); render(); return;
  }

  var cl = t.closest('[data-clear]');
  if (cl) {
    var w = cl.dataset.clear;
    if (w === 'all') { S.urgent = false; S.sev = S.cat = S.ns = S.rule = S.wl = S.owner = null; S.q = ''; S.ids = S.idsWhy = null; S.eff = null; S.fix = false; }
    else if (w === 'urgent') S.urgent = false;
    else if (w === 'sev') S.sev = null;
    else if (w === 'q') S.q = '';
    else if (w === 'ids') S.ids = S.idsWhy = null;
    else if (w === 'eff') S.eff = null;
    else if (w === 'fix') S.fix = false;
    else S[w] = null;
    render(); return;
  }

  if (t.closest('#close-drawer')) { closeDrawer(); return; }
  if (t.closest('#theme')) {
    var root = document.documentElement, now = root.getAttribute('data-theme');
    var dark = now ? now === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('shoalcheck-theme', dark ? 'light' : 'dark'); } catch (x) {}
    /* Colours picked by measurement are inlined at render time, so they belong to
       the theme that was current when they were picked. Drop the resolved tokens
       and repaint, or the heat cells keep the previous theme's foreground and the
       contrast that was just computed for them stops being true. */
    TOKRGB = {};
    var keepWs = S.ws; lastWs = keepWs; render();
    return;
  }
  if (t.closest('#open-pal')) { openPal(); return; }
  if (t.closest('#open-views')) { openViews(); return; }
});

function copyText(text, btn, label) {
  var done = function () {
    if (!btn) return;
    var was = btn.textContent;
    btn.textContent = label; btn.classList.add('done');
    setTimeout(function () { btn.textContent = was; btn.classList.remove('done'); }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

/* ── saved views ──────────────────────────────────────────────────────────────
   A cut is an argument someone made — "critical and high, in payments, that carry
   a fix" — and an argument you cannot hand to somebody else has to be rebuilt by
   hand at the other end. So a view is two things at once:

     · the URL hash, always, so the address bar IS the view and a link reproduces
       it exactly. This works in the shipped self-contained file too: it is one
       document, so a colleague opening the same file at the same fragment lands
       on the same cut.
     · a named entry in this browser's storage, for the handful a person returns
       to. Names are theirs; the state is the same serialization.

   Only the cut travels. The selection does not: it names specific finding ids
   from one person's triage pass, and restoring it in someone else's window would
   put their name on a judgement they never made. */
var VKEYS = ['urgent','sev','cat','ns','rule','wl','owner','q','ids','idsWhy','eff','fix','ws','lens'];

function viewEncode() {
  var o = {};
  VKEYS.forEach(function (k) {
    var v = S[k];
    if (v === null || v === undefined || v === false || v === '') return;
    if (k === 'ws' && v === 'overview') return;
    if (k === 'lens' && v === 'rules') return;
    o[k] = v;
  });
  if (!Object.keys(o).length) return '';
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/, ''); }
  catch (e) { return ''; }
}
function viewApply(code) {
  var o;
  try { o = JSON.parse(decodeURIComponent(escape(atob(code)))); } catch (e) { return false; }
  if (!o || typeof o !== 'object') return false;
  /* Reset every dimension first: applying a view must produce the view, not the
     view merged with whatever the reader had narrowed to before. */
  S.urgent = false; S.sev = S.cat = S.ns = S.rule = S.wl = S.owner = S.ids = S.idsWhy = S.eff = null;
  S.q = ''; S.fix = false;
  VKEYS.forEach(function (k) { if (o[k] !== undefined) S[k] = o[k]; });
  if (o.ws === undefined) S.ws = 'overview';
  return true;
}

var hashSelf = false;
function syncHash() {
  var code = viewEncode();
  var want = code ? '#v=' + code : '';
  if (location.hash === want) return;
  hashSelf = true;
  try { history.replaceState(null, '', location.pathname + location.search + want); }
  catch (e) { location.hash = want; }
  setTimeout(function () { hashSelf = false; }, 0);
}
addEventListener('hashchange', function () {
  if (hashSelf) return;
  var m = /^#v=(.+)$/.exec(location.hash);
  if (m && viewApply(m[1])) { closeDrawer(); render(); }
  else if (!location.hash) { S.ids = null; render(); }
});

function savedViews() {
  try { return JSON.parse(localStorage.getItem('shoalcheck.views') || '[]'); } catch (e) { return []; }
}
function putViews(v) { try { localStorage.setItem('shoalcheck.views', JSON.stringify(v.slice(0, 30))); } catch (e) {} }

function describeCut() {
  var bits = [];
  if (S.urgent) bits.push('critical + high');
  if (S.sev !== null && S.sev !== undefined) bits.push(SEVN[S.sev]);
  if (S.cat) bits.push(S.cat);
  if (S.ns) bits.push('ns ' + S.ns);
  if (S.rule) bits.push(ruleShort(S.rule));
  if (S.wl) bits.push(wlLabel(wlId(S.wl)));
  if (S.eff !== null && S.eff !== undefined) bits.push(['low','medium','high'][S.eff] + ' effort');
  if (S.fix) bits.push('has a fix');
  if (S.ids && S.ids.length) bits.push(num(S.ids.length) + ' ' + idsWhat());
  if (S.q) bits.push('“' + S.q + '”');
  return bits.length ? bits.join(' · ') : 'the whole reading';
}

function openViews() {
  var list = savedViews(), code = viewEncode();
  var wrap = document.createElement('div');
  wrap.className = 'pal-bg';
  wrap.innerHTML =
    '<div class="pal views" role="dialog" aria-label="Saved views">' +
      '<div class="vhead"><span>Save this view</span></div>' +
      '<div class="vsave">' +
        '<input id="vname" type="text" placeholder="' + esc(describeCut()) + '" ' +
          'aria-label="name for this view" maxlength="60" spellcheck="false">' +
        '<button class="mini" id="vadd">Save</button>' +
        '<button class="mini" id="vlink">Copy link</button>' +
      '</div>' +
      '<div class="vhead"><span>Saved</span><span class="vc">' + list.length + '</span></div>' +
      (list.length
        ? '<ul class="vlist">' + list.map(function (v, i) {
            return '<li><button class="vgo" data-vi="' + i + '">' +
              '<span class="vn">' + esc(v.n) + '</span>' +
              '<span class="vd">' + esc(v.d) + '</span></button>' +
              '<button class="vdel" data-vd="' + i + '" aria-label="delete this view">✕</button></li>';
          }).join('') + '</ul>'
        : '<p class="note" style="padding:0 var(--s3) var(--s3)">No saved view yet. The current cut is ' +
          'already in this page’s address — a link reproduces it without saving anything.</p>') +
    '</div>';
  document.body.appendChild(wrap);
  var name = wrap.querySelector('#vname');
  name.focus();

  function close() { wrap.remove(); }
  wrap.addEventListener('click', function (e) {
    if (e.target === wrap) return close();
    var go = e.target.closest('[data-vi]');
    if (go) {
      var v = savedViews()[+go.dataset.vi];
      if (v && viewApply(v.c)) { close(); closeDrawer(); render(); }
      return;
    }
    var del = e.target.closest('[data-vd]');
    if (del) {
      var all = savedViews(); all.splice(+del.dataset.vd, 1); putViews(all);
      close(); openViews(); return;
    }
    if (e.target.closest('#vadd')) {
      var n = (name.value || '').trim() || describeCut();
      var all2 = savedViews();
      all2.unshift({ n: n, d: describeCut(), c: code });
      putViews(all2); close(); openViews(); return;
    }
    if (e.target.closest('#vlink')) {
      syncHash();
      copyText(location.href, e.target.closest('#vlink'), 'Copied');
      return;
    }
  });
  wrap.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
    if (e.key === 'Enter' && document.activeElement === name) wrap.querySelector('#vadd').click();
  });
}

/* ── command palette ──────────────────────────────────────────────────────── */
var pal = null;
function openPal() {
  if (pal) return;
  pal = document.createElement('div'); pal.className = 'pal-bg';
  pal.innerHTML = '<div class="pal" role="dialog" aria-label="Search"><input placeholder="a rule, a workload, a namespace, a team, a workspace…" spellcheck="false">' +
    '<ul></ul><div class="hint"><span><span class="kbd">↑↓</span> move</span><span><span class="kbd">⏎</span> open</span><span><span class="kbd">esc</span> close</span></div></div>';
  document.body.appendChild(pal);
  var inp = el('input', pal), ul = el('ul', pal), idx = 0, items = [];
  function build() {
    var q = inp.value.trim().toLowerCase(), out = [];
    WS.forEach(function (w) { out.push(['workspace', w[1], w[0], 0]); });
    Object.keys(ALL.rule).forEach(function (k) { out.push(['rule', ruleShort(k), k, ALL.rule[k]]); });
    Object.keys(ALL.wl).forEach(function (k) { out.push(['workload', wlLabel(wlId(k)), k, ALL.wl[k]]); });
    Object.keys(ALL.ns).forEach(function (k) { out.push(['namespace', k, k, ALL.ns[k]]); });
    Object.keys(ALL.owner).forEach(function (k) { out.push(['team', k, k, ALL.owner[k]]); });
    if (q) out = out.filter(function (o) { return (o[1] + ' ' + o[0]).toLowerCase().indexOf(q) >= 0; });
    out.sort(function (a, b) { return b[3] - a[3]; });
    items = out.slice(0, 50); idx = 0; paint();
  }
  function paint() {
    ul.innerHTML = items.map(function (o, i) {
      return '<li' + (i === idx ? ' aria-selected="true"' : '') + ' data-i="' + i + '"><span>' + esc(o[1]) + '</span>' +
        '<span class="s">' + o[0] + (o[3] ? ' · ' + num(o[3]) : '') + '</span></li>'; }).join('') ||
      '<li><span class="s">no match</span></li>';
  }
  function choose() {
    var o = items[idx]; if (!o) return;
    S.rule = S.wl = S.ns = S.owner = null;
    if (o[0] === 'workspace') S.ws = o[2];
    else if (o[0] === 'rule') { S.rule = o[2]; S.ws = 'findings'; S.lens = 'findings'; }
    else if (o[0] === 'workload') { S.wl = o[2]; S.ws = 'findings'; S.lens = 'findings'; }
    else if (o[0] === 'namespace') { S.ns = o[2] === '(cluster)' ? '' : o[2]; S.ws = 'overview'; }
    else { S.owner = o[2]; S.ws = 'findings'; S.lens = 'findings'; }
    close(); render();
  }
  function close() { if (pal) { pal.remove(); pal = null; } }
  inp.addEventListener('input', build);
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { idx = Math.min(items.length - 1, idx + 1); paint(); scrollSel(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { idx = Math.max(0, idx - 1); paint(); scrollSel(); e.preventDefault(); }
    else if (e.key === 'Enter') choose();
    else if (e.key === 'Escape') close();
  });
  function scrollSel() { var n = ul.children[idx]; if (n) n.scrollIntoView({ block: 'nearest' }); }
  ul.addEventListener('click', function (e) { var li = e.target.closest('li'); if (li && li.dataset.i != null) { idx = +li.dataset.i; choose(); } });
  pal.addEventListener('click', function (e) { if (e.target === pal) close(); });
  build(); inp.focus();
}

document.addEventListener('keydown', function (e) {
  var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); openPal(); return; }
  if (e.key === '/' && !typing) { e.preventDefault(); openPal(); return; }
  /* Escape unwinds one layer at a time, outermost first: the palette, then the
     drawer, then a pinned graph. A key that clears everything at once loses the
     reader's place. */
  if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); openViews(); return; }
  if ((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')) {
    if (undoCut()) { e.preventDefault(); closeDrawer(); render(); }
    return;
  }

  if (e.key === 'Escape') {
    if (pal) { pal.remove(); pal = null; }
    else if (!$('drawer').hidden) closeDrawer();
    else resetGraphs();
    return;
  }
  if (typing) return;
  var i = '12345678'.indexOf(e.key);
  var real = WS.filter(function (w) { return w[0] !== '@'; });
  if (i >= 0 && real[i]) { S.ws = real[i][0]; closeDrawer(); render(); }
});

/* Print renders the whole current table rather than the twenty-eight rows the
   viewport holds — a virtualised table sent to a printer produces a page that
   looks exactly like a table and is a window onto one, silently. */
window.addEventListener('beforeprint', function () {
  if (S.ws !== 'findings') return;
  printing = true;
  var out = ''; for (var i = 0; i < view.length; i++) out += rowHTML(view[i]);
  $('rows').style.transform = 'none'; $('rows').innerHTML = out;
});
window.addEventListener('afterprint', function () { printing = false; paintRows(); });

/* ── printing ─────────────────────────────────────────────────────────────────
   ON PAPER THE DOCUMENT IS THE WHOLE READING, NOT THE OPEN TAB.

   The instrument shows one workspace at a time because a reader operates one
   question at a time. Paper has no tabs: whoever is handed the printout gets
   whichever workspace happened to be open when somebody pressed print, and the
   twelve they did not open are simply not in the file they are holding. That is
   a document that looks complete and is not.

   So print builds the whole thing: every workspace, in rail order, each under its
   own name, preceded by the statement of what this is a cut of — because a
   printed page cannot show a facet strip, and a reader holding a narrowed reading
   must be told it is narrowed. It is torn down afterwards, so the screen is
   untouched and nothing is left behind to drift. */
function buildPrintable() {
  var host = $('printable');
  if (!host) return;
  var rows = cut(), t = tally(rows);

  var head =
    '<div class="pr-head">' +
      '<div class="pr-id"><b>' + esc(D.cluster) + '</b> · ' + esc(whereOf('Kubernetes')) + ' · ' + esc(when(D.at)) + '</div>' +
      '<div class="pr-cut">' + num(t.n) + ' of ' + plural(ALL.n, 'finding', 'findings') + ' · ' +
        (PRICED ? usd(t.usd) + ' of ' + usd(ALL.usd) + ' identified' : 'unpriced') + ' · ' +
        (t.n === ALL.n ? 'the whole reading' : esc(describeCut())) + '</div>' +
    '</div>';

  var body = '';
  for (var i = 0; i < WS.length; i++) {
    var w = WS[i];
    if (w[0] === '@') continue;
    var fn = { overview: wsOverview, blast: wsBlast, cost: wsCost, access: wsAccess,
               topology: wsTopology, compliance: wsCompliance, method: wsMethod,
               obligations: wsObligations, trend: wsTrend, rules: wsRules,
               workloads: wsWorkloads, namespaces: wsNamespaces, act: wsAct }[w[0]];
    if (!fn) continue;                       /* findings is the table; it prints as the record below */
    body += '<section class="pr-sec"><h2>' + esc(w[1]) + '</h2>' +
            '<div class="grid">' + fn(rows, t) + '</div></section>';
  }
  body += '<section class="pr-sec"><h2>The full record</h2>' + printRecord(rows) + '</section>';

  host.innerHTML = head + body;
  wireGraph(host);
}

/* Every finding, grouped by the rule it came from — one decision per block, with
   the places it applies. 134 rows would bury the eleven that matter; 62 decisions
   put each one down once. */
function printRecord(rows) {
  var by = {}, i;
  for (i = 0; i < rows.length; i++) (by[rows[i][RULE]] = by[rows[i][RULE]] || []).push(rows[i]);
  var keys = Object.keys(by).sort(function (a, b) {
    var wa = Math.min.apply(null, by[a].map(function (r) { return r[SEV]; }));
    var wb = Math.min.apply(null, by[b].map(function (r) { return r[SEV]; }));
    return wa - wb || by[b].length - by[a].length;
  });
  if (!keys.length) return '<p class="note">No finding is in this cut.</p>';

  return '<div class="pr-rec">' + keys.map(function (k) {
    var g = by[k], m = D.rules[k] || {}, worst = 9, usd0 = 0, j;
    for (j = 0; j < g.length; j++) { if (g[j][SEV] < worst) worst = g[j][SEV]; usd0 += g[j][USD]; }
    var where = [], seen = {};
    for (j = 0; j < g.length; j++) {
      var lbl = g[j][WL] ? wlLabel(wlId(g[j][WL]))
              : g[j][NS] ? g[j][NS] + ' (namespace)' : 'cluster-scoped';
      if (!seen[lbl]) { seen[lbl] = 1; where.push(lbl); }
    }
    var fix = null;
    for (j = 0; j < g.length; j++) {
      var dd = (D.det || {})[g[j][ID]];
      if (dd && (dd.y || dd.c)) { fix = dd; break; }
    }
    return '<article class="pr-dec">' +
      '<div class="pr-dt"><span class="sv sv' + worst + '">' + SEVL[worst] + '</span>' +
        '<span class="pr-dh"><b>' + esc(g[0][TITLE]) + '</b>' +
        '<span class="pr-rid">' + esc(k) + '</span></span>' +
        '<span class="pr-dn">' + plural(g.length, 'finding', 'findings') +
          (usd0 > 0 ? ' · ' + usd(usd0) + '/mo' : '') + '</span></div>' +
      (m.w ? '<p>' + esc(m.w) + '</p>' : '') +
      (m.e && m.e.length ? '<p class="pr-ev">' + esc(m.e.slice(0, 2).join(' · ')) + '</p>' : '') +
      (m.b && m.b.length
        ? '<div class="pr-lim"><span class="h">What this does not establish</span><ul>' +
          m.b.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' : '') +
      (fix ? '<div class="pr-fix"><span class="h">Suggested fix</span><pre>' +
             esc(fix.c || fix.y) + '</pre></div>' : '') +
      '<div class="pr-where">' + where.slice(0, 24).map(function (x) {
        return '<span>' + esc(x) + '</span>'; }).join('') +
        (where.length > 24 ? '<span class="more">+' + num(where.length - 24) + ' more</span>' : '') +
      '</div></article>';
  }).join('') + '</div>';
}

/* WHEN IT IS BUILT, AND WHY IT IS NOT ONLY ON DEMAND.
   `beforeprint` covers the reader pressing Ctrl+P. It does not cover a headless
   render to PDF, a print stylesheet emulated through the devtools protocol, or a
   browser that prints without firing it — and in each of those the paper would
   come out blank, which is the one failure a print path must not have.

   So it is also built once the page has gone quiet. That costs one render of
   every workspace, which is why it waits for idle rather than racing the first
   paint, and `beforeprint` rebuilds it so a reader who narrowed the cut prints
   the cut they are looking at rather than the one that existed at load. */
addEventListener('beforeprint', buildPrintable);
if (window.matchMedia) {
  var mq = window.matchMedia('print');
  var onMq = function (e) { if (e.matches) buildPrintable(); };
  if (mq.addEventListener) mq.addEventListener('change', onMq);
  else if (mq.addListener) mq.addListener(onMq);
  if (mq.matches) buildPrintable();
}
(function () {
  var once = function () { try { buildPrintable(); } catch (e) {} };
  if (window.requestIdleCallback) requestIdleCallback(once, { timeout: 2500 });
  else setTimeout(once, 1200);
})();

/* ── boot ─────────────────────────────────────────────────────────────────── */
/* The document is authored in English and a screen reader needs to be told, or it
   pronounces the whole reading in the user's own locale. The <html> element is
   outside this file's body content, so it is set here rather than in the shell. */
document.documentElement.lang = document.documentElement.lang || 'en';

/* A link is a view: read it before the first paint so the reader never sees the
   whole reading flash past on the way to the cut they were sent. */
(function () { var m = /^#v=(.+)$/.exec(location.hash); if (m) viewApply(m[1]); })();

try { var th = localStorage.getItem('shoalcheck-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (x) {}
$('t-cluster').textContent = D.cluster;
$('t-where').textContent = whereOf('k8s');
$('t-at').textContent = new Date(D.at).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
/* WHAT THE READING IS, AND ONLY THAT. The header said "signed" on every reading, though nothing in the reading
   carries a signature state; it now names a demonstration as one and says nothing it cannot support. */
if (D.illustrative) {
  var st = $('t-state');
  st.textContent = 'Illustrative sample';
  st.title = 'A demonstration reading of a fictional cluster, not a scan of a real one';
  st.hidden = false;
}
render();
window.addEventListener('resize', function () { if (S.ws === 'findings') paintRows(); });

})();

</script>
</body>
</html>
